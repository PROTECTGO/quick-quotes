<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABI · Equipo comercial · Brahian Toro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,1,800&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>if(!window.Chart){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"><\/script>');}</script>
<script src="ver-como-helper.js"></script>
<style>
:root{
  --pg-ink:#1B2D3A; --pg-ink-2:#162630; --pg-mint:#2DBFA3; --pg-mint-soft:#C4E8DF; --pg-mint-deep:#229A82;
  --pg-bg:#F4F7FA; --pg-card:#FFFFFF; --pg-line:#E7EDF2; --pg-txt:#28323B; --pg-muted:#6B7D89;
  --pg-pos:#1F9D6B; --pg-neg:#D5594F; --pg-warn:#D9A520; --pg-azul:#5B6BD6;
  --pg-font-gabi:"Fraunces",Georgia,serif; --pg-font-title:"Montserrat","Arial Black",sans-serif;
  --pg-font-body:"Inter",Arial,Helvetica,sans-serif; --pg-font-num:"JetBrains Mono","Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pg-bg);overflow-y:scroll}
.pg-app{background:var(--pg-bg);color:var(--pg-txt);font-family:var(--pg-font-body);min-height:100vh;display:flex}
.pg-side{width:262px;background:var(--pg-ink);color:#fff;padding:62px 18px 28px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.pg-side .pg-brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pg-side .pg-logo{width:40px;height:40px;border-radius:10px;background:var(--pg-mint);display:flex;align-items:center;justify-content:center;font-family:var(--pg-font-title);font-weight:800;color:var(--pg-ink)}
.pg-side .pg-wordmark{font-family:var(--pg-font-gabi);font-style:italic;font-weight:800;font-size:24px;color:var(--pg-mint);letter-spacing:-.5px}
.pg-side .pg-tagline{font-size:11.5px;color:#8da0ad;margin:-2px 0 22px 52px;letter-spacing:.03em}
.pg-side a{display:flex;align-items:center;gap:13px;padding:12px 15px;border-radius:11px;color:#b9c6d0;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:4px;transition:background .15s;cursor:pointer}
.pg-side a .ico{width:20px;text-align:center}
.pg-side a.on,.pg-side a:hover{background:rgba(45,191,163,.15);color:#fff}
.pg-side a.on{box-shadow:inset 3px 0 0 var(--pg-mint)}
.pg-side .pg-foot{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:#8da0ad;line-height:1.6}
.pg-main{flex:1;padding:32px 38px 60px;max-width:1240px}
.pg-top{margin-bottom:22px}
.pg-top h1{font-family:var(--pg-font-title);font-size:26px;font-weight:800;color:var(--pg-ink);margin:0}
.pg-top .pg-sub{color:var(--pg-muted);font-size:14px;margin-top:5px;max-width:820px;line-height:1.55}
.pg-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--pg-mint-deep);margin-bottom:6px}
.pg-kpis{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pg-kpi{flex:1;min-width:175px;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(27,45,58,.04)}
.pg-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pg-mint)}
.pg-kpi.w::before{background:var(--pg-warn)} .pg-kpi.r::before{background:var(--pg-neg)} .pg-kpi.a::before{background:var(--pg-azul)}
.pg-kpi .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pg-muted)}
.pg-kpi .val{font-family:var(--pg-font-num);font-size:25px;font-weight:600;color:var(--pg-ink);margin:7px 0 3px;font-variant-numeric:tabular-nums}
.pg-kpi .val.neg{color:var(--pg-neg)} .pg-kpi .val.pos{color:var(--pg-pos)}
.pg-kpi .sub{font-size:11.5px;color:var(--pg-muted);line-height:1.45}
.pg-card{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 1px 3px rgba(27,45,58,.04)}
.pg-card h2{font-family:var(--pg-font-title);font-size:17.5px;font-weight:800;color:var(--pg-ink);margin:0 0 4px}
.pg-card .pg-purpose{color:var(--pg-muted);font-size:13px;margin:0 0 14px;line-height:1.5}
.pg-table{width:100%;border-collapse:collapse}
.pg-table th{text-align:left;font-size:11px;color:var(--pg-muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 8px;border-bottom:2px solid var(--pg-ink);font-weight:700}
.pg-table td{padding:10px 8px;font-size:13px;color:#3a4751;border-bottom:1px solid var(--pg-line);vertical-align:middle}
.pg-table tr:hover td{background:#FAFCFD}
.pg-table td.num{font-family:var(--pg-font-num);font-variant-numeric:tabular-nums;color:var(--pg-ink);font-weight:600;text-align:right}
.pg-table th.num{text-align:right}
.pg-table td.num.neg{color:var(--pg-neg)} .pg-table td.num.pos{color:var(--pg-pos)}
.pg-pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pg-pill.ok{background:#E3F4EF;color:var(--pg-pos)} .pg-pill.due{background:#FCEEEC;color:var(--pg-neg)}
.pg-pill.warn{background:#FBF3E2;color:#8a6a1d} .pg-pill.muted{background:#EEF2F5;color:var(--pg-muted)}
.pg-headline{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.pg-semaforo{width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:4px;box-shadow:0 0 0 5px rgba(0,0,0,.04)}
.pg-semaforo.green{background:var(--pg-pos)} .pg-semaforo.amber{background:var(--pg-warn)} .pg-semaforo.red{background:var(--pg-neg)}
.pg-headline-text{font-family:var(--pg-font-title);font-size:21px;font-weight:800;color:var(--pg-ink);line-height:1.3;margin:0}
.pg-headline-sub{color:var(--pg-muted);font-size:13px;margin-top:5px;line-height:1.5}
.pg-section{display:none} .pg-section.on{display:block}
.pg-grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.pg-grid-11{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:980px){.pg-grid-2,.pg-grid-11{grid-template-columns:1fr}}
/* v16 - En telefono el menu lateral de 262px se comia dos tercios de la pantalla y la
   tabla quedaba fuera de vista. Por debajo de 760px el menu se acuesta arriba, se
   desplaza en horizontal, y el contenido usa todo el ancho. Solo aplica en pantalla
   angosta: en escritorio no cambia absolutamente nada. */
@media(max-width:760px){
  .pg-app{display:block}
  .pg-side{width:auto;height:auto;position:static;padding:14px 14px 10px;overflow:visible}
  .pg-side .pg-brand{margin-bottom:6px}
  .pg-side .pg-tagline{margin:-2px 0 10px 0}
  /* Los enlaces cuelgan directo de .pg-side, sin contenedor propio: se vuelven
     pildoras en linea y se acomodan solas en dos renglones. */
  .pg-side a[data-go]{display:inline-flex;padding:7px 13px;border-radius:999px;margin:0 5px 6px 0;font-size:13px}
  .pg-side a[data-go].on{box-shadow:none;background:var(--pg-mint);color:var(--pg-ink)}
  .pg-side .pg-foot{margin-top:10px;padding-top:10px}
  .pg-main{padding:18px 14px 44px;max-width:none}
  .pg-card{padding:16px 14px}
  table.pg-table,table.act-tab,table.det-tab{min-width:560px}
  .pg-card>div[style*="overflow-x"],.pg-card table{max-width:100%}
}
.pg-chart-wrap{position:relative;height:260px} .pg-chart-wrap.tall{height:320px} .pg-chart-wrap.short{height:200px}
.pg-footnote{font-size:11.5px;color:var(--pg-muted);margin-top:26px;border-top:1px solid var(--pg-line);padding-top:14px;line-height:1.6}
select.pg-sel{font-family:var(--pg-font-body);font-size:14px;padding:10px 14px;border:1px solid var(--pg-line);border-radius:999px;background:#fff;color:var(--pg-ink);font-weight:700;min-width:260px}
.pg-warn-box{background:#FBF3E2;border:1px solid #EAD09A;border-radius:12px;padding:13px 17px;color:#8a6a1d;font-size:13px;margin-bottom:14px;line-height:1.55}
.pg-ok-box{background:#E3F4EF;border:1px solid #A8DBC9;border-radius:12px;padding:13px 17px;color:#1c6e50;font-size:13px;line-height:1.55}
.plan-card{background:var(--pg-card);border:1px solid var(--pg-line);border-left:4px solid var(--pg-mint-deep);border-radius:13px;padding:14px 18px;margin-bottom:10px}
.plan-card .pc-t{font-family:var(--pg-font-title);font-weight:800;color:var(--pg-ink);font-size:14px;margin-bottom:4px}
.plan-card .pc-x{font-size:13px;color:var(--pg-txt);line-height:1.5}
.plan-card .pc-p{font-size:12px;color:var(--pg-muted);margin-top:8px}

.pg-login-wrap{max-width:380px;margin:80px auto;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:18px;padding:32px;text-align:center;box-shadow:0 1px 3px rgba(27,45,58,.06)}
.pg-login-wrap h2{font-family:var(--pg-font-title);color:var(--pg-ink);margin:8px 0 6px}
.pg-login-wrap p{color:var(--pg-muted);font-size:13px;margin:0 0 18px}
.pg-login-wrap input{width:100%;padding:11px 13px;margin-bottom:10px;border:1px solid var(--pg-line);border-radius:10px;font-family:var(--pg-font-body);font-size:14px}
.pg-login-wrap .pg-logo{width:44px;height:44px;border-radius:11px;background:var(--pg-mint);display:flex;align-items:center;justify-content:center;font-family:var(--pg-font-title);font-weight:800;color:var(--pg-ink)}
.pg-btn{background:var(--pg-ink);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-family:var(--pg-font-body);font-weight:700;font-size:13.5px;cursor:pointer;width:100%}
.pg-btn.mint{background:var(--pg-mint);color:var(--pg-ink)}
.pg-login-err{color:var(--pg-neg);font-size:12.5px;margin-top:10px;min-height:16px}
.pg-logout{cursor:pointer;text-decoration:underline}

/* ---- FRANJA OSCURA (estilo Karen) ---- */
.fr{background:var(--pg-ink);border-radius:18px;padding:24px 26px;margin-bottom:20px;color:#fff;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.fr .fr-nums{display:flex;gap:30px;flex-wrap:wrap;flex:1;min-width:320px}
.fr .fr-n .l{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8da0ad;margin-bottom:6px}
.fr .fr-n .v{font-family:var(--pg-font-num);font-size:27px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.fr .fr-n .v.mint{color:var(--pg-mint)} .fr .fr-n .v.warn{color:#F0C55A} .fr .fr-n .v.red{color:#F08A80}
.fr .fr-n .s{font-size:11.5px;color:#8da0ad;margin-top:5px}
.fr .fr-ring{width:150px;text-align:center;flex-shrink:0}
.fr .fr-ring .cap{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8da0ad;margin-top:8px}

/* ---- barra meta ---- */
.mt-bar{position:relative;height:9px;border-radius:999px;background:#EDF1F5;overflow:visible;min-width:120px;margin-top:5px}
.mt-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;display:block}
.mt-bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--pg-ink);opacity:.55}
.mt-sub{font-size:11px;color:var(--pg-muted);margin-top:4px;font-family:var(--pg-font-num)}

/* ---- alertas / patrones ---- */
.al{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 18px;border-radius:14px;border:1px solid var(--pg-line);background:#FAFCFD;margin-bottom:12px}
.al .a-l{font-weight:800;color:var(--pg-ink);font-size:14.5px;font-family:var(--pg-font-title)}
.al .a-tag{display:inline-block;margin-left:9px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.al .a-c{color:var(--pg-muted);font-size:13px;margin-top:6px;line-height:1.5;max-width:640px}
.al .a-do{color:var(--pg-ink);font-size:12.5px;margin-top:8px;font-weight:600}
.al .a-v{font-family:var(--pg-font-num);font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.al .a-n{font-size:11px;color:var(--pg-muted);text-align:right;margin-top:3px}
.al.sev-alta{border-left:5px solid var(--pg-neg)} .al.sev-alta .a-v{color:var(--pg-neg)}
.al.sev-media{border-left:5px solid var(--pg-warn)} .al.sev-media .a-v{color:#8a6a1d}
.tag-nofee{background:#FCEEEC;color:#9c3d35} .tag-caida{background:#FBF3E2;color:#8a6a1d}
.tag-premium{background:#E6F0FA;color:#1f5b8f}
.tag-llamadas{background:#FBF3E2;color:#B07E12}
.al1 .a-tag{display:inline-block;margin-left:9px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--pg-line);background:#fff;color:var(--pg-muted);border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--pg-font-body)}
.chip.on{background:var(--pg-ink);color:#fff;border-color:var(--pg-ink)}
.pnum{font-family:var(--pg-font-num);font-variant-numeric:tabular-nums}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--pg-muted);margin-top:12px}
.leg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mini{font-size:11.5px;color:var(--pg-muted);font-family:var(--pg-font-num)}
.pg-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pg-toggle{display:inline-flex;border:1px solid var(--pg-line);border-radius:999px;overflow:hidden;background:#fff}
.pg-toggle button{border:none;background:#fff;color:var(--pg-muted);font-family:var(--pg-font-body);font-weight:700;font-size:12.5px;padding:9px 18px;cursor:pointer}
.pg-toggle button.on{background:var(--pg-ink);color:#fff}

/* ---- BITÁCORA (pestaña 5) ---- */
.bt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.bt-grid label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pg-muted)}
.bt-grid .bt-wide{grid-column:1/-1}
.bt-grid textarea,.bt-grid input,.bt-grid select.pg-sel{font-family:var(--pg-font-body);font-size:14px;font-weight:500;color:var(--pg-txt);padding:11px 13px;border:1px solid var(--pg-line);border-radius:12px;background:#fff;min-width:0;width:100%;text-transform:none;letter-spacing:0}
.bt-grid select.pg-sel{font-weight:700;color:var(--pg-ink)}
.bt-grid textarea{min-height:78px;resize:vertical;line-height:1.5}
.bt-grid textarea:focus,.bt-grid input:focus,.bt-grid select:focus{outline:2px solid var(--pg-mint-soft);border-color:var(--pg-mint)}
.bt-grid input.falta{border-color:var(--pg-neg);background:#FFF7F6}
.bt-acc{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bt-acc .pg-btn{width:auto;padding:12px 22px}
.bt-err{font-size:12.5px;color:var(--pg-neg);font-weight:600}
.bt-ok{font-size:12.5px;color:var(--pg-mint-deep);font-weight:600}
.bt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 0 12px}
.bt-head h2{font-family:var(--pg-font-title);font-size:17px;font-weight:700;color:var(--pg-ink);margin:0}
.bt-head .pg-sub{margin-top:4px}
.bt-item{background:#fff;border:1px solid var(--pg-line);border-left:4px solid #C9D4DC;border-radius:13px;padding:15px 18px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;transition:transform .16s,box-shadow .16s}
.bt-item:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(27,45,58,.08)}
.bt-item.vencido{border-left-color:var(--pg-neg)}
.bt-item.semana{border-left-color:var(--pg-warn)}
.bt-item.abierto{border-left-color:var(--pg-azul)}
.bt-item.hecho{opacity:.62;background:#FAFCFB}
.bt-nom{font-family:var(--pg-font-title);font-weight:700;font-size:15px;color:var(--pg-ink);letter-spacing:-.1px}
.bt-meta{font-size:11.5px;color:var(--pg-muted);margin-top:3px;font-family:var(--pg-font-num)}
.bt-nota{font-size:13.5px;color:var(--pg-txt);margin-top:8px;line-height:1.5;white-space:pre-wrap}
.bt-comp{font-size:13.5px;font-weight:700;color:var(--pg-ink);margin-top:9px;padding-top:9px;border-top:1px dashed var(--pg-line)}
.bt-comp .k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--pg-muted);margin-right:8px}
.bt-item.hecho .bt-comp{text-decoration:line-through;color:var(--pg-muted)}
.bt-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px;white-space:nowrap}
.bt-fecha{font-family:var(--pg-font-num);font-size:12.5px;font-weight:600;color:var(--pg-ink)}
.bt-pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px}
.bt-pill.p-abierto{background:#E6E9FA;color:#3E4CB0}.bt-pill.p-semana{background:#FBF1D8;color:#8A6A14}
.bt-pill.p-vencido{background:#FAE7E5;color:#A63F36}.bt-pill.p-hecho{background:var(--pg-mint-soft);color:#186F5D}.bt-pill.p-nota{background:#EEF1F4;color:#5A6B78}
.bt-chk{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--pg-muted);cursor:pointer;user-select:none}
.bt-chk input{width:16px;height:16px;accent-color:var(--pg-mint-deep);cursor:pointer;margin:0}
.bt-vacio{background:#fff;border:1px dashed var(--pg-line);border-radius:13px;padding:34px;text-align:center;color:var(--pg-muted);font-size:13.5px}
@media (max-width:900px){.bt-grid{grid-template-columns:1fr}.bt-item{grid-template-columns:1fr}.bt-right{flex-direction:row;align-items:center}}

/* ---- actividad registrada por persona ---- */
.act-tab{width:100%;border-collapse:collapse;font-size:13px}
.act-tab th{text-align:left;font-family:var(--pg-font-num);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pg-muted);padding:0 8px 7px;border-bottom:1px solid var(--pg-line)}
.act-tab th.n,.act-tab td.n{text-align:right;font-family:var(--pg-font-num)}
.act-tab td{padding:8px;border-bottom:1px solid var(--pg-line);vertical-align:middle}
.act-tab tr:last-child td{border-bottom:none}
.act-tab .per{font-weight:600;color:var(--pg-ink)}
.act-tab .sem{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.act-tab .sem.verde{background:var(--pg-mint)} .act-tab .sem.ambar{background:var(--pg-warn)} .act-tab .sem.rojo{background:var(--pg-neg)}
.act-tab .cero{color:var(--pg-neg);font-weight:700}
.act-bar{position:relative;height:7px;border-radius:999px;background:#EDF1F5;overflow:hidden;min-width:70px}
.act-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--pg-mint)}
.act-bar i.w{background:var(--pg-warn)} .act-bar i.r{background:var(--pg-neg)}
/* separador entre el bloque del día y el del mes: un rótulo con regla, nada más */
.pg-sub-top{display:flex;align-items:center;gap:12px;margin:30px 0 4px;
  font-family:var(--pg-font-num);font-size:11px;letter-spacing:.16em;font-weight:700;
  text-transform:uppercase;color:var(--pg-muted)}
.pg-sub-top::after{content:"";height:2px;flex:1;border-radius:2px;
  background:linear-gradient(90deg,var(--pg-mint),transparent 45%)}
/* filas del día: se pueden tocar */
#dia-lista .act-tab tbody tr{cursor:pointer}
#dia-lista .act-tab tbody tr:hover{background:var(--pg-mint-soft,#E4F4EF)}

.emb-paso.ok{color:var(--pg-mint)} .emb-paso.w{color:var(--pg-warn)} .emb-paso.r{color:var(--pg-neg)}
.emb-paso.q{color:var(--pg-muted);font-weight:400}
.act-res{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px}
.act-res > div{min-width:120px}
.act-res .l{font-family:var(--pg-font-num);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pg-muted)}

/* ---- v11 · barras por zona, manual, alertas de una línea ---- */
.gr{display:grid;grid-template-columns:180px 1fr 296px 122px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--pg-line)}
.gr:last-child{border-bottom:none}
.gr .g-n{font-family:var(--pg-font-title);font-weight:700;color:var(--pg-ink);font-size:13.5px;letter-spacing:-.1px}
.gr .g-c{font-size:10.5px;color:var(--pg-muted);margin-top:2px}

.gr .g-cif div{text-align:right;min-width:62px;font-family:var(--pg-font-num);font-size:12.5px;font-weight:600;color:var(--pg-ink);font-variant-numeric:tabular-nums}
.gr .g-cif .k{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pg-muted);font-family:var(--pg-font-body);font-weight:700;margin-bottom:2px}
@media(max-width:1120px){.gr{grid-template-columns:1fr;gap:7px}.gr .g-cif{justify-content:flex-start}.gr>div:last-child{text-align:left!important}}

.hq{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--pg-line);background:#fff;color:var(--pg-muted);font:700 11px var(--pg-font-body);cursor:pointer;margin-left:8px;padding:0;line-height:1;vertical-align:middle;flex-shrink:0}

.hero-pie{display:flex;align-items:center;gap:9px;font-size:12px;color:#8da0ad;border-top:1px solid rgba(255,255,255,.1);padding-top:13px;margin-top:18px;flex-wrap:wrap;line-height:1.5}
.hero-pie .pg-semaforo{width:9px;height:9px;box-shadow:none;margin:0;flex-shrink:0}
@media(max-width:820px){.hero-mes{font-size:38px}.fr.hero{padding:22px 20px 14px}}

<body>

<div id="root-outer"></div>

<template id="tpl-app">
<div class="pg-app">
 <aside class="pg-side">

 </aside>
 <main class="pg-main">

  <!-- ============ 1 · EL MES ============ -->
  <section class="pg-section on" id="s-mes">
    <div class="pg-top">
      <div class="pg-eyebrow">Dirección comercial</div>
      <h1>Meta<button class="hq" type="button" data-h="lo_que_va">?</button></h1>
    </div>

      <div class="hero-mes-s" id="h-mes-s"></div>

      <div class="hero-cir">
        <div class="hc">
          <div class="hc-lbl">Lo que va del mes</div>
          <div class="hc-ring"><canvas id="ringEquipo"></canvas>
            <div class="hc-in"><div class="hc-v" id="h-va">—</div><div class="hc-s" id="h-va-s"></div></div></div>
          <div class="hc-pie" id="h-va-pie"></div>
        </div>
        <div class="hc">
          <div class="hc-lbl">Meta plena</div>
          <div class="hc-ring"><canvas id="ringPlena"></canvas>
            <div class="hc-in"><div class="hc-v" id="h-plena">—</div><div class="hc-s" id="h-plena-s"></div></div></div>
          <div class="hc-pie" id="h-plena-pie"></div>
        </div>
      </div>

      <div class="hero-pie"><span class="pg-semaforo red" id="hl-sem"></span><span id="hl-txt">—</span><button class="hq d" type="button" data-h="anillo">?</button></div>

        <button class="chip" data-f="verde">En la meta plena</button>
        <button class="chip" data-f="camada">En curva</button>

    </div>

    <div class="pg-kpis">
      <div class="pg-kpi"><div class="lbl" id="r-vol-l">Último mes cerrado</div><div class="val" id="r-vol">—</div><div class="sub" id="r-vol-s"></div></div>
      <div class="pg-kpi"><div class="lbl">Utilidad del equipo<button class="hq" type="button" data-h="utilidad">?</button></div><div class="val pos" id="r-util">—</div><div class="sub" id="r-util-s"></div></div>
      <div class="pg-kpi a"><div class="lbl">Tu ingreso<button class="hq" type="button" data-h="ingreso">?</button></div><div class="val" id="r-ing">—</div><div class="sub" id="r-ing-s"></div></div>
      <div class="pg-kpi w"><div class="lbl">Fee del mes<button class="hq" type="button" data-h="fee">?</button></div><div class="val" id="r-fmes">—</div><div class="sub" id="r-fmes-s"></div></div>
    </div>

        <th>Persona</th><th class="num">Lo que lleva</th><th class="num">Su meta</th><th class="num">Le falta</th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <!-- ============ 2 · EQUIPO ============
       v16 - dia-card + act-card + emb-card de la v15 se funden en una sola tabla
       con interruptor Ayer | Este mes (menos informacion a la vez, mismo dato). -->
  <section class="pg-section" id="s-hoy">
    <div class="pg-top">
      <div class="pg-eyebrow">Actividad del equipo</div>
      <h1 id="dia-titulo">Ayer<button class="hq" type="button" data-h="positivo">?</button></h1>

        <div class="pg-toggle" id="tg-act">
          <button class="on" data-v="ayer">Ayer</button>
          <button data-v="mes">Este mes</button>
        </div>
      </div>
      <h2 id="dia-h2">Ayer, persona por persona</h2>
      <p class="pg-purpose" style="margin:0 0 14px"><b>Toca una persona</b> para ver su mes y qué registró.</p>

    <div class="pg-card" id="det-card" hidden></div>

  <!-- ============ 3 · ALERTAS ============ -->
  <section class="pg-section" id="s-alertas">

      <div class="pg-eyebrow">Sentarse</div>
      <h1>Con quién sentarse esta semana</h1>

      <div class="pg-semaforo red" id="p-titular-sem"></div>
      <div><p class="pg-headline-text" id="p-titular">—</p></div>

      <div id="alertas"></div>

        <thead><tr><th>Persona</th><th class="num">Cuentas</th><th class="num">Con fee</th><th class="num">Fee cobrado</th><th class="num">Estándar</th><th class="num">Le falta</th></tr></thead>
        <tbody id="tb-estandar"></tbody>
      </table>

  <!-- ============ 4 · PERSONA ============ -->
  <section class="pg-section" id="s-persona">

      <div class="fr-nums">

        <div class="fr-n"><div class="l">Su meta</div><div class="v" id="pp-min">—</div><div class="s" id="pp-min-s"></div></div>

        <div class="fr-n"><div class="l">Fee del año</div><div class="v mint" id="pp-fee">—</div><div class="s" id="pp-fee-s"></div></div>
      </div>
      <div class="fr-ring">
        <div style="position:relative;height:130px"><canvas id="ringPersona"></canvas></div>
        <div class="cap" id="pp-cap">de su meta plena</div>

    <div class="pg-card" style="padding:15px 22px">
      <div style="font-size:14px;color:var(--pg-txt);line-height:1.55" id="pp-mes">—</div>
    </div>

    <div class="pg-card" id="pp-box"></div>

  <!-- ============ 6 · AÑO ============ -->
  <section class="pg-section" id="s-ano">
    <div class="pg-top">

function render(D){
const ML = D.meses;
const INK="#1B2D3A", MINT="#2DBFA3", MINTD="#229A82", AZUL="#5B6BD6", AMBAR="#D9A520", ROJO="#D5594F", MUTED="#6B7D89", LINE="#E7EDF2";
const usd = n => "$" + Math.round(Math.abs(n)).toLocaleString("en-US");
const usdS = n => (n<0?"-":"") + usd(n);
const k = n => "$" + Math.round(n/1000) + "K";
const sum = a => a.reduce((s,x)=>s+x,0);
const nom = n => n.replace(/\s*\([^)]*\)\s*$/,'').trim();
const nivC = v => v.indexOf('Meta plena')===0 ? 'Meta plena' : v.replace(' en operación','');
/* ============================================================
   SISTEMA DE GRAFICAS (v11/SISTEMA_GRAFICAS.md) · una sola manera de dibujar.
   Antes cada grafica traia su propia tension, su grosor, sus puntos y sus rayas:
   se leia como una sierra con ruido. Aqui hay UN helper de linea, UNO de barra,
   UN par de ejes, UN tooltip y UN plugin de bandas. Las diez las usan.
   ============================================================ */
Chart.defaults.font.family="Inter, Arial, sans-serif"; Chart.defaults.font.size=11.5;
Chart.defaults.color='#6B7D89'; Chart.defaults.plugins.legend.display=false;
function grad(ctx,color,a1,a2){const g=ctx.createLinearGradient(0,0,0,300);g.addColorStop(0,color+a1);g.addColorStop(1,color+a2);return g;}
function moneyTick(v){return v===0?"0":(Math.abs(v)>=10000?k(v):usdS(v));}
function tk(vals){const mx=Math.max(...vals.map(x=>Math.abs(Number(x)||0)));
  return mx>=20000 ? (v=>v===0?"0":k(v)) : (v=>v===0?"0":usdS(v));}

/* Techo redondo del eje: $100K, $1,100K… nunca "$98K". */
function techo(v){ if(!(v>0))return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))-1), m=v/e;
  const paso=e*(m<=15?1:(m<=30?2:(m<=70?5:10)));
  return Math.ceil(v/paso)*paso; }
const BASE={responsive:true,maintainAspectRatio:false,resizeDelay:80,
  animation:{duration:600,easing:'easeOutQuart'}};
const TIP={backgroundColor:INK,padding:11,cornerRadius:8,displayColors:false,
  titleFont:{family:"'Montserrat', sans-serif",size:12},
  bodyFont:{family:"'JetBrains Mono', monospace",size:12}};
const AXIS_X={grid:{display:false},border:{display:false},
  ticks:{font:{family:"'Montserrat', sans-serif",size:10.5},color:'#6B7D89',padding:6}};
const AXIS_CAT={grid:{display:false},border:{display:false},
  ticks:{autoSkip:false,font:{family:"'Montserrat', sans-serif",size:10.5},color:'#6B7D89'}};
function AXIS_Y(vals,extra){
  return Object.assign({grid:{color:'#EEF2F5',drawTicks:false},border:{display:false},beginAtZero:true,
    ticks:{font:{family:"'JetBrains Mono', monospace",size:10.5},color:'#6B7D89',padding:8,
           maxTicksLimit:5,callback:tk(vals)}}, extra||{});
}
/* La onda es el heroe del lienzo: trazo con peso, relleno denso y sombra suave.
   monotone, nunca `tension` a secas: asi la curva no se pasa de largo entre dos puntos. */
function LINEA(color,extra){
  return Object.assign({
    cubicInterpolationMode:'monotone', tension:0, borderWidth:3.5, borderColor:color,
    fill:true, backgroundColor:c=>grad(c.chart.ctx,color,'5E','02'),
    pointRadius:c=>(c.dataIndex===(c.dataset.data.length-1)?5:0),
    pointBackgroundColor:'#fff', pointBorderColor:color, pointBorderWidth:2.5,
    pointHoverRadius:5.5, pointHoverBackgroundColor:'#fff',
    pointHoverBorderColor:color, pointHoverBorderWidth:2.5, clip:8
  }, extra||{});
}
function hexA(h,a){ const n=parseInt(String(h).replace('#',''),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
/* Relieve sin agregar un solo color nuevo. */
const SOMBRA={id:'sombra',
  beforeDatasetDraw(c,args){ const ctx=c.ctx; ctx.save();
    const ds=(c.data.datasets||[])[args.index]||{};
    if((ds.type||c.config.type)==='line'){
      const col=(typeof ds.borderColor==='string')?ds.borderColor:MINTD;
      ctx.shadowColor=hexA(col,.35); ctx.shadowBlur=12; ctx.shadowOffsetY=5; } },
  afterDatasetDraw(c){ c.ctx.restore(); }};
function BARRA(color,extra){
  return Object.assign({backgroundColor:color,borderRadius:6,barPercentage:.62,
    categoryPercentage:.8,borderSkipped:false}, extra||{});
}
/* Las metas dejan de ser rayas encima de la onda: son bandas de fondo, la misma lengua
   de los anillos y las barras. Va en beforeDatasetsDraw para quedar por debajo. */
/* ============================================================
   EL EJE SALE DE LOS DATOS, NO DE LA META. Estirar el eje hasta la meta plena
   aplastaba la onda contra el piso y la mataba. Si la meta cabe, va como linea
   de referencia gris; si queda por encima, va como techo ambar con la frase
   que dice el estado en palabras, sin pintar el lienzo.
   ============================================================ */
/* El techo cae en un multiplo de un paso bonito, para que las 5 marcas del eje
   den numeros redondos ($200K, $400K…) en vez de "$110K / $100K / $50K". */
function pasoBonito(v){ if(!(v>0))return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), m=v/e;
  return e*(m<=1?1:(m<=2?2:(m<=2.5?2.5:(m<=3?3:(m<=5?5:10)))));
}
function techoOnda(datos, piso, refs){
  const mx = Math.max.apply(null,(datos||[]).map(v=>Number(v)||0).concat([0]));
  const objetivo = mx>0 ? mx*1.18 : Math.max(1,(Number(piso)||1000)*1.05);
  const paso = pasoBonito(objetivo/4);
  let tope = Math.ceil(objetivo/paso)*paso;
  /* si una referencia queda pegada al borde no se veria ni como linea ni como techo: subimos un paso */
  if((refs||[]).some(r=>r>tope*0.94 && r<=tope)) tope += paso;
  return tope;
}
/* refs: [{v, t, peso:'fuerte'|'suave'}] · periodo: 'el año' | 'el periodo' */
function referencias(refs, periodo){
  return {id:'refs', afterDatasetsDraw(c){
    if(!c.chartArea||!c.scales||!c.scales.y)return;
    const ctx=c.ctx, a=c.chartArea, Y=c.scales.y, tope=Y.max;
    const lista=(refs||[]).filter(r=>r&&Number(r.v)>0);
    ctx.save(); ctx.setLineDash([]);
    /* las que caben: linea solida fina gris con su etiqueta */
    const puestas=[];
    lista.filter(r=>r.v<=tope).sort((x,y)=>y.v-x.v).forEach(r=>{
      const y=Y.getPixelForValue(r.v);
      if(y<=a.top+2||y>=a.bottom-1)return;
      ctx.beginPath();ctx.moveTo(a.left,y);ctx.lineTo(a.right,y);
      ctx.strokeStyle=(r.peso==='suave'?'rgba(107,125,137,.45)':'rgba(107,125,137,.75)');
      ctx.lineWidth=1;ctx.stroke();
      const txt=r.t+' '+usd(r.v);
      ctx.font='600 10px Inter, Arial';ctx.textAlign='right';
      /* si la etiqueta de arriba queda pegada, esta se va por debajo de su linea */
      const choca=puestas.some(q=>Math.abs(q-(y-9))<15);
      const cy = choca ? y+9 : y-9;
      puestas.push(cy);
      ctx.textBaseline='middle';
      /* halo de texto, no caja opaca: la caja le borraba un tramo a la onda */
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineJoin='round';
      ctx.strokeText(txt,a.right-4,cy);
      ctx.fillStyle='#6B7D89';ctx.fillText(txt,a.right-4,cy);
    });
    /* la mas baja que no cabe: techo ambar con flecha y la frase en palabras */
    const fuera=lista.filter(r=>r.v>tope).sort((x,y)=>x.v-y.v)[0];
    if(fuera){
      const y=a.top+0.75;
      ctx.beginPath();ctx.moveTo(a.left,y);ctx.lineTo(a.right,y);
      ctx.strokeStyle='rgba(217,165,32,.9)';ctx.lineWidth=1.5;ctx.stroke();
      const txt='↑ '+fuera.t+' '+usd(fuera.v)+' — por encima de todo '+(periodo||'el periodo');
      ctx.font='700 10.5px Inter, Arial';ctx.textAlign='right';ctx.textBaseline='top';
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineJoin='round';
      ctx.strokeText(txt,a.right-4,y+5);
      ctx.fillStyle='#B07E12';ctx.fillText(txt,a.right-4,y+5);
    }
    ctx.restore();
  }};
}

/* ============================================================
   REGLA DE LA CASA (REGLA_ANILLOS_META_MINIMA_META_PLENA_9SEP2026)
   Una sola funcion de color y un solo dibujo de anillo/barra:
     · el avance se mide SIEMPRE contra la meta plena, nunca contra el ritmo
     · pista por zonas: rojo hasta la minima · ambar de la minima a la plena · verde en la plena
     · el ritmo NO pinta: es una marca (tick) en la pista y una palabra debajo
   ============================================================ */
function zona(valor, minima, plena){
  const v=Number(valor)||0, mi=Number(minima)||0, pl=Number(plena)||0;
  if(pl>0 && v>=pl) return 'verde';
  if(mi>0 && v>=mi) return 'ambar';
  return 'rojo';
}
const Z_OSC={verde:MINT,   ambar:'#F0C55A', rojo:'#F08A80'};   /* sobre fondo oscuro */
const Z_CLA={verde:MINTD,  ambar:AMBAR,     rojo:ROJO};        /* sobre fondo claro  */
const Z_PISTA_OSC={rojo:'rgba(240,138,128,.30)', ambar:'rgba(240,197,90,.34)'};
const Z_PISTA_CLA={rojo:'#FBEAE8',               ambar:'#FBF3E2'};
function colZona(valor,minima,plena,fondo){ return (fondo==='claro'?Z_CLA:Z_OSC)[zona(valor,minima,plena)]; }

function ritmoPct(v,d){ const D=Number(d)||0; return D>0 ? (Number(v)||0)/D*100 : ((Number(v)||0)>0?200:0); }
/* Bandas decididas 9-sep: adelante >=105% · en el ritmo 95-105% · atras <95% del "deberia ir hoy". */
function ritmoPal(v,d){ const p=ritmoPct(v,d); return p>=105?'adelante':(p>=95?'en el ritmo':'atrás'); }
function ritmoFrase(v,d){ const w=ritmoPal(v,d); return w==='en el ritmo'?'en el ritmo':w+' del ritmo'; }

/* Un solo dibujo de anillo. o = {valor, minima, plena, tick, fondo, centro, plano}
   · plano:'color'  -> aro completo de un solo color (los circulos-objetivo del encabezado)
   · centro:false   -> no escribe el % adentro (el texto va en HTML encima) */
function anillo(el, o){
  if(!el) return {destroy(){}};
  const dpr = window.devicePixelRatio||1;
  const osc = o.fondo!=='claro';
  function pinta(){
    const box = el.parentNode ? el.parentNode.getBoundingClientRect() : {width:150,height:130};
    const w = Math.max(70, box.width||150), h = Math.max(70, box.height||130);
    el.style.width=w+'px'; el.style.height=h+'px';
    el.width=Math.round(w*dpr); el.height=Math.round(h*dpr);
    const g=el.getContext('2d'); if(!g) return;
    const x=el.width/2, y=el.height/2;
    const R=Math.min(el.width,el.height)/2 - 3*dpr;
    const LW=Math.max(7*dpr, R*0.26), r=R-LW/2;
    const pl=Number(o.plena)||0, val=Number(o.valor)||0;
    const pct = pl>0 ? val/pl*100 : 0;
    const mp  = pl>0 ? Math.max(0,Math.min(100,(Number(o.minima)||0)/pl*100)) : 0;
    const A=p=>(-Math.PI/2)+(Math.PI*2)*(p/100);
    const arco=(p0,p1,col)=>{ if(!(p1>p0))return; g.beginPath(); g.arc(x,y,r,A(p0),A(p1));
      g.strokeStyle=col; g.lineWidth=LW; g.lineCap='butt'; g.stroke(); };
    g.clearRect(0,0,el.width,el.height);
    if(o.plano){ arco(0,100,o.plano); return; }
    /* pista por zonas */
    const P = osc?Z_PISTA_OSC:Z_PISTA_CLA;
    arco(0,mp,P.rojo); arco(mp,100,P.ambar);
    /* arco de avance, con el color de la zona donde termina */
    const vacio = osc?'rgba(255,255,255,.16)':'#E7EDF2';
    const col = val>0 ? colZona(val,o.minima,pl,osc?'oscuro':'claro') : vacio;
    arco(0, Math.max(0,Math.min(100,pct)), col);
    /* el "deberia ir hoy": una marca, nunca un color */
    if(o.tick!=null && pl>0){
      const tp=Math.max(0,Math.min(100,(Number(o.tick)||0)/pl*100)), ang=A(tp);
      g.beginPath();
      g.moveTo(x+Math.cos(ang)*(r-LW/2-1.5*dpr), y+Math.sin(ang)*(r-LW/2-1.5*dpr));
      g.lineTo(x+Math.cos(ang)*(r+LW/2+1.5*dpr), y+Math.sin(ang)*(r+LW/2+1.5*dpr));
      g.strokeStyle= osc?'#FFFFFF':INK; g.lineWidth=2.4*dpr; g.stroke();
    }
    if(o.centro===false) return;
    g.fillStyle = val>0 ? col : (osc?'#8da0ad':MUTED);
    g.textAlign='center'; g.textBaseline='middle';
    g.font='700 '+Math.round(24*dpr)+'px "JetBrains Mono", monospace';
    g.fillText(Math.round(pct)+'%', x, y);
  }
  pinta(); requestAnimationFrame(pinta);
  const on=()=>{ try{pinta();}catch(e){} }; window.addEventListener('resize',on);
  return { destroy(){ window.removeEventListener('resize',on);
    try{ const g=el.getContext('2d'); g.clearRect(0,0,el.width,el.height); }catch(e){} } };
}

/* La misma regla, en barra: escala hasta la plena, franja ambar desde la minima, tick del deberia */
function barraZ(val, mi, pl, deb){
  const P = Number(pl)||1, v=Number(val)||0;
  const mp = Math.max(0,Math.min(100,(Number(mi)||0)/P*100));
  const w  = Math.max(0,Math.min(100, v/P*100));
  const col = v>0 ? Z_CLA[zona(v,mi,P)] : LINE;
  const bg = 'linear-gradient(90deg,'+Z_PISTA_CLA.rojo+' 0 '+mp.toFixed(1)+'%,'+Z_PISTA_CLA.ambar+' '+mp.toFixed(1)+'% 100%)';
  const t = (deb==null) ? '' : '<u style="left:'+Math.max(0,Math.min(100,(Number(deb)||0)/P*100)).toFixed(1)+'%"></u>';
  return '<div class="mt-bar" style="background:'+bg+'"><i style="width:'+w.toFixed(1)+'%;background:'+col+'"></i>'+t+'</div>';
}

/* El chip: Meta plena · Meta minima · En el ritmo · Atras · Sin venta */
function chipZ(val, mi, pl, deb){
  const v=Number(val)||0;
  if(Number(pl)>0 && v>=Number(pl)) return '<span class="pg-pill ok">Meta plena</span>';
  if(v<=0) return '<span class="pg-pill muted">Sin venta</span>';
  return ritmoPct(v,deb)>=95 ? '<span class="pg-pill warn">En el ritmo</span>'
                             : '<span class="pg-pill due">Atrás</span>';
}

/* Las graficas de una pestaña cerrada NO se crean: Chart.js no puede medir un canvas
   escondido, nace en cero y al intentar arreglarlo despues entra en bucle de redimensionado.
   Cada pestaña arma las suyas la primera vez que se abre, y nunca mas.
   "El mes" es la pestaña que abre por defecto: sus graficas si se arman de una. */
const GRAF={}, LISTO={};
/* v16 - era la ultima grafica de BARRAS viva del tablero y la regla de la casa es
   cero barras de datos. Dice lo mismo en tabla, se lee mas rapido y no hay que
   interpretar un eje: quien ya llego a su minima sale con la pildora, no con un

             .sort((a,b)=>b.f-a.f || b.lleva-a.lleva);
document.querySelector('#tb-falta tbody').innerHTML = falta.map(r=>
  '<tr><td><b>'+r.n+'</b></td>'
  +'<td class="num">'+usd(r.lleva)+'</td>'
  +'<td class="num" style="color:var(--pg-muted)">'+usd(r.meta)+'</td>'
  +'<td class="num'+(r.f>0?' neg':'')+'">'
    +(r.f>0 ? usd(r.f) : '<span class="pg-pill ok">Ya cumplió la meta</span>')
  +'</td></tr>').join('');

/* ===== PATRONES · con quién sentarse esta semana =====
   Seis patrones, en un orden de prioridad FIJO (nunca por plata estimada — ver
   CONTRATO_v16). ALERTAS trae todos los patrones que dispara cada quien (la ficha
   de Persona sigue usándola tal cual); SENTARSE deduplica a una línea por persona,
   quedándose con su patrón de mayor prioridad — así arma "la lista" y el titular. */
const iA = E.length-1;
/* Hora de Colombia (UTC-5, sin horario de verano) para la alerta SIN_LLAMAR — nunca la
   hora del navegador de quien mira la pantalla. */
const HORA_COL = new Date(Date.now() - 5*3600000);
const diaColHoy = HORA_COL.getUTCDay(); // 0 domingo … 6 sábado
const esHabilHoy = diaColHoy>=1 && diaColHoy<=5;
const horaColHoy = HORA_COL.getUTCHours();
function detecta(a){
  const out=[];
  /* 1 · sin llamar: día hábil, 11:00 o más hora Colombia, y llamadas_hoy en 0 EXACTO
     (no null: quien no tiene usuario de RingCentral no trae el dato y no alerta). */
  if(esHabilHoy && horaColHoy>=11 && a.llamadas_hoy===0)
    out.push({n:a.n,p:'SIN_LLAMAR',d:'va el día en cero · son las '+horaColHoy+':00',
      t:'No registró ninguna llamada hoy. Van las '+horaColHoy+':00 (hora Colombia) y sigue en cero.'});
  /* 2 · marca, no conversa: sale del embudo antes de la conversación. Necesita dato
     real de RingCentral (null = sin paquete, no alerta) y algo de volumen de llamadas. */
  /* El umbral de 1 cada 100 marcaba a 9 de 13 personas: en este equipo conversar el
     1 % de lo marcado es lo NORMAL, no la excepcion. Con 1 cada 300 y un piso de 300
     llamadas queda una lista con la que de verdad se puede uno sentar. */
  if(a.llamadas_mes!=null && a.llamadas_mes>=300 && N(a.conversaciones_mes)*300 < a.llamadas_mes)
    out.push({n:a.n,p:'MARCA_NO_CONVERSA',d:a.conversaciones_mes+' conversaciones de '+a.llamadas_mes+' llamadas',
      t:'Hizo '+a.llamadas_mes+' llamadas este mes y solo '+a.conversaciones_mes+' pasaron de dos minutos. Marca, pero no llega a conversar.'});
  /* 3 · cobra y no vende: el fee del mes ya llegó a $2.500 pero el premium no llega a
     $35.000 — la escala de fee pide las dos puertas del 30 %, no solo el fee. */
  if(a.m.ven>0 && a.m.fees>=2500 && (a.m.mc-a.m.fees*10)<35000)
    out.push({n:a.n,p:'COBRA_Y_NO_VENDE',d:usd(a.m.fees)+' de fee · solo '+usd(a.m.mc-a.m.fees*10)+' de premium',
      t:'Cobró '+usd(a.m.fees)+' de fee y movió '+usd(a.m.mc-a.m.fees*10)+' de premium en '+a.m.ven+(a.m.ven===1?' cuenta':' cuentas')+' este mes. La escala pide $2.500 de fee Y $35.000 de premium.'});
  /* 4 · vende y no cobra: 3 o más CUENTAS este mes (ventas_mes del contrato, ya viene
     en cuentas — no en pólizas) y 66 % o más de esas cuentas sin fee. */
  const vCuentas = a.ventas_mes!=null ? a.ventas_mes : a.m.ven;
  /* Las cuentas SIN fee las cuenta el motor. Antes se usaba a.m.sf, que va en POLIZAS:
     con eso Dayanna salia "4 de 4 cuentas sin fee" teniendo $450 de fee cobrado. */
  const cSinFee = a.cuentas_sin_fee_mes;
  if(cSinFee!=null && vCuentas>=3 && cSinFee/vCuentas>=0.66)
    out.push({n:a.n,p:'VENDE_SIN_COBRAR',d:cSinFee+' de '+vCuentas+' cuentas sin fee',
      t:'Vendió '+vCuentas+' cuentas y '+cSinFee+' salieron sin fee. Movió '+usd(a.m.mc)+' y solo entraron '+usd(a.m.fees)+' de fee.'});
  /* 5 · se apagó: vendió el mes pasado (cerrado) y este mes, en curso, va en cero. */
  if(!a.cam && a.mc[iA]>0 && a.m.mc<=0)
    out.push({n:a.n,p:'SE_APAGO',d:'0 en '+MESLBL+' · el mes pasado movió '+usd(a.mc[iA]),
      t:'No ha registrado ventas en '+MESLBL+'. El mes anterior había movido '+usd(a.mc[iA])+' en '+a.ven[iA]+' cuentas.'});
  /* 6 · perdió el ritmo: va en menos de la mitad de lo que movió el mes pasado (piso de
     $15.000 para no alertar variaciones chiquitas). */
  if(!a.cam && a.m.mc>0 && a.mc[iA]>=15000 && a.m.mc<a.mc[iA]*0.5)
    out.push({n:a.n,p:'CAIDA_DE_RITMO',d:'de '+usd(a.mc[iA])+' a '+usd(a.m.mc),
      t:'El mes pasado movió '+usd(a.mc[iA])+' y este mes va en '+usd(a.m.mc)+'.'});
  return out;
}
const TAGS={
 SIN_LLAMAR:{t:'sin llamar',c:'tag-llamadas',s:'alta',do:'preguntar qué pasó antes del mediodía'},
 MARCA_NO_CONVERSA:{t:'marca, no conversa',c:'tag-llamadas',s:'alta',do:'escuchar una llamada suya con esa persona'},
 COBRA_Y_NO_VENDE:{t:'cobra y no vende',c:'tag-premium',s:'alta',do:'mirar el tamaño de lo que está cotizando, no el fee'},
 VENDE_SIN_COBRAR:{t:'vende y no cobra',c:'tag-nofee',s:'alta',do:'sentarse a mirar por qué salen sin fee'},
 SE_APAGO:{t:'se apagó',c:'tag-caida',s:'alta',do:'primera conversación de la semana'},
 CAIDA_DE_RITMO:{t:'perdió el ritmo',c:'tag-caida',s:'media',do:'revisar la agenda de la semana'}
};
const PRIO={SIN_LLAMAR:0,MARCA_NO_CONVERSA:1,COBRA_Y_NO_VENDE:2,VENDE_SIN_COBRAR:3,SE_APAGO:4,CAIDA_DE_RITMO:5};

   el de mayor prioridad — eso, y nunca la plata, es lo que decide el orden. */
const porPersona={};
ALERTAS.forEach(al=>{ if(!porPersona[al.n] || PRIO[al.p]<PRIO[porPersona[al.n].p]) porPersona[al.n]=al; });
const SENTARSE=Object.values(porPersona).sort((x,y)=>PRIO[x.p]-PRIO[y.p] || nom(x.n).localeCompare(nom(y.n)));

/* La única plata de la pestaña, y es plata real: fee cobrado este mes contra el
   estándar de la casa, todo el equipo, peor brecha primero. */
const tEstandar=A.map(a=>{
  /* Cuentas con fee las cuenta el motor (cuentas_con_fee_mes). Antes se restaba
     ventas_sin_fee, que va en POLIZAS, de ventas_mes, que desde la v16 va en CUENTAS:
     restar polizas de cuentas pintaba "con fee 0" en filas con $2.850 cobrados. */
  const cu=a.ventas_mes!=null?a.ventas_mes:a.m.ven;

/* ===== Cambio 2 -- franja de curva y "su plan corto", en la ficha de Persona =====
   Misma llamada que ve la persona en su Mi proceso: SB.rpc('simular_sueno_de',{p_agente}).
   Nunca bloquea el resto de la ficha (se llama sin await desde pintaPersona) y nunca truena
   la pantalla si la RPC falla: el bloque simplemente se queda vacio. "tok" descarta una
   respuesta tardia de una persona que el usuario ya dejo de estar mirando. */
let curvaTok = 0;
const escP = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoyAnio = new Date().getFullYear();
/* Fechas YYYY-MM-DD -> "noviembre" (mismo año) / "febrero de 2027" (otro año). */
function mesEs(iso){
  if(!iso) return '—';
  const p=String(iso).split('-'), mes=MESL[Number(p[1])-1];
  if(!mes) return '—';
  return mes.toLowerCase() + (Number(p[0])!==hoyAnio ? ' de '+p[0] : '');
}
function planCardHTML(p){
  return '<div class="plan-card"><div class="pc-t">'+escP(p.titulo)+'</div>'
    +'<div class="pc-x">'+escP(p.texto)+'</div>'
    +(p.que_pido ? '<div class="pc-p">'+escP(p.que_pido)+'</div>' : '')
    +'</div>';
}
async function cargarCurvaYPlan(nombre){
  const tok = ++curvaTok;
  const elC=document.getElementById('pp-curva'), elC1=document.getElementById('pp-curva-1'), elC2=document.getElementById('pp-curva-2');
  const elP=document.getElementById('pp-planes'), elD=document.getElementById('pp-diag');
  if(elC) elC.hidden=true; if(elC1) elC1.innerHTML=''; if(elC2) elC2.textContent='';
  if(elP) elP.innerHTML=''; if(elD) elD.innerHTML='';
  let sd=null;
  try{
    const r = await SB.rpc('simular_sueno_de', { p_agente: nombre });
    if(!r.error) sd = r.data;
  }catch(e){ console.error('simular_sueno_de', e); }
  if(tok!==curvaTok || !sd) return; // otra persona ya se abrio, o no hubo respuesta: la ficha se queda sin este bloque

  /* franja de curva: caso A ya trae sd.curva armado; caso B (sin sueno) se arma con sd.meta */
  let curva = null;
  if (sd.curva && sd.curva.activa) {
    curva = sd.curva;
  } else if (sd.sin_sueno && sd.meta && Number(sd.meta.factor) < 1) {
    curva = { pct:Math.round(Number(sd.meta.factor)*100), meta:sd.meta.meta, plena:sd.meta.plena,
      sube_a:sd.meta.sube_a, mes_sube:sd.meta.sube_en, mes_pleno:sd.meta.pleno_en,
      ritmo:(sd.metricas&&sd.metricas.ritmo)||0 };
  }
  if (curva && elC1 && elC2 && elC) {
    const pctSig = curva.sube_a>0 ? Math.round((Number(curva.ritmo)||0)/curva.sube_a*100) : null;
    elC1.textContent = 'Va con curva de aprendizaje: su meta de este mes es '+usd(curva.meta)+' ('+Math.round(curva.pct)+'%). '
      +'En '+mesEs(curva.mes_sube)+' sube a '+usd(curva.sube_a)+', y en '+mesEs(curva.mes_pleno)+' llega al estándar, '+usd(curva.plena)+'.';
    elC2.textContent = curva.ritmo>0
      ? 'A su ritmo de hoy ('+usd(curva.ritmo)+' al mes) en '+mesEs(curva.mes_sube)+' iría en '+(pctSig==null?'—':pctSig)+'% de la meta nueva.'
      : '';
    elC.hidden = false;
  }

  /* su plan corto: 1 o 2 tarjetas, o el aviso de que todavia no puso el sueno */
  if (elP) {
    if (sd.sin_sueno) {
      elP.innerHTML = '<div style="font-size:13px;color:var(--pg-muted);margin-bottom:14px">Todavía no ha puesto su sueño en Mi proceso.</div>';
    } else if (Array.isArray(sd.planes) && sd.planes.length) {
      elP.innerHTML = sd.planes.slice(0,2).map(planCardHTML).join('');
    }
  }

  /* diagnostico util para Brahian, solo si aplica */
  if (elD && sd.metricas) {
    const diag=[];
    if (sd.metricas.registro_incompleto) diag.push('Vende más cuentas de las que registra en HubSpot.');
    if (sd.metricas.fee_x_venta!=null && Number(sd.metricas.fee_x_venta) < 250) diag.push('Cobra '+usd(sd.metricas.fee_x_venta)+' de fee por venta; la casa pide $250.');
    elD.innerHTML = diag.map(t=>'<div style="font-size:12.5px;color:var(--pg-muted);line-height:1.5;margin-bottom:14px">'+t+'</div>').join('');
  }
}

    ? '<b>'+usd(a.m.mc)+'</b> en '+a.m.ven+' venta'+(a.m.ven===1?'':'s')+' · '+usd(a.m.fees)+' de fee · a este paso cierra en <b>'+usd(a.m.proy)+'</b>'

  } else {
    box.innerHTML='<div class="al1 sev-media"><span class="a-l">'+nom(a.n)+'</span><span class="sep">·</span><span class="a-c">'+Math.round(pct)+'% de su meta plena · '+ritmoFrase(a.m.mc,a.m.deberia)+'</span><span class="sep">·</span><span class="a-v">'+usd(Math.max(0,a.norte-a.m.mc))+' para la meta</span><span class="a-do">→ ese es el número de la semana</span></div>';

    data:{labels:ML,datasets:[Object.assign({label:'Volumen',data:a.mc},LINEA(MINTD))]},

/* ============================================================
   BITÁCORA · pestaña 5 — public.equipo_bitacora
   Estructura: claude/ESTRUCTURA_TABLERO_BRAHIAN_VISUAL_v2.md §9.
   Una tabla, sin vistas. Se agrega y se marca; no se edita ni se borra:
   la columna 'hecho' es lo único que acepta UPDATE (permiso por columna).
   Sin gráficas: NO entra en GRAF/LISTO.
   ============================================================ */
function bitacora(D){
  const $ = id => document.getElementById(id);
  const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const domingoISO = () => { const d = new Date(); d.setDate(d.getDate() + (7 - d.getDay()) % 7);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const nom = t => String(t||'').replace(/\s*\(.*\)\s*$/, '');
  const fmt = f => { if(!f) return ''; const p = String(f).slice(0,10).split('-'); return Number(p[2]) + ' ' + ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][Number(p[1])-1]; };
  const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let ENT = [], CHIP = 'abiertos', CARGANDO = true;

  const selB = $('btPersona');
  selB.innerHTML = D.agentes.map(a => '<option value="' + esc(a.n) + '">' + esc(nom(a.n)) + '</option>').join('');
  const selP = document.getElementById('selPersona');
  const link = document.querySelector('.pg-side a[data-go="bitacora"]');
  if (link) link.addEventListener('click', () => { if (selP && selP.value) selB.value = selP.value; cargar(); });

  const estado = e => {
    if (!e.compromiso) return 'nota';
    if (e.hecho) return 'hecho';
    const f = String(e.fecha_revision).slice(0,10);
    if (f < hoyISO()) return 'vencido';
    if (f <= domingoISO()) return 'semana';
    return 'abierto';
  };
  const PILL = { nota:['p-nota','Solo nota'], hecho:['p-hecho','Cumplido'], vencido:['p-vencido','Vencido'], semana:['p-semana','Esta semana'], abierto:['p-abierto','Abierto'] };
  const ORD = { vencido:0, semana:1, abierto:2, nota:3, hecho:4 };

  async function cargar(){
    const r = await SB.from('equipo_bitacora').select('*').order('creado_en', { ascending:false });
    CARGANDO = false;
    if (r.error) { $('btSub').textContent = 'No pude leer la bitácora: ' + r.error.message;
      $('btLista').innerHTML = '<div class="bt-vacio">No pude leer la bitácora. Recarga la página; si sigue igual, avísale a Andrés.</div>'; return; }
    ENT = r.data || [];
    pinta();
  }

  function pinta(){
    if (CARGANDO) { $('btLista').innerHTML = '<div class="bt-vacio">Cargando…</div>'; return; }
    const abiertos = ENT.filter(e => e.compromiso && !e.hecho);
    const venc = abiertos.filter(e => String(e.fecha_revision).slice(0,10) < hoyISO());
    const cuenta = { abiertos: abiertos.length, vencidos: venc.length, todo: ENT.length };
    $('btSub').textContent = abiertos.length
      ? abiertos.length + ' compromiso' + (abiertos.length===1?'':'s') + ' abierto' + (abiertos.length===1?'':'s') + (venc.length ? ' · ' + venc.length + ' vencido' + (venc.length===1?'':'s') + ' sin marcar' : '') + '.'
      : (ENT.length ? 'Sin compromisos abiertos.' : 'Todavía no hay nada anotado.');
    $('btChips').innerHTML = [['abiertos','Abiertos'],['vencidos','Vencidos'],['todo','Todo']]
      .map(([k,t]) => '<button type="button" class="chip' + (CHIP===k?' on':'') + '" data-chip="' + k + '">' + t + ' <span style="opacity:.75">' + cuenta[k] + '</span></button>').join('');
    document.querySelectorAll('#btChips .chip').forEach(b => b.onclick = () => { CHIP = b.dataset.chip; pinta(); });
    let f = ENT.slice();
    if (CHIP === 'abiertos') f = abiertos; else if (CHIP === 'vencidos') f = venc;
    f.sort((a,b) => (ORD[estado(a)] - ORD[estado(b)]) || (String(a.fecha_revision||a.creado_en) < String(b.fecha_revision||b.creado_en) ? -1 : 1));
    $('btLista').innerHTML = f.length ? f.map(e => {
      const st = estado(e), p = PILL[st];
      return '<div class="bt-item ' + st + '" data-id="' + e.id + '">'
        + '<div><div class="bt-nom">' + esc(nom(e.persona)) + '</div>'
        + '<div class="bt-meta">' + fmt(e.creado_en) + '</div>'
        + '<div class="bt-nota">' + esc(e.nota) + '</div>'
        + (e.compromiso ? '<div class="bt-comp"><span class="k">Acordado</span>' + esc(e.compromiso) + '</div>' : '')
        + '</div><div class="bt-right">'
        + (e.compromiso ? '<div class="bt-fecha">revisar el ' + fmt(e.fecha_revision) + '</div>' : '')
        + '<span class="bt-pill ' + p[0] + '">' + p[1] + '</span>'
        + (e.compromiso ? '<label class="bt-chk"><input type="checkbox" data-hecho="' + e.id + '"' + (e.hecho?' checked':'') + '> Cumplido</label>' : '')
        + '</div></div>';
    }).join('') : '<div class="bt-vacio">' + (!ENT.length ? 'Todavía no hay nada anotado. La primera conversación de la semana va arriba.'
        : (CHIP==='vencidos' ? 'Nada vencido. Así debería verse siempre.'
        : 'Sin compromisos abiertos. Anota el próximo arriba.')) + '</div>';
    document.querySelectorAll('#btLista input[data-hecho]').forEach(c => c.onchange = async () => {
      const id = Number(c.dataset.hecho), v = c.checked;
      c.disabled = true;
      const r = await SB.from('equipo_bitacora').update({ hecho: v }).eq('id', id);
      c.disabled = false;
      if (r.error) { c.checked = !v; $('btErr').className = 'bt-err'; $('btErr').textContent = 'No pude guardar la marca: ' + r.error.message; return; }
      const e = ENT.find(x => x.id === id); if (e) e.hecho = v;
      pinta();
    });
  }

  $('btGuardar').onclick = async () => {
    const nota = $('btNota').value.trim(), comp = $('btComp').value.trim(), fecha = $('btFecha').value;
    const err = $('btErr'); err.className = 'bt-err'; $('btFecha').classList.remove('falta');
    if (!nota) { err.textContent = 'Escribe qué hablaron: es lo único obligatorio.'; return; }
    if (comp && !fecha) { err.textContent = 'Sin fecha, el compromiso no existe. Pon cuándo lo revisas.'; $('btFecha').classList.add('falta'); return; }
    const btn = $('btGuardar'); btn.disabled = true; err.textContent = 'Guardando…';
    const r = await SB.from('equipo_bitacora')
      .insert({ persona: selB.value, nota: nota, compromiso: comp || null, fecha_revision: comp ? fecha : null })
      .select().single();
    btn.disabled = false;
    if (r.error) { err.textContent = 'No pude guardar: ' + r.error.message; return; }
    ENT.unshift(r.data);
    $('btNota').value = ''; $('btComp').value = ''; $('btFecha').value = '';
    err.className = 'bt-ok'; err.textContent = 'Anotado.';
    CHIP = comp ? 'abiertos' : 'todo'; pinta();
  };

  pinta();
  cargar();
}

/* Chart.js viene de CDN: puede llegar tarde o no llegar. Se espera hasta 10s y,
   si no llega, se dice claro en pantalla en vez de reventar con "Chart is not defined". */
function esperarChart(){
  return new Promise((ok, no) => {
    if (window.Chart) return ok();
    let t = 0;
    const i = setInterval(() => {
      if (window.Chart) { clearInterval(i); ok(); }
      else if ((t += 200) >= 10000) { clearInterval(i);
        no(new Error('No cargaron las librerías de gráficas. Recarga la página; si sigue igual, puede ser la red de la oficina bloqueando el CDN.')); }
    }, 200);
  });
}

/* ============ EL DÍA QUE CERRÓ ============
   Sale de public.v_equipo_dia_visible: el último día HÁBIL antes de hoy, ya completo.
   Es lo que Andrés pidió el 11-sep: a las 8 de la mañana el número de hoy siempre es
   cero, así que el que sirve para hablar con la gente es el día cerrado.
   Al tocar una persona se pide public.equipo_agente_detalle(nombre) y se abre su ficha. */
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_L  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fechaLarga(iso){
  if (!iso) return '';
  const p = String(iso).split('-'), d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  return DIAS_L[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MESES_L[d.getUTCMonth()];
}
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function usdCorto(v){
  const n = Number(v) || 0, s = n < 0 ? '-' : '', a = Math.abs(n);
  return s + '$' + (a >= 1000 ? Math.round(a).toLocaleString('es-CO') : a.toFixed(0));
}

/* ============ TABLA UNICA DEL EQUIPO: AYER | ESTE MES ============
   v16 - dia-card, act-card y emb-card de la v15 se funden en una sola tabla con
   interruptor "Ayer | Este mes". Ayer sale de v_equipo_dia_visible, Este mes de
   v_actividad_equipo_visible (misma forma de fila, mismo orden de columnas).
   "Dónde se le queda" ya no tiene card propio: embudoEquipo() calcula el paso de
   cada quien y pintarMes() lo agrega como una columna más. */
let EQ_MODO = 'ayer';
let EQ_AYER = null;   // { data, dia }
let EQ_MES  = null;   // { data }
const N16 = v => (v == null ? null : Number(v));

function pintarCabeceraEquipo(){
  const tit = document.getElementById('dia-titulo');
  const h2  = document.getElementById('dia-h2');
  if (EQ_MODO === 'ayer') {
    const dia = EQ_AYER && EQ_AYER.dia;
    if (tit) tit.innerHTML = (dia ? fechaLarga(dia).replace(/^./, c => c.toUpperCase()) : 'Ayer')
      + (tit.querySelector('.hq') ? tit.querySelector('.hq').outerHTML : '');
    if (h2) h2.textContent = dia ? 'Ayer, ' + fechaLarga(dia) : 'Ayer, persona por persona';
  } else {
    const hoyCol = new Date(Date.now() - 5*3600000);
    const txt = MESES_L[hoyCol.getUTCMonth()].replace(/^./, c => c.toUpperCase())
      + ', del 1 al ' + hoyCol.getUTCDate();
    if (tit) tit.innerHTML = txt + (tit.querySelector('.hq') ? tit.querySelector('.hq').outerHTML : '');
    if (h2) h2.textContent = txt + ', persona por persona';
  }
}

/* Pie fijo de dos líneas, igual en los dos modos: qué es un positivo, y quién no
   tiene RingCentral (para que el guion de esas filas no se lea como un cero). */
function pintarPieEquipo(sinRc){
  const pie = document.getElementById('dia-pie');
  if (!pie) return;
  const l2 = sinRc.length
    ? '<b>Sin usuario de RingCentral:</b> ' + sinRc.map(n => esc(n)).join(', ')
      + ' — de ellos no se sabe nada del teléfono, el guion no quiere decir cero.'
    : 'Todo el equipo tiene usuario de RingCentral asignado.';
  pie.innerHTML = '<b>Un positivo es un contacto que la persona creó ese día.</b><br>' + l2;
}

function pintarTablaEquipo(){
  const cont = document.getElementById('dia-lista');
  if (!cont) return;
  if (EQ_MODO === 'ayer') {
    if (!EQ_AYER) { cont.innerHTML = '<div class="act-vacio">Cargando…</div>'; return; }
    pintarAyer(EQ_AYER.data);
  } else {
    if (!EQ_MES) { cont.innerHTML = '<div class="act-vacio">Cargando…</div>'; return; }
    pintarMes(EQ_MES.data);
  }
}

function wireToggleEquipo(){
  const tg = document.getElementById('tg-act');
  if (!tg || tg.dataset.wired) return;
  tg.dataset.wired = '1';
  tg.querySelectorAll('button').forEach(function(bt){
    bt.addEventListener('click', function(){
      tg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      bt.classList.add('on');
      EQ_MODO = bt.dataset.v;
      pintarCabeceraEquipo();
      pintarTablaEquipo();
    });
  });
}

async function diaEquipo(sb){
  const cont = document.getElementById('dia-lista');
  if (!cont) return;
  wireToggleEquipo();
  const { data, error } = await sb.from('v_equipo_dia_visible').select('*');
  if (error || !data || !data.length) {
    if (EQ_MODO === 'ayer') cont.innerHTML = '<div class="act-vacio">No pude traer el día. '
      + (error ? esc(error.message) : 'No hay filas: revisar el paquete de la cuenta.') + '</div>';
    return;
  }
  EQ_AYER = { data: data, dia: data[0].dia };
  pintarCabeceraEquipo();
  pintarTablaEquipo();
}

/* Modo Ayer: v_equipo_dia_visible. positivos = contactos creados ese día (la
   medida nueva) — ya NO es "mandado a cotizar", ese ahora se llama cotizados y
   solo vive en la ficha. ventas ya es CUENTAS (clientes distintos), no pólizas. */
function pintarAyer(data){
  const cont = document.getElementById('dia-lista');
  if (!cont) return;
  const N = N16;
  const sum = k => data.reduce((s, r) => s + (N(r[k]) || 0), 0);
  const tLl = sum('llamadas'), tCv = sum('conversaciones'), tTi = sum('solo_timbre'),
        tPo = sum('positivos'), tVe = sum('ventas'), tPrem = sum('premium');
  const conPos = data.filter(r => (N(r.positivos)||0) > 0).length;

  document.getElementById('dia-res').innerHTML =
      '<div><div class="l">Llamadas</div><div class="v">' + tLl.toLocaleString('es-CO') + '</div>'
      + '<div class="s">' + tTi.toLocaleString('es-CO') + ' fueron solo timbre</div></div>'
    + '<div><div class="l">De más de 2 min</div><div class="v">' + tCv + '</div>'
      + '<div class="s">' + (tLl ? 'una de cada ' + Math.round(tLl / Math.max(tCv,1)) + ' marcadas' : '—') + '</div></div>'
    + '<div><div class="l">Positivos</div><div class="v' + (tPo ? '' : ' mal') + '">' + tPo + '</div>'
      + '<div class="s">' + (conPos ? conPos + (conPos === 1 ? ' persona registró' : ' personas registraron') : 'nadie registró nada') + '</div></div>'
    + '<div><div class="l">Ventas</div><div class="v">' + tVe + '</div>'
      + '<div class="s">' + (tVe ? tVe + (tVe === 1 ? ' cliente' : ' clientes')
          + (tPrem ? ' · ' + usdCorto(tPrem) : '') : 'nadie cerró') + '</div></div>';

  const gris = 'color:var(--pg-muted)';
  const orden = data.slice().sort((a,b) =>
       (N(b.ventas)||0) - (N(a.ventas)||0)
    || (N(b.positivos)||0) - (N(a.positivos)||0)
    || (N(b.llamadas)||0) - (N(a.llamadas)||0)
    || a.agente.localeCompare(b.agente));

  cont.innerHTML = '<div style="overflow-x:auto"><table class="act-tab"><thead><tr>'
    + '<th>Persona</th><th class="n">Llamadas</th><th class="n">De +2 min</th>'
    + '<th class="n">Positivos</th><th class="n">Ventas</th><th></th>'
    + '</tr></thead><tbody>'
    + orden.map(function(r){
        const cel = v => v == null
          ? '<td class="n"><span style="' + gris + '">—</span></td>'
          : '<td class="n">' + Number(v).toLocaleString('es-CO') + '</td>';
        const po = N(r.positivos), ve = N(r.ventas), pz = N(r.polizas) || 0, pr = N(r.premium) || 0;
        /* Ventas ya es CUENTAS (clientes distintos); las pólizas solo se dicen al pasar el mouse. */
        const ttlVe = ve ? pz + (pz === 1 ? ' póliza' : ' pólizas') + (pr ? ' · ' + usdCorto(pr) : '') : '';
        return '<tr data-ag="' + esc(r.agente) + '" tabindex="0">'
          + '<td class="per">' + esc(r.agente) + '</td>'
          + cel(r.tiene_rc ? (N(r.llamadas) || 0) : N(r.llamadas))
          + cel(r.tiene_rc ? (N(r.conversaciones) || 0) : N(r.conversaciones))
          /* En un solo día, cero positivos le pasa a casi todo el mundo: pintar media
             tabla de rojo le quita el sentido al color. Aquí el número que se resalta
             es el que SÍ pasó. */
          + (po == null ? '<td class="n"><span style="' + gris + '">—</span></td>'
             : '<td class="n"' + (po > 0 ? ' style="color:var(--pg-ink);font-weight:700"' : ' style="' + gris + '"') + '>' + po + '</td>')
          + (ve == null ? '<td class="n"><span style="' + gris + '">—</span></td>'
             : '<td class="n"' + (ve > 0 ? ' style="color:var(--pg-mint);font-weight:700" title="' + ttlVe + '"' : ' style="' + gris + '"') + '>' + ve + '</td>')
          + '<td class="n" style="' + gris + '">→</td></tr>';
      }).join('')
    + '</tbody></table></div>';

  cont.querySelectorAll('tbody tr').forEach(function(tr){
    const abrir = function(){
      cont.querySelectorAll('tbody tr').forEach(x => x.classList.remove('sel'));
      tr.classList.add('sel');
      detalleAgente(SB, tr.getAttribute('data-ag'));
    };
    tr.addEventListener('click', abrir);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
  });

  pintarPieEquipo(orden.filter(r => !r.tiene_rc).map(r => r.agente));
}

/* La ficha de una persona: su día contra su mes, y qué registró con nombre propio. */
async function detalleAgente(sb, agente){
  const card = document.getElementById('det-card');
  if (!card) return;
  card.hidden = false;
  card.innerHTML = '<div class="det-vacio">Abriendo ' + esc(agente) + '…</div>';
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const { data, error } = await sb.rpc('equipo_agente_detalle', { p_agente: agente });
  if (error || !data || data.error) {
    card.innerHTML = '<div class="det-vacio">No pude abrir a ' + esc(agente) + '. '
      + esc((data && data.error) || (error && error.message) || '') + '</div>';
    return;
  }
  const A = data.ayer || {}, M = data.mes || {};
  const n = v => (v == null ? '—' : Number(v).toLocaleString('es-CO'));
  const usd = v => (v == null ? '—' : (Number(v) < 0 ? '-$' : '$') + Math.abs(Number(v)).toLocaleString('es-CO', {maximumFractionDigits:0}));
  const diaCorta = data.dia ? data.dia.slice(8,10) + '/' + data.dia.slice(5,7) : 'ese día';

  /* Su día contra su mes. positivos = contactos creados (la medida nueva),
     cotizados = lo que antes se llamaba positivos (negocio mandado a cotizar). */
  const fila = (rot, a, m) => '<tr><td>' + rot + '</td><td class="n">' + n(a) + '</td><td class="n">' + n(m) + '</td></tr>';
  const cuadro = '<table class="det-tab">'
    + '<tr class="cab"><td></td><td class="n">' + (data.dia ? data.dia.slice(8,10) + '/' + data.dia.slice(5,7) : 'Ese día') + '</td><td class="n">Este mes</td></tr>'
    + fila('Llamadas', A.llamadas, M.llamadas)
    + fila('De más de 2 minutos', A.conversaciones, M.conversaciones)
    + fila('Solo timbre', A.soloTimbre, M.soloTimbre)
    + fila('Minutos al teléfono', A.minutos, M.minutos)
    + fila('Positivos', A.contactos, M.contactos)
    + fila('Cotizados', A.cotizados, M.cotizados)
    + fila('Ventas', A.ventas, M.ventas)
    + '</table>';

  /* El pulso del mes: un positivo por día hábil es el estándar, así que los ceros
     tienen que verse. Son números en fila, no barras. pulsoContactos trae {dia,n}
     por cada día hábil del mes; el día que se mira se marca comparando con data.dia. */
  const PD = data.pulsoContactos || [];
  const diaNum = iso => iso ? String(iso).slice(8,10).replace(/^0/,'') : '';
  const pulso = !PD.length ? '' :
      '<h2 style="margin:22px 0 6px;font-size:15px">Positivos día a día</h2>'
    + '<p class="pg-purpose" style="margin:0 0 10px">El estándar es uno por día hábil. '
      + '<b>' + PD.filter(p => Number(p.n) > 0).length + '</b> de ' + PD.length + ' días con algo.</p>'
    + '<div style="overflow-x:auto"><table class="det-pulso"><tr>'
      + PD.map(p => '<td' + (p.dia === data.dia ? ' class="hoy"' : '') + '>' + diaNum(p.dia) + '</td>').join('') + '</tr><tr>'
      + PD.map(p => '<td class="v' + (Number(p.n) > 0 ? ' si' : ' no') + (p.dia === data.dia ? ' hoy' : '') + '">'
                  + (Number(p.n) || 0) + '</td>').join('') + '</tr></table></div>';

  /* Qué positivos montó: nombre del contacto y fecha, más reciente primero,
     lo del día que se mira resaltado. */
  const PM = data.positivosMontados || [];
  const montados = !PM.length
    ? '<div class="det-vacio">No montó positivos este mes.</div>'
    : '<div style="overflow-x:auto"><table class="act-tab"><thead><tr>'
      + '<th>Contacto</th><th class="n" style="width:80px">Fecha</th></tr></thead><tbody>'
      + PM.map(function(p){
          return '<tr' + (p.dia === data.dia ? ' style="background:var(--pg-mint-soft,#E4F4EF)"' : '') + '>'
            + '<td class="per">' + esc(p.nombre) + '</td>'
            + '<td class="n" style="color:var(--pg-muted)">' + esc(p.dia ? p.dia.slice(8,10) + '/' + p.dia.slice(5,7) : '—') + '</td></tr>';
        }).join('')
      + '</tbody></table></div>';

  /* El paquete, no la póliza: una fila por cuenta, con el premium ya sumado. */
  const PQ = data.paquetes || [];
  const T  = data.totalMes || {};
  const etiqueta = c => ({venta:'Venta', endoso:'Endoso', negativo:'Cancelación',
                          renovacion:'Renovación', fee_admin:'Fee administrativo'}[c] || (c || '—'));
  const paquetes = !PQ.length
    ? '<div class="det-vacio">No registró nada en el BOS este mes.</div>'
    : '<div style="overflow-x:auto"><table class="act-tab"><thead><tr>'
      + '<th>Cuenta</th><th>Qué fue</th><th class="n" style="width:84px">Pólizas</th>'
      + '<th class="n" style="width:130px">Premium</th><th class="n" style="width:100px">Fee</th>'
      + '<th class="n" style="width:74px">Fecha</th></tr></thead><tbody>'
      + PQ.map(function(p){
          const neg = Number(p.premium) < 0;
          return '<tr' + (p.enElDia ? ' style="background:var(--pg-mint-soft,#E4F4EF)"' : '') + '>'
            + '<td class="per">' + esc(p.insured) + '</td>'
            + '<td>' + etiqueta(p.categoria) + '</td>'
            + '<td class="n">' + p.polizas + '</td>'
            + '<td class="n"' + (neg ? ' style="color:var(--pg-neg)"' : '') + '>' + usdCorto(p.premium) + '</td>'
            + '<td class="n">' + (Number(p.fee) ? usdCorto(p.fee) : '<span style="color:var(--pg-muted)">—</span>') + '</td>'
            + '<td class="n" style="color:var(--pg-muted)">' + esc(p.ultima || p.primera || '') + '</td></tr>';
        }).join('')
      + '</tbody></table></div>';

  /* Los totales del mes, ya sumados. Se separa lo vendido de todo lo demás, porque
     endosos y cancelaciones también son registro pero no son venta. */
  const totales = !PQ.length ? '' :
      '<div class="emb-res" style="margin:14px 0 0">'
    + '<div><div class="l">Clientes con venta</div><div class="v">' + (T.cuentasVenta || 0) + '</div>'

      + '<div class="s">' + (Number(T.feeVenta) ? usdCorto(T.feeVenta) + ' de fee' : 'sin fee cobrado') + '</div></div>'

    + '<div><div class="l">Premium neto</div><div class="v"' + (Number(T.premium) < 0 ? ' style="color:var(--pg-neg)"' : '')

     registró en el BOS (por cuenta, no por póliza). */
  const doslistas = '<div class="pg-grid-2" style="margin-top:24px;align-items:start">'

/* ============ DÓNDE SE LE QUEDA ============
   v16 - Ya no tiene card propio (emb-card se elimina). Sigue siendo el mismo criterio
   de la v15 -- se evalúa de abajo hacia arriba de la cadena, quien ya vendió no se
   juzga por los pasos previos -- pero ahora DEVUELVE un mapa agente→[texto,clase]
   en vez de pintar su tabla: pintarMes() lo agrega como una columna más. */
function embudoEquipo(data){
  const N = N16;
  function paso(r){
    const ll = N(r.llamadas_mes), cv = N(r.conversaciones_mes),
          po = N(r.contactos_mes) || 0, co = N(r.cotizados_mes) || 0, ve = N(r.ventas_mes) || 0;
    if (ve > 0)     return ['cierra', 'ok'];
    if (co >= 1)    return ['cotiza, no cierra', 'w'];
    if (po >= 1)    return ['contacta, no cotiza', 'w'];
    if (ll == null) return ['sin RingCentral', 'q'];
    if (ll < 30)    return ['poca actividad', 'r'];
    /* Menos de una conversación por cada cien marcadas: el teléfono suena, nadie habla. */
    if (ll >= 300 && (cv || 0) * 300 < ll) return ['marca, no conversa', 'r'];
    return ['conversa, no contacta', 'w'];
  }
  const m = new Map();
  (data || []).forEach(r => m.set(r.agente, paso(r)));
  return m;
}

/* ============ MODO ESTE MES: MISMA TABLA, v_actividad_equipo_visible ============
   v16 - act-card se elimina como card propio; sus dos columnas que valían la pena
   (Días con positivo y Dónde se le queda) pasan a la tabla única de EQUIPO.
   positivos = contactos_mes (LA MEDIDA NUEVA) — nunca positivos_mes, que ahora
   equivale a cotizados_mes y solo se conserva por compatibilidad hacia atrás. */
async function actividadEquipo(sb){
  const { data, error } = await sb.from('v_actividad_equipo_visible').select('*');
  if (error || !data || !data.length) {
    if (EQ_MODO === 'mes') {
      const cont = document.getElementById('dia-lista');
      if (cont) cont.innerHTML = '<div class="act-vacio">No pude traer el mes. '
        + (error ? String(error.message).replace(/[<>&]/g,'') : 'No hay filas: revisar el paquete de la cuenta.') + '</div>';
    }
    return;
  }
  EQ_MES = { data: data };
  if (EQ_MODO === 'mes') { pintarCabeceraEquipo(); pintarTablaEquipo(); }
}

function pintarMes(data){
  const cont = document.getElementById('dia-lista');
  if (!cont) return;
  const N = N16;
  const sum = k => data.reduce((s, r) => s + (N(r[k]) || 0), 0);
  const tLl = sum('llamadas_mes'), tCv = sum('conversaciones_mes'), tTi = sum('solo_timbre_mes'),
        tPo = sum('contactos_mes'), tVe = sum('ventas_mes'), tPrem = sum('premium_mes');
  const habiles = data[0].habiles_corridos || 0;

  document.getElementById('dia-res').innerHTML =
      '<div><div class="l">Llamadas</div><div class="v">' + tLl.toLocaleString('es-CO') + '</div>'
      + '<div class="s">' + tTi.toLocaleString('es-CO') + ' fueron solo timbre</div></div>'
    + '<div><div class="l">De más de 2 min</div><div class="v">' + tCv + '</div>'
      + '<div class="s">' + (tLl ? 'una de cada ' + Math.round(tLl / Math.max(tCv,1)) + ' marcadas' : '—') + '</div></div>'
    + '<div><div class="l">Positivos</div><div class="v' + (tPo ? '' : ' mal') + '">' + tPo + '</div>'
      + '<div class="s">contactos creados · ' + habiles + (habiles === 1 ? ' día hábil' : ' días hábiles') + '</div></div>'
    + '<div><div class="l">Ventas</div><div class="v">' + tVe + '</div>'
      + '<div class="s">' + (tVe ? tVe + (tVe === 1 ? ' cliente' : ' clientes')
          + (tPrem ? ' · ' + usdCorto(tPrem) : '') : 'nadie cerró') + '</div></div>';

  const gris = 'color:var(--pg-muted)';
  const orden = data.slice().sort((a,b) =>
       (N(b.ventas_mes)||0) - (N(a.ventas_mes)||0)
    || (N(b.contactos_mes)||0) - (N(a.contactos_mes)||0)
    || (N(b.llamadas_mes)||0) - (N(a.llamadas_mes)||0)
    || a.agente.localeCompare(b.agente));

  const pasos = embudoEquipo(data);

  /* Celda combinada de llamadas: nunca 0 en vez de null — si no hay usuario de
     RingCentral, guion gris con el porqué en el title. */
  function celdaLlamadas(lm, st, cv){
    if (lm == null) return '<td class="n" title="Sin usuario de RingCentral asignado"><span style="' + gris + '">—</span></td>';
    const ttl = Number(lm).toLocaleString('es-CO') + ' llamadas este mes'
      + ((st == null && cv == null) ? ''
         : ' · ' + (Number(st) || 0) + ' solo timbre · ' + (Number(cv) || 0) + ' de más de 2 minutos');
    return '<td class="n" title="' + ttl.replace(/"/g, '&quot;') + '">' + Number(lm).toLocaleString('es-CO') + '</td>';
  }

  cont.innerHTML = '<div style="overflow-x:auto"><table class="act-tab"><thead><tr>'
    + '<th>Persona</th><th class="n">Llamadas</th><th class="n">De +2 min</th>'
    + '<th class="n">Positivos</th><th class="n">Ventas</th>'
    + '<th class="n">Días con positivo</th><th>Dónde se le queda</th><th></th>'
    + '</tr></thead><tbody>'
    + orden.map(function(r){
        const cv = N(r.conversaciones_mes);
        const po = N(r.contactos_mes), ve = N(r.ventas_mes),
              dc = N(r.dias_con_contacto) || 0, hb = N(r.habiles_corridos) || 0;
        const p = pasos.get(r.agente) || ['—', 'q'];
        return '<tr data-ag="' + esc(r.agente) + '" tabindex="0">'
          + '<td class="per">' + esc(r.agente) + '</td>'
          + celdaLlamadas(r.llamadas_mes, r.solo_timbre_mes, r.conversaciones_mes)
          + (cv == null ? '<td class="n"><span style="' + gris + '">—</span></td>' : '<td class="n">' + cv.toLocaleString('es-CO') + '</td>')
          + (po == null ? '<td class="n"><span style="' + gris + '">—</span></td>'
             : '<td class="n"' + (po > 0 ? ' style="color:var(--pg-ink);font-weight:700"' : ' style="' + gris + '"') + '>' + po + '</td>')
          + (ve == null ? '<td class="n"><span style="' + gris + '">—</span></td>'
             : '<td class="n"' + (ve > 0 ? ' style="color:var(--pg-mint);font-weight:700"' : ' style="' + gris + '"') + '>' + ve + '</td>')
          + '<td class="n">' + dc + ' de ' + hb + '</td>'
          + '<td><span class="emb-paso ' + p[1] + '">' + esc(p[0]) + '</span></td>'
          + '<td class="n" style="' + gris + '">→</td></tr>';
      }).join('')
    + '</tbody></table></div>';

  cont.querySelectorAll('tbody tr').forEach(function(tr){
    const abrir = function(){
      cont.querySelectorAll('tbody tr').forEach(x => x.classList.remove('sel'));
      tr.classList.add('sel');
      detalleAgente(SB, tr.getAttribute('data-ag'));
    };
    tr.addEventListener('click', abrir);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
  });

  pintarPieEquipo(data.filter(r => r.llamadas_mes == null).map(r => r.agente));
}

      + 'Si dice otra cosa, avísale a Andrés con este mensaje.</div>';

}

async function boot(){

}
SB.auth.onAuthStateChange((_e, session) => {

  else { YA_PINTADO = false; renderLogin(); }
});
boot();

if(!window.__pgIdle){window.__pgIdle=setInterval(function(){if(window.__pgLastInput&&Date.now()-window.__pgLastInput>30000){try{location.reload(!0)}catch(e){location.reload()}}},5000);}try{var _b=document.getElementById('pgvBar');if(_b&&!_b.__aug){_b.__aug=1;var _s=document.createElement('span');_s.style.cssText='font-weight:800';_s.textContent='Guarda tu trabajo y la página se actualizará sola.';_b.insertBefore(_s,_b.firstChild);}}catch(e){}
}
function pgvRun(){
  try{
    var c=window.supabase.createClient(PGV_URL,PGV_KEY,{db:{schema:'portal'}});
    c.from('app_versiones').select('version').eq('archivo',PGV_ARCHIVO).maybeSingle().then(function(r){
      if(!r||r.error||!r.data)return;
      if(Number(r.data.version)>PGV_VERSION)pgvBanner();
    });
  }catch(e){}
}
function pgvCheck(){
  if(window.supabase&&window.supabase.createClient){pgvRun();return;}
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload=pgvRun;
  document.head.appendChild(s);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(pgvCheck,400);});
else setTimeout(pgvCheck,400);
setInterval(pgvCheck,600000);
})();
</script>
