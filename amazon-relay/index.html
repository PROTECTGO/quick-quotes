<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Relay · ProtectGo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,1,800&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
<style>
/* =====================================================================
   AMAZON RELAY · v6 · CSS completo (reemplaza TODO el <style> de index.html)
   Base: ADN visual de renovaciones.html v27 + clases pg-* que ya usa Amazon.
   Regla: todas las clases viejas (pg-card, pg-table, pg-pill, field, frow, two,
   evt, toast, login, copybox, pgprint, pgdos, paste-zone) se CONSERVAN para que
   los formularios y las impresiones existentes no se rompan.
   ===================================================================== */
:root{
  /* familia GABI */
  --pg-ink:#1B2D3A;--pg-ink-2:#152430;--pg-mint:#2DBFA3;--pg-mint-soft:#C4E8DF;--pg-mint-deep:#229A82;--pg-mint-dark:#229A82;
  --pg-bg:#F4F7FA;--pg-card:#FFFFFF;--pg-line:#E7EDF2;--pg-txt:#28323B;--pg-muted:#6B7D89;
  --pg-pos:#1F9D6B;--pg-neg:#D5594F;--pg-warn:#D9A520;
  --pg-font-gabi:"Fraunces",Georgia,serif;--pg-font-title:"Montserrat",sans-serif;
  --pg-font-body:"Inter",sans-serif;--pg-font-num:"JetBrains Mono",monospace;
  /* set corto (mismo que Karen) */
  --ink:#1B2D3A;--ink2:#152430;--mint:#2DBFA3;--mint-deep:#229A82;--mint-soft:#C4E8DF;
  --bg:#F4F7FA;--card:#FFF;--line:#E7EDF2;--txt:#28323B;--muted:#6B7D89;
  --renov:#229A82;   /* verde: utilidad / cobrado / hecho */
  --falta:#5B6BD6;   /* azul-violeta: costo / pendiente / por cobrar */
  --ambar:#D9A520;   /* meta, por validar, señal */
  --rojo:#D5594F;    /* vencido, pérdida */
  --rojo-claro:#FF8A80;
  --f-tit:'Montserrat',system-ui,sans-serif;--f-body:'Inter',system-ui,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,monospace;--f-gabi:'Fraunces',Georgia,serif;
  --side-w:232px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.mono{font-family:var(--f-num)}
.linkish{color:var(--mint-deep);cursor:pointer;font-weight:600}

/* ---------- LAYOUT: sidebar + contenido ---------- */
.pg-app{min-height:100vh;display:flex}
.pg-side{width:var(--side-w);background:var(--ink);color:#fff;padding:70px 14px 22px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.pg-brand{display:flex;align-items:center;gap:11px;margin:0 6px 18px}
.pg-shield{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,var(--mint),var(--mint-deep));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:14px;font-family:var(--f-tit);flex-shrink:0}
.pg-wordmark{font-family:var(--f-gabi);font-style:italic;font-weight:800;font-size:22px;color:var(--mint);letter-spacing:-.5px}
.pg-brand .prod{font-family:var(--f-tit);font-weight:800;font-size:15px;color:#fff;line-height:1.1}
.pg-brand .prod span{color:var(--mint)}
.nav-lbl{font-family:var(--f-tit);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5f7382;margin:14px 10px 6px}
.pg-side a{display:flex;align-items:baseline;gap:10px;padding:9px 12px 9px 13px;border-radius:9px;color:#b9c6d0;font-size:13.5px;font-weight:600;font-family:var(--f-tit);text-decoration:none;margin-bottom:2px;cursor:pointer;position:relative;transition:all .15s;border:0;background:transparent;width:100%;text-align:left}
.pg-side a .k{font-family:var(--f-num);font-size:10.5px;font-weight:700;color:#5f7382;width:18px;flex-shrink:0}
.pg-side a .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-side a .b{font-family:var(--f-num);font-size:10px;font-weight:700;background:var(--rojo);color:#fff;border-radius:999px;padding:1px 6px}
.pg-side a:hover{background:rgba(45,191,163,.10);color:#fff}
.pg-side a.on{background:rgba(45,191,163,.13);color:#fff}
.pg-side a.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--mint)}
.pg-side a.on .k{color:var(--mint)}
.pg-side a:focus-visible{outline:2px solid var(--mint);outline-offset:-2px}
.pg-side a.dir{margin-top:8px;border:1px dashed rgba(45,191,163,.35)}
.pg-foot{margin-top:auto;padding-top:13px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#8da0ad;line-height:1.6}
.pg-main{flex:1;min-width:0;padding:0 34px 70px;max-width:1340px}
/* botón fijo "Volver al portal" — patrón de toda la casa (arriba-izquierda) */
.volver{position:fixed;top:14px;left:14px;z-index:9999;background:#0D3040;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-family:var(--f-body);font-size:12.5px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.volver:hover{background:#14445a}

/* ---------- barra superior del contenido ---------- */
.pgtop{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 0 14px;flex-wrap:wrap}
.pgbrand{display:flex;align-items:baseline;gap:10px}
.pgbrand .gabi{font-family:var(--f-gabi);font-style:italic;font-weight:800;font-size:27px;color:var(--ink);letter-spacing:-.5px}
.pgbrand .sep{width:1px;height:20px;background:var(--line);margin:0 3px;align-self:center}
.pgbrand .sec{font-family:var(--f-tit);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.acts .sello{font-size:11.5px;color:var(--muted);margin-right:4px}
.pgb{font-family:var(--f-body);font-weight:600;font-size:12.5px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;transition:all .16s}
.pgb:hover{border-color:var(--mint);color:var(--mint-deep);transform:translateY(-1px)}
.pgb.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgb.pri:hover{background:var(--ink2);color:#fff}
.pgb:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

/* ---------- títulos de vista ---------- */
.pg-eyebrow{font-family:var(--f-tit);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mint-deep);margin-bottom:6px}
.pg-main h1{font-family:var(--f-tit);font-size:24px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.3px}
.pg-sub{color:var(--muted);font-size:13px;margin:4px 0 18px;max-width:720px;line-height:1.5}
.sec-t{font-family:var(--f-tit);font-weight:800;font-size:17px;color:var(--ink);margin:26px 0 3px}
.sec-s{font-size:12.5px;color:var(--muted);margin-bottom:14px}

/* ---------- panel (tarjeta grande con cabecera) ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(27,45,58,.05);margin-bottom:16px}
.ph{padding:19px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.pt{font-family:var(--f-tit);font-weight:800;font-size:15.5px;color:var(--ink)}
.ps{font-size:12px;color:var(--muted);margin-top:3px;max-width:640px;line-height:1.5}
.pb{padding:14px 24px 20px}
.leg{display:flex;gap:15px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kp{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px;transition:transform .18s,box-shadow .18s;min-width:0}
.kp:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,45,58,.08)}
.kp .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kp .v{font-family:var(--f-num);font-size:34px;font-weight:700;color:var(--ink);margin-top:6px;letter-spacing:-1px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .v.neg{color:var(--rojo)}
.kp .d{font-size:11.5px;color:var(--muted);margin-top:4px}
.kp.oscuro{background:linear-gradient(150deg,#1B2D3A,#26404F);border-color:#1B2D3A}
.kp.oscuro .k{color:var(--mint)}.kp.oscuro .v{color:#fff}.kp.oscuro .v.neg{color:var(--rojo-claro)}.kp.oscuro .d{color:rgba(255,255,255,.65)}
/* compat: kpis viejos de Amazon */
.pg-kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pg-kpi{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(27,45,58,.04)}
.pg-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mint)}
.pg-kpi .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pg-kpi .val{font-family:var(--f-num);font-size:24px;font-weight:600;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
.pg-kpi .sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- franja oscura ---------- */
.strip{background:linear-gradient(135deg,#1B2D3A 0%,#233A4A 100%);border-radius:16px;padding:26px 30px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;margin:16px 0 4px;box-shadow:0 4px 18px rgba(27,45,58,.16)}
.st-eye{font-family:var(--f-tit);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);margin-bottom:6px}
.st-big{font-family:var(--f-num);font-size:56px;font-weight:700;line-height:1;letter-spacing:-2px}
.st-big.neg{color:var(--rojo-claro)}
.st-big small{font-family:var(--f-body);font-size:17px;font-weight:500;opacity:.75;letter-spacing:0;margin-left:9px}
.st-nums{display:flex;gap:30px;margin-top:18px;flex-wrap:wrap}
.st-n .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.62;margin-bottom:3px}
.st-n .v{font-family:var(--f-num);font-size:19px;font-weight:600}
.st-n .v.mint{color:var(--mint)}.st-n .v.neg{color:var(--rojo-claro)}.st-n .v.ambar{color:var(--ambar)}
.ring{text-align:center}
.ring .pct{font-family:var(--f-num);font-size:26px;font-weight:700;fill:#fff}
.ring .pct.neg{fill:var(--rojo-claro)}
.ring .cap{font-size:11px;opacity:.7;margin-top:6px;text-align:center}
.st-aviso{margin-top:14px;font-size:12px;background:rgba(217,165,32,.16);border:1px solid rgba(217,165,32,.45);color:#F7DFA2;border-radius:9px;padding:8px 12px;display:inline-block}

/* ---------- cinta de 12 meses ---------- */
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin:16px 0 0;padding:0 24px 14px;align-items:end}
.mo{cursor:pointer;text-align:center;border-radius:10px;padding:6px 3px 8px;transition:background .16s;border:0;background:transparent;font:inherit}
.mo:hover{background:#F4F7FA}
.mo:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.mo .bar{height:104px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;margin-bottom:7px;position:relative}
.mo .tick{position:absolute;left:-3px;right:-3px;border-top:2px dashed rgba(217,165,32,.85);z-index:2}
.mo .seg-f{background:var(--falta);border-radius:4px 4px 0 0;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.mo .seg-r{background:var(--renov);border-radius:0 0 4px 4px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.mo .seg-n{background:var(--rojo);border-radius:0 0 4px 4px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.mo.futuro .seg-f,.mo.futuro .seg-r{opacity:.42}
.mo .lbl{font-family:var(--f-tit);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mo .num{font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--ink);margin-top:2px}
.mo.on{background:#fff;box-shadow:0 0 0 2px var(--mint)}
.mo.on .lbl{color:var(--mint-deep)}
.months-scroll{overflow-x:auto}
.months-scroll .months{min-width:760px}

/* ---------- chips, buscador ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px;align-items:center}
.chip{font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--f-body)}
.chip:hover{border-color:var(--mint);color:var(--mint-deep)}
.chip.on{background:var(--mint-deep);border-color:var(--mint-deep);color:#fff}
.chip .n{font-family:var(--f-num);font-weight:700;margin-left:6px;opacity:.85}
.chip:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.buscar{margin-left:auto;position:relative}
.buscar input{font-family:var(--f-body);font-size:12.5px;padding:8px 12px 8px 32px;border-radius:999px;border:1px solid var(--line);background:#fff;min-width:240px;outline:none}
.buscar input:focus{border-color:var(--mint)}
.buscar::before{content:'';position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border:2px solid #B6C2CB;border-radius:50%;box-sizing:border-box}

/* ---------- tarjeta de registro (cliente, cobro, load, invoice) ---------- */
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:13px;padding:15px 18px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;transition:transform .16s,box-shadow .16s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(27,45,58,.09)}
.card:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.card.u-rojo{border-left-color:var(--rojo)}.card.u-ambar{border-left-color:var(--ambar)}.card.u-gris{border-left-color:#C9D4DC}.card.u-mint{border-left-color:var(--mint)}
.card.hecha{opacity:.62;background:#FAFCFB}
.card.abierta{border-color:var(--mint);box-shadow:0 0 0 2px rgba(45,191,163,.25)}
.c-nom{font-family:var(--f-tit);font-weight:700;font-size:15.5px;color:var(--ink);letter-spacing:-.15px}
.c-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.c-meta .dot{width:3px;height:3px;border-radius:50%;background:#C9D4DC}
.c-meta .mono{font-family:var(--f-num);font-size:11.5px}
.c-prem{font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
.c-prem .pz{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.p-pend{background:#EEF1F4;color:#5A6B78}.p-cont{background:#E6E9FA;color:#3E4CB0}
.p-cot{background:#FBF1D8;color:#8A6A14}.p-ren{background:var(--mint-soft);color:#186F5D}
.p-per{background:#FAE7E5;color:#A63F36}
.acciones{display:flex;gap:6px;margin-top:11px;opacity:0;max-height:0;overflow:hidden;transition:opacity .18s,max-height .18s}
.card:hover .acciones,.card:focus-within .acciones,.card.abierta .acciones{opacity:1;max-height:44px}
.mini{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--txt);transition:all .14s;font-family:var(--f-body)}
.mini:hover{border-color:var(--mint);color:var(--mint-deep);background:#F7FCFB}
.mini[disabled]{opacity:.42;cursor:not-allowed}
.sen{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#8A6A14;background:#FBF1D8;padding:3px 8px;border-radius:6px}
.sen:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ambar)}
.vacio{background:#fff;border:1px dashed var(--line);border-radius:13px;padding:34px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
.vacio b{color:var(--ink)}

/* ---------- ficha acordeón (se inserta debajo de la tarjeta) ---------- */
.ficha{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mint);border-radius:13px;padding:18px 20px;margin:-4px 0 9px;box-shadow:0 1px 3px rgba(27,45,58,.05)}
.fi-bloque{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}
.fi-bloque:first-child{padding-top:0;margin-top:0;border-top:none}
.fi-tit{font-family:var(--f-tit);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.fi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fi-dato{min-width:0}
.fi-dato .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fi-dato .v{font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-dato .v.txt{font-family:var(--f-body);font-weight:600}
.fi-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fi-chip{font-size:12px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s;font-family:var(--f-body)}
.fi-chip:hover{border-color:var(--mint);color:var(--mint-deep)}
.fi-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fi-chip.on.perdido{background:var(--rojo);border-color:var(--rojo)}
.ficha textarea{width:100%;font-family:var(--f-body);font-size:13px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);resize:vertical;min-height:58px}
.fi-req{color:var(--rojo);font-size:11.5px;margin-top:5px}
.fi-notas{margin-top:14px;display:flex;flex-direction:column;gap:9px;max-height:220px;overflow-y:auto}
.fi-nota{font-size:12.5px;color:var(--txt);border-top:1px solid var(--line);padding-top:8px}
.fi-nota:first-child{border-top:none;padding-top:0}
.fi-nota-meta{font-size:11px;color:var(--muted);margin-bottom:2px}
.fi-aviso{background:#FBF1D8;color:#8A6A14;border-radius:10px;padding:10px 13px;font-size:12.5px;font-weight:600;margin:12px 0}

/* ---------- fila con dos barras (cliente: cobrado vs utilidad) ---------- */
.vr{display:grid;grid-template-columns:200px 1fr 140px;gap:16px;align-items:center;padding:11px 24px;border-bottom:1px solid var(--line);transition:background .14s}
.vr:last-child{border-bottom:none}
.vr:hover{background:#F9FBFC}
.vn{font-weight:600;font-size:13.5px;color:var(--ink);font-family:var(--f-tit)}
.vn small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;font-family:var(--f-body)}
.vbars{position:relative;height:30px}
.vb{position:absolute;left:0;height:11px;border-radius:0 5px 5px 0;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.vb.a{top:2px;background:var(--falta)}
.vb.b{top:17px;background:var(--renov)}
.vb.b.neg{background:var(--rojo)}
.vnum{text-align:right;font-family:var(--f-num);font-size:13px;font-weight:700;color:var(--ink)}
.vpct{font-family:var(--f-num);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:#EEF1F4;color:#5A6B78;display:inline-block;margin-top:3px}
.vpct.bien{background:var(--mint-soft);color:#186F5D}
.vpct.bajo{background:#FBF1D8;color:#8A6A14}
.vpct.neg{background:#FAE7E5;color:#A63F36}

/* ---------- barra con marcas (equilibrio / objetivo) ---------- */
.barrow{display:grid;grid-template-columns:170px 1fr 110px;gap:12px;align-items:center;padding:16px 24px 10px;border-bottom:1px solid var(--line)}
.barrow:last-child{border-bottom:none}
.barrow .l{font-size:13px;font-weight:600;color:var(--ink)}
.barrow .l small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.track{position:relative;height:22px;background:var(--bg);border-radius:6px;overflow:visible}
.fillb{height:22px;border-radius:6px;transition:width .55s cubic-bezier(.2,.8,.2,1);background:var(--renov)}
.fillb.neg{background:var(--rojo)}
.mk{position:absolute;top:-4px;bottom:-4px;width:2px}
.mk.prom{background:#8FA3B0}
.mk.est{background:var(--ambar)}
.mklab{position:absolute;top:-19px;font-family:var(--f-num);font-size:9.5px;font-weight:700;transform:translateX(-50%);white-space:nowrap;color:var(--muted)}
.barrow .n{text-align:right;font-family:var(--f-num);font-size:13.5px;font-weight:700;color:var(--ink)}
.barrow .n small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}

/* ---------- filas de estado (barras horizontales) ---------- */
.estados{padding:8px 24px 20px}
.er{display:grid;grid-template-columns:180px 1fr 150px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.er:last-child{border-bottom:none}
.er .l{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.er .l i{width:11px;height:11px;border-radius:3px}
.er .t{height:20px;background:var(--bg);border-radius:6px;overflow:hidden}
.er .t i{display:block;height:100%;border-radius:6px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.er .n{text-align:right;font-family:var(--f-num);font-size:13.5px;font-weight:700;color:var(--ink)}
.er .n small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}

/* ---------- SVG (combo, líneas) ---------- */
.svgw{width:100%;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{font-family:var(--f-tit);font-size:10.5px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.axn{font-family:var(--f-num);font-size:10px;font-weight:600;fill:var(--muted)}
.hit{fill:transparent;cursor:pointer}

/* ---------- simulador (casilla 09) ---------- */
.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 24px 6px}
.sim-c label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.sim-c .val{font-family:var(--f-num);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.5px}
.sim-c input[type=range]{width:100%;accent-color:var(--mint-deep);margin-top:6px}
.sim-c input[type=number]{font-family:var(--f-num);font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:130px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 24px 18px}
.dual .col{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.dual .col.jp{border-top:4px solid var(--falta)}
.dual .col.ag{border-top:4px solid var(--renov)}
.dual .who{font-family:var(--f-tit);font-weight:800;font-size:13px;color:var(--ink);margin-bottom:10px}
.dual .row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dual .row b{font-family:var(--f-num);font-size:15px;color:var(--ink);font-weight:700}
.dual .row b.neg{color:var(--rojo)}
.dual .row.tot{border-top:2px solid var(--ink)}
.dual .row.tot b{font-size:19px}
.frases{padding:6px 24px 20px}
.frase{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13px;color:var(--txt);line-height:1.5}
.frase:first-child{border-top:none}
.frase i{flex-shrink:0;width:8px;height:8px;border-radius:50%;margin-top:6px}
.frase b{font-family:var(--f-num)}
.pend{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#FBF1D8;color:#8A6A14;border-radius:6px;padding:3px 8px;margin-left:8px;vertical-align:middle}

/* ---------- esqueleto, error, tooltip, pie ---------- */
.pg-skel{height:14px;background:linear-gradient(90deg,#eef2f5,#f7f9fb,#eef2f5);background-size:200% 100%;animation:pgshimmer 1.2s infinite;border-radius:6px;margin:6px 0}
.pg-skel.h36{height:36px}.pg-skel.h104{height:104px}.pg-skel.h160{height:160px}
@keyframes pgshimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.bloque-err{background:#FAE7E5;border:1px solid #F1B9B3;color:#A63F36;border-radius:12px;padding:12px 16px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0}
.bloque-err .mini{border-color:#F1B9B3;color:#A63F36}
.tip{position:fixed;z-index:70;background:var(--ink);color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.55;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(27,45,58,.3);max-width:280px}
.tip .tt{font-family:var(--f-tit);font-weight:700;font-size:12px;display:block;margin-bottom:3px}
.tip b{font-family:var(--f-num)}
.pie{margin-top:26px;font-size:11.5px;color:var(--muted);text-align:center;padding-top:16px;border-top:1px solid var(--line)}
.pgv-bar{position:fixed;bottom:0;left:0;right:0;z-index:9998;background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;display:flex;justify-content:center;gap:14px;align-items:center}
.pgv-bar button{background:var(--mint);color:var(--ink);border:0;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- compat: lo que ya usa Amazon (no tocar) ---------- */
.pg-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px 22px;box-shadow:0 1px 3px rgba(27,45,58,.04);margin-bottom:18px}
.pg-card h2{font-family:var(--f-tit);font-size:15.5px;font-weight:800;color:var(--ink);margin:0 0 3px}
.pg-card .h2sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.pg-table{width:100%;border-collapse:collapse}
.pg-table th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:2px solid var(--ink);font-weight:700}
.pg-table td{padding:10px 6px;font-size:13px;color:#3a4751;border-bottom:1px solid var(--line);vertical-align:middle}
.pg-table td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.pg-table tr:hover td{background:#FAFCFD}
.pg-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pg-pill.ok{background:#E3F4EF;color:var(--pg-pos)}
.pg-pill.fin{background:var(--mint-soft);color:var(--ink2)}
.pg-pill.due{background:#FCEEEC;color:var(--pg-neg)}
.pg-pill.warn{background:#FBF1D8;color:#8A6A14}
.pg-pill.n{background:#EEF1F5;color:var(--ink)}
.pg-btn{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-family:var(--f-body);font-size:13px;font-weight:600;cursor:pointer}
.pg-btn:hover{background:var(--ink2)}
.pg-btn .a{color:var(--mint)}
.pg-btn.secondary{background:transparent;color:var(--ink);border:2px solid var(--line)}
.pg-btn.sm{padding:5px 12px;font-size:11.5px}
.pg-btn.mint{background:var(--mint-deep)}
.field{margin-bottom:11px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--f-body);font-size:13.5px;color:var(--txt);background:#FAFCFD;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint)}
.field input[type=number],.field input.mono{font-family:var(--f-num)}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.evt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.evt:last-child{border-bottom:none}
.evt .dot{width:8px;height:8px;border-radius:99px;background:var(--mint);margin-top:5px;flex-shrink:0}
.evt .w{color:var(--muted);font-size:11px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;box-shadow:0 8px 24px rgba(27,45,58,.3);display:none;z-index:99}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink2)}
.login-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 34px;width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.copybox{background:#12212B;border-radius:11px;padding:14px 16px;color:#D6E4EC;font-family:var(--f-num);font-size:11.5px;line-height:1.7;white-space:pre-wrap;margin-top:10px}
.svc-price input{width:90px;font-family:var(--f-num)}
.paste-zone{border:2px dashed var(--mint);border-radius:12px;background:#F2FBF8;padding:22px;text-align:center;color:var(--mint-deep);font-size:13px;font-weight:600;margin-bottom:14px;cursor:text;outline:none}
.paste-zone small{display:block;color:var(--muted);font-weight:500;margin-top:5px}
.paste-zone img{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px}

    <a data-v="servicios" role="tab" tabindex="0" onclick="nav('servicios')"><span class="k">07</span><span class="t">Tarifario</span></a>
    <a data-v="reportes" role="tab" tabindex="0" onclick="nav('reportes')"><span class="k">08</span><span class="t">Rentabilidad</span></a>
    <a data-v="piloto" class="dir hidden" id="navPiloto" role="tab" tabindex="0" onclick="nav('piloto')"><span class="k">09</span><span class="t">El piloto</span></a>
    <div class="pg-foot">
      Amazon Relay · ProtectGo<br>
      <span id="footUser" style="color:var(--pg-mint)"></span><br>
      <span class="linkish" style="color:#8da0ad" onclick="doLogout()">Cerrar sesión</span>
    </div>
  </nav>
  <main class="pg-main" id="main">
    <div class="pgtop">
      <div class="pgbrand"><span class="gabi">GABI</span><span class="sep"></span><span class="sec" id="topSec">Amazon Relay · 2026</span></div>
      <div class="acts">
        <span class="sello" id="topSello"></span>
        <button class="pgb" onclick="refrescar()">Actualizar</button>
        <button class="pgb" onclick="doLogout()">Cerrar sesión</button>
        <button class="pgb pri" onclick="imprimirReporte()">Imprimir el mes</button>
      </div>
    </div>
    <div id="vista"></div>
    <div class="pie" id="pie"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ===== ui.js v6 — helpers de pintado (arquitecto) ===== */
/* =====================================================================
   AMAZON RELAY · v6 · ui.js — helpers de pintado compartidos (arquitecto)
   Los ejecutores SOLO llaman estas funciones. Devuelven HTML/SVG como string.
   Después de meter HTML en el DOM, llamar ui.mount(el) para animaciones,
   tooltips delegados y teclado. Nada de negocio aquí: solo pintar.
   Depende de: nada (vanilla). Se pega dentro de <script> antes del código de vistas.
   ===================================================================== */
(function (w) {
  'use strict';
  const ui = {};
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  /* ---------- formato ---------- */
  ui.esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  ui.money = (n, dec = 0) => { n = Number(n || 0); const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }); return (n < 0 ? '−$' : '$') + s; };
  ui.money2 = n => ui.money(n, 2);
  ui.moneyC = n => { n = Number(n || 0); const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : a >= 1e4 ? (a / 1e3).toFixed(1) + 'K' : a.toLocaleString('en-US', { maximumFractionDigits: 0 }); return (n < 0 ? '−$' : '$') + s; };
  ui.cop = n => { n = Number(n || 0); return (n < 0 ? '−' : '') + 'COP ' + Math.abs(Math.round(n)).toLocaleString('es-CO'); };
  ui.pct = (n, dec = 1) => (n == null || isNaN(n)) ? '—' : Number(n).toFixed(dec).replace(/\.0$/, '') + '%';
  ui.int = n => Number(n || 0).toLocaleString('en-US');
  ui.mesCorto = i => MESES[i] ? MESES[i].toUpperCase() : '';
  ui.mesLargo = i => MESES_L[i] || '';
  ui.fecha = d => { if (!d) return '—'; const x = new Date(d.length === 10 ? d + 'T12:00:00' : d); return x.toLocaleDateString('es-CO', { day: '2-digit', month: 'short' }); };
  ui.fechaL = d => { if (!d) return '—'; const x = new Date(d.length === 10 ? d + 'T12:00:00' : d); return x.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }); };
  ui.hora = d => new Date(d || Date.now()).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  ui.semanaISO = d => { const x = new Date(d.length === 10 ? d + 'T12:00:00' : d); const t = new Date(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); const wk = Math.ceil(((t - y0) / 864e5 + 1) / 7); return t.getUTCFullYear() + '-W' + String(wk).padStart(2, '0'); };
  ui.memo = (dot, semanaOrId) => 'AMZ-' + (dot || 'SINDOT') + '-' + String(semanaOrId).replace(/[^A-Za-z0-9]/g, '');
  const neg = n => Number(n) < 0;

  /* ---------- KPIs ---------- */
  ui.kpis = list => `<div class="kpis">${list.map((k, i) => `
    <div class="kp${(k.oscuro ?? i === 0) ? ' oscuro' : ''}"${k.tip ? ` data-tip="${ui.esc(k.tip)}"` : ''}>
      <div class="k">${ui.esc(k.k)}</div>
      <div class="v${k.neg ?? neg(k.raw) ? ' neg' : ''}">${k.v}</div>
      <div class="d">${k.d || ''}</div>
    </div>`).join('')}</div>`;

  /* ---------- anillo SVG (128px, r=52) ---------- */
  ui.ring = (pct, o = {}) => {
    const size = o.size || 128, r = o.r || 52, c = 2 * Math.PI * r;
    const sinDato = pct == null || isNaN(Number(pct));
    const p = sinDato ? 0 : Math.max(0, Math.min(100, Number(pct) || 0));
    const isNeg = o.neg ?? (Number(pct) < 0);
    const col = isNeg ? 'var(--rojo-claro)' : (o.color || 'var(--mint)');
    return `<div class="ring"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="10"/>
      ${o.pct2 != null ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r - 14}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r - 14}" fill="none" stroke="${o.color2 || '#8FA3B0'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(2 * Math.PI * (r - 14)) * Math.max(0, Math.min(100, o.pct2)) / 100} ${2 * Math.PI * (r - 14)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray .7s"/>` : ''}
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray .7s"/>
      <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="pct${isNeg ? ' neg' : ''}">${sinDato ? '—' : ui.pct(pct, 0)}</text>
    </svg>${o.cap ? `<div class="cap">${o.cap}</div>` : ''}</div>`;
  };

  /* ---------- franja oscura ---------- */
  ui.strip = o => `<div class="strip">
    <div>
      <div class="st-eye">${ui.esc(o.eye || '')}</div>
      <div class="st-big${o.neg ?? neg(o.raw) ? ' neg' : ''}">${o.big}${o.unit ? `<small>${ui.esc(o.unit)}</small>` : ''}</div>
      ${o.nums && o.nums.length ? `<div class="st-nums">${o.nums.map(n => `<div class="st-n"><div class="k">${ui.esc(n.k)}</div><div class="v${n.cls ? ' ' + n.cls : ''}">${n.v}</div></div>`).join('')}</div>` : ''}
      ${o.aviso ? `<div class="st-aviso">${o.aviso}</div>` : ''}
    </div>
    ${o.ring ? ui.ring(o.ring.pct, o.ring) : ''}
  </div>`;

  /* ---------- cinta de 12 meses ----------
     meses: [{lbl:'ENE', num:'$1,240', a:120 (segmento superior, azul=costo/pendiente),
              b:80 (segmento inferior, verde=utilidad/cobrado), bneg:false (si utilidad negativa: rojo),
              futuro:false, on:false, tip:'html', v:'valor para data-mes'}]
     opts: {max: número para escalar (default: máximo a+b), tick: fracción 0–1 de meta por mes, o null} */
  ui.cinta = (meses, opts = {}) => {
    const H = 104;
    const max = opts.max || Math.max(1, ...meses.map(m => Math.abs(m.a || 0) + Math.abs(m.b || 0)));
    return `<div class="months-scroll"><div class="months" role="tablist">${meses.map(m => {
      const ha = Math.round(H * Math.abs(m.a || 0) / max), hb = Math.round(H * Math.abs(m.b || 0) / max);
      const tick = m.tick != null ? m.tick : opts.tick;
      return `<button type="button" class="mo${m.on ? ' on' : ''}${m.futuro ? ' futuro' : ''}" role="tab" aria-selected="${!!m.on}" data-mes="${m.v ?? ''}"${m.tip ? ` data-tip="${ui.esc(m.tip)}"` : ''}>
        <div class="bar">${tick != null ? `<div class="tick" style="bottom:${Math.round(H * tick)}px"></div>` : ''}
          <div class="seg-f" data-h="${ha}" style="height:0"></div>
          <div class="${m.bneg ? 'seg-n' : 'seg-r'}" data-h="${hb}" style="height:0"></div>
        </div>
        <div class="lbl">${ui.esc(m.lbl)}</div><div class="num">${m.num ?? ''}</div>
      </button>`;
    }).join('')}</div></div>`;
  };

  /* ---------- chips y buscador ---------- */
  ui.chips = (list, extra = '') => `<div class="chips">${list.map(c => `<button type="button" class="chip${c.on ? ' on' : ''}" data-chip="${ui.esc(c.id)}">${ui.esc(c.lbl)}${c.n != null ? `<span class="n">${c.n}</span>` : ''}</button>`).join('')}${extra}</div>`;
  ui.buscar = (id, ph = 'Buscar…') => `<div class="buscar"><input id="${id}" type="search" placeholder="${ui.esc(ph)}" autocomplete="off" aria-label="${ui.esc(ph)}"></div>`;

  /* ---------- tarjeta ---------- */
  ui.card = o => `<div class="card u-${o.u || 'gris'}${o.hecha ? ' hecha' : ''}${o.abierta ? ' abierta' : ''}" tabindex="0" role="button" data-card="${ui.esc(o.id)}"${o.tip ? ` data-tip="${ui.esc(o.tip)}"` : ''}>
    <div>
      <div class="c-nom">${ui.esc(o.nom)}${o.extra || ''}</div>
      <div class="c-meta">${(o.meta || []).filter(Boolean).map((m, i) => (i ? '<span class="dot"></span>' : '') + m).join('')}</div>
      ${o.acciones && o.acciones.length ? `<div class="acciones">${o.acciones.map(a => `<button type="button" class="mini" data-act="${ui.esc(a.act)}" data-id="${ui.esc(o.id)}"${a.disabled ? ' disabled' : ''}${a.title ? ` title="${ui.esc(a.title)}"` : ''}>${ui.esc(a.lbl)}</button>`).join('')}</div>` : ''}
    </div>
    <div class="c-prem">${o.prem ?? ''}${o.premSub ? `<span class="pz">${o.premSub}</span>` : ''}</div>
    ${o.pill ? `<span class="pill ${o.pill.cls || 'p-pend'}">${ui.esc(o.pill.txt)}</span>` : '<span></span>'}
  </div>`;

  /* ---------- ficha acordeón ---------- */
  ui.ficha = (bloques, id) => `<div class="ficha"${id ? ` data-ficha="${ui.esc(id)}"` : ''}>${bloques.map(b => `<div class="fi-bloque">${b.tit ? `<div class="fi-tit">${ui.esc(b.tit)}</div>` : ''}${b.html || ''}</div>`).join('')}</div>`;
  ui.datos = list => `<div class="fi-grid">${list.map(d => `<div class="fi-dato"><div class="l">${ui.esc(d.l)}</div><div class="v${d.txt ? ' txt' : ''}">${d.v ?? '—'}</div></div>`).join('')}</div>`;

  /* ---------- fila con dos barras ---------- */
  ui.vr = o => { const max = o.max || Math.max(1, Math.abs(o.a || 0), Math.abs(o.b || 0)); return `<div class="vr"${o.tip ? ` data-tip="${ui.esc(o.tip)}"` : ''}>
    <div class="vn">${ui.esc(o.nom)}${o.sub ? `<small>${o.sub}</small>` : ''}</div>
    <div class="vbars"><div class="vb a" data-w="${Math.round(100 * Math.abs(o.a || 0) / max)}" style="width:0"></div><div class="vb b${neg(o.b) ? ' neg' : ''}" data-w="${Math.round(100 * Math.abs(o.b || 0) / max)}" style="width:0"></div></div>
    <div class="vnum">${o.num ?? ''}${o.pct != null ? `<br><span class="vpct ${o.pctCls || ''}">${ui.pct(o.pct)}</span>` : ''}</div>
  </div>`; };

  /* ---------- barra con marcas ---------- */
  ui.barrow = o => { const max = o.max || Math.max(1, Math.abs(o.val || 0), ...(o.marcas || []).map(m => Math.abs(m.pos || 0))) * 1.08; const pw = v => Math.max(0, Math.min(100, 100 * v / max)); return `<div class="barrow">
    <div class="l">${ui.esc(o.l)}${o.sub ? `<small>${o.sub}</small>` : ''}</div>
    <div class="track"><div class="fillb${o.neg ? ' neg' : ''}" data-w="${pw(o.val || 0)}" style="width:0"></div>
      ${(o.marcas || []).map(m => `<div class="mk ${m.cls || 'prom'}" style="left:${pw(m.pos)}%"></div><div class="mklab" style="left:${pw(m.pos)}%">${ui.esc(m.lab)}</div>`).join('')}</div>
    <div class="n">${o.n ?? ''}${o.nsub ? `<small>${o.nsub}</small>` : ''}</div>
  </div>`; };

  /* ---------- filas de estado ---------- */
  ui.estados = list => { const max = Math.max(1, ...list.map(x => x.n || 0)); return `<div class="estados">${list.map(x => `<div class="er"><div class="l"><i style="background:${x.color}"></i>${ui.esc(x.l)}</div><div class="t"><i data-w="${Math.round(100 * (x.n || 0) / max)}" style="width:0;background:${x.color}"></i></div><div class="n">${ui.int(x.n)}${x.sub ? `<small>${x.sub}</small>` : ''}</div></div>`).join('')}</div>`; };

  /* ---------- SVG combinado: barras + línea (%) ----------
     meses:[{lbl,bar,line(0-100 o null),tip}] · barNeg: barras negativas en rojo */
  ui.svgCombo = (meses, o = {}) => {
    const W = 820, H = 260, L = 58, R = 46, T = 16, B = 34, iw = W - L - R, ih = H - T - B;
    const vals = meses.map(m => Number(m.bar || 0));
    const maxV = Math.max(1, ...vals.map(Math.abs));
    const minV = Math.min(0, ...vals);
    const range = maxV - minV || 1;
    const y = v => T + ih * (1 - (v - minV) / range);
    const y0 = y(0);
    const step = iw / meses.length, bw = step * 0.5;
    const grid = [0, .25, .5, .75, 1].map(f => { const v = minV + f * range; return `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axn" x="${L - 8}" y="${y(v) + 3}" text-anchor="end">${ui.moneyC(v)}</text>`; }).join('');
    const bars = meses.map((m, i) => { const v = Number(m.bar || 0), x = L + i * step + (step - bw) / 2; const yy = Math.min(y0, y(v)), h = Math.abs(y0 - y(v)); return `<rect x="${x}" y="${yy}" width="${bw}" height="${h}" rx="3" fill="${v < 0 ? 'var(--rojo)' : 'var(--renov)'}"/>`; }).join('');
    const pts = meses.map((m, i) => m.line == null ? null : [L + i * step + step / 2, T + ih * (1 - Math.max(0, Math.min(100, m.line)) / 100)]).filter(Boolean);
    const line = pts.length > 1 ? `<polyline fill="none" stroke="var(--ambar)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>` : '';
    const dots = pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="var(--ambar)" stroke-width="2.5"/>`).join('');
    const right = [0, 50, 100].map(v => `<text class="axn" x="${W - R + 8}" y="${T + ih * (1 - v / 100) + 3}">${v}%</text>`).join('');
    const xl = meses.map((m, i) => `<text class="ax" x="${L + i * step + step / 2}" y="${H - 10}" text-anchor="middle">${ui.esc(m.lbl)}</text>`).join('');
    const hits = meses.map((m, i) => `<rect class="hit" x="${L + i * step}" y="${T}" width="${step}" height="${ih}"${m.tip ? ` data-tip="${ui.esc(m.tip)}"` : ''}/>`).join('');
    return `<svg class="svgw" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${ui.esc(o.aria || 'Gráfica')}">${grid}<line class="gl" x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}" style="stroke:#B6C2CB"/>${bars}${line}${dots}${right}${xl}${hits}</svg>`;
  };

  /* ---------- SVG de líneas: "crecemos a la par" ----------
     xs: valores del eje X (ingreso mensual) · series:[{nombre,color,ys:[...]}] · marca:{y,lbl} horizontal · cruce:{x,y,lbl} */
  ui.svgLineas = (xs, series, o = {}) => {
    const W = 820, H = 290, L = 62, R = 24, T = 18, B = 46, iw = W - L - R, ih = H - T - B;
    const all = series.flatMap(s => s.ys).concat(o.marca ? [o.marca.y] : []);
    const maxY = Math.max(1, ...all), minY = Math.min(0, ...all), rY = maxY - minY || 1;
    const maxX = Math.max(...xs), minX = Math.min(...xs), rX = maxX - minX || 1;
    const X = v => L + iw * (v - minX) / rX, Y = v => T + ih * (1 - (v - minY) / rY);
    const grid = [0, .25, .5, .75, 1].map(f => { const v = minY + f * rY; return `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axn" x="${L - 8}" y="${Y(v) + 3}" text-anchor="end">${ui.moneyC(v)}</text>`; }).join('');
    const zero = minY < 0 ? `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#B6C2CB" stroke-width="1.5"/>` : '';
    const xl = xs.filter((_, i) => i % Math.ceil(xs.length / 8) === 0 || i === xs.length - 1).map(v => `<text class="axn" x="${X(v)}" y="${H - 26}" text-anchor="middle">${ui.moneyC(v)}</text>`).join('');
    const lines = series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="${s.dash ? 2 : 2.5}"${s.dash ? ' stroke-dasharray="6 5"' : ''} stroke-linejoin="round" points="${s.ys.map((v, i) => X(xs[i]) + ',' + Y(v)).join(' ')}"/><text class="ax" x="${X(xs[xs.length - 1]) - 4}" y="${Y(s.ys[s.ys.length - 1]) - 8}" text-anchor="end" style="fill:${s.color};text-transform:none;letter-spacing:0">${ui.esc(s.nombre)}</text>`).join('');
    const marca = o.marca ? `<line x1="${L}" x2="${W - R}" y1="${Y(o.marca.y)}" y2="${Y(o.marca.y)}" stroke="var(--ambar)" stroke-width="2" stroke-dasharray="6 5"/><text class="axn" x="${W - R}" y="${Y(o.marca.y) - 6}" text-anchor="end" style="fill:var(--ambar)">${ui.esc(o.marca.lbl)}</text>` : '';
    const cruce = o.cruce ? `<line x1="${X(o.cruce.x)}" x2="${X(o.cruce.x)}" y1="${T}" y2="${H - B}" stroke="#8FA3B0" stroke-dasharray="3 4"/><circle cx="${X(o.cruce.x)}" cy="${Y(o.cruce.y)}" r="6" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/><text class="ax" x="${X(o.cruce.x) + 10}" y="${Y(o.cruce.y) - 10}" style="fill:var(--ink);text-transform:none;letter-spacing:0">${ui.esc(o.cruce.lbl || '')}</text>` : '';
    return `<svg class="svgw" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${ui.esc(o.aria || 'Gráfica de líneas')}">${grid}${zero}${lines}${marca}${cruce}${xl}<text class="ax" x="${W / 2}" y="${H - 6}" text-anchor="middle" style="font-size:9.5px">${ui.esc(o.xLbl || 'ingreso mensual bruto')}</text></svg>`;
  };

  /* ---------- panel, esqueleto, error, vacío ---------- */
  ui.panel = (o) => `<div class="panel"${o.id ? ` id="${o.id}"` : ''}><div class="ph"><div><div class="pt">${ui.esc(o.tit)}</div>${o.sub ? `<div class="ps">${o.sub}</div>` : ''}</div>${o.leg ? `<div class="leg">${o.leg.map(l => `<span><i style="background:${l.color}"></i>${ui.esc(l.lbl)}</span>`).join('')}</div>` : ''}${o.der || ''}</div>${o.body || ''}</div>`;
  ui.skel = (n = 3, cls = '') => Array.from({ length: n }, () => `<div class="pg-skel ${cls}"></div>`).join('');
  ui.err = (que, retryFn) => `<div class="bloque-err"><span>No se pudo cargar <b>${ui.esc(que)}</b>.</span>${retryFn ? `<button type="button" class="mini" onclick="${retryFn}">Reintentar</button>` : ''}</div>`;
  ui.vacio = html => `<div class="vacio">${html}</div>`;
  ui.pend = txt => `<span class="pend">${ui.esc(txt || 'pendiente')}</span>`;

  /* ---------- mount: animaciones, tooltips delegados, teclado ---------- */
  let tipEl = null;
  function tip() { if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); } return tipEl; }
  document.addEventListener('mousemove', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    const el = tip();
    if (!t) { el.style.opacity = 0; return; }
    el.innerHTML = t.dataset.tip; el.style.opacity = 1;
    const x = Math.min(e.clientX + 14, w.innerWidth - el.offsetWidth - 10), y = Math.min(e.clientY + 14, w.innerHeight - el.offsetHeight - 10);
    el.style.left = x + 'px'; el.style.top = y + 'px';
  }, { passive: true });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.card[role=button]')) { e.preventDefault(); e.target.click(); }
  });
  ui.mount = el => {
    el = el || document;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.querySelectorAll('[data-h]').forEach(x => x.style.height = x.dataset.h + 'px');
      el.querySelectorAll('[data-w]').forEach(x => x.style.width = x.dataset.w + '%');
    }));
  };

    write(o, replace = false) { const s = '#' + Object.entries(o).filter(([, v]) => v != null && v !== '').map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&'); if (replace) history.replaceState(null, '', s); else if (location.hash !== s) location.hash = s; },

    }

  };

/* ---------- REPARTOS / UTILIDADES ---------- */
function calcReparto(monto,regla){
  const r=regla||{operario_pct:0,operario_fijo:0,opex_pct:0,opex_fijo:0};
  const operario=Number(r.operario_fijo)>0?Math.min(Number(r.operario_fijo),monto):Math.round(monto*Number(r.operario_pct))/100;
  const opex=Number(r.opex_fijo)>0?Math.min(Number(r.opex_fijo),monto-operario):Math.round(monto*Number(r.opex_pct))/100;
  const utilidad=Math.round((monto-operario-opex)*100)/100;
  return {operario:Math.round(operario*100)/100,opex:Math.round(opex*100)/100,utilidad};
}
async function generarReparto(c){
  const monto=Number(c.monto);
  const regla=REGLAS.find(r=>r.tipo===(c.tipo==='semanal'?'semanal':'servicio'));
  const x=calcReparto(monto,regla);

async function recalcRepartos(){
  const validados=COBROS.filter(c=>['fondos_validados','pagado'].includes(c.estado));

}

async function crearInvoice(extra){
  const cliente_id=extra?.cliente_id||$('ivCliente')?.value;
  const desc=extra?.desc||$('ivDesc')?.value.trim();
  const qty=extra?.qty??(parseFloat($('ivQty')?.value)||1);
  const rate=extra?.rate??(parseFloat($('ivRate')?.value)||0);
  const metodo=extra?.metodo??($('ivMetodo')?.value.trim()||null);
  const conFee=extra?.fee??($('ivFee')?.checked||false);
  if(!cliente_id||!desc||!rate) return toast('Falta cliente, descripción o tarifa');
  const subtotal=qty*rate;
  const fee=conFee? Math.round(subtotal*0.039*100)/100 : 0;
  const items=[{descripcion:desc,qty,rate,total:subtotal}];
  if(conFee) items.push({descripcion:'Administrative Processing Fee: Applicable for the use of the payment platform (3.9%).',qty:1,rate:fee,total:fee});
  const row={cliente_id,cobro_id:extra?.cobro_id||null,metodo_pago:metodo,items,subtotal,fee_pct:conFee?3.9:0,fee,total:subtotal+fee,created_by:ME.email};
  const {data,error}=await sb.from('amazon_invoices').insert(row).select().single();
  if(error) return toast('Error: '+error.message);
  await evento('invoice_generado',`Invoice ${data.numero} · ${fmt$(data.total)}`,{cliente_id,invoice_id:data.id});
  toast('Invoice '+data.numero+' generado');
  await loadAll();render();imprimirInvoice(data.id);
}

    sb.from('amazon_reglas_reparto').select('*').order('tipo'),
    sb.from('amazon_repartos').select('*').order('created_at', { ascending: false }),

    sb.from('amazon_servicios_pro_notas').select('*').order('created_at', { ascending: false }),
  ]);
  CLIENTES = c.data || []; SERVICIOS = s.data || []; COBROS = co.data || []; INVOICES = inv.data || [];
  LOADS = ld.data || []; REGLAS = rg.data || []; REPARTOS = rp.data || [];
  SERVPRO = sp.data || []; SERVPRO_NOTAS = spn.data || [];
  ERRORES = {};
  const [rent, ren, res, cfg, trm] = await Promise.all([

    sb.from('v_amazon_renovacion').select('*').then(r => r, e => ({ error: e })),
    sb.from('v_amazon_renovacion_resumen').select('*').then(r => r, e => ({ error: e })),
    sb.from('amazon_config').select('*').then(r => r, e => ({ error: e })),
    sb.schema('public').from('trm_diaria').select('valor,fecha').order('fecha', { ascending: false }).limit(1).then(r => r, e => ({ error: e }))
  ]);
  if (rent && !rent.error) RENT = rent.data || []; else { RENT = []; ERRORES.rent = 1; }
  if (ren && !ren.error) RENOV = ren.data || []; else { RENOV = []; ERRORES.renov = 1; }

/* ---------- HELPERS DE ESQUEMA DE COBRO ----------
   calcMontoEsquema(cliente, grossTotal) -> {monto, desglose, base}
   esquemaLabel(cliente) -> texto corto para chips ("Fija $150", "9% con piso $100×2")
------------------------------------------------------------------- */
function calcMontoEsquema(c, gross) {
  gross = Number(gross) || 0;
  const tipo = (c && c.esquema_tipo) || 'fija';
  if (tipo === 'porcentaje') {
    const pct = Number(c.esquema_pct) || 0;
    const m = Math.round(pct * gross) / 100;
    return { monto: m, base: 'porcentaje', desglose: `${pct}% de ${fmt$(gross)} = ${fmt$(m)}` };
  }
  if (tipo === 'porcentaje_piso') {
    const pct = Number(c.esquema_pct) || 0, piso = Number(c.esquema_piso) || 0, u = Number(c.unidades_activas) || 1;
    const porPct = Math.round(pct * gross) / 100;
    const porPiso = Math.round(piso * u * 100) / 100;
    const m = Math.max(porPct, porPiso);
    return {
      monto: m, base: porPiso > porPct ? 'piso' : 'porcentaje',
      desglose: `${pct}% de ${fmt$(gross)} = ${fmt$(porPct)} · piso ${fmt$(piso)} × ${u} unidad${u === 1 ? '' : 'es'} = ${fmt$(porPiso)} → se cobra <b>${fmt$(m)}</b> (${porPiso > porPct ? 'gana el piso' : 'gana el %'})`
    };
  }
  const m = Number(c && c.tarifa_semanal) || 0;
  return { monto: m, base: 'fija', desglose: `Tarifa fija ${fmt$(m)}` };
}
/* v5 — desprendible que recibe la agencia por UN viaje, heredado del esquema del cliente.
   Solo aplica a esquemas porcentuales; en tarifa fija el desprendible se define en el cobro. */
function agenciaDeViaje(c, gross) {
  gross = Number(gross) || 0;
  const t = (c && c.esquema_tipo) || 'fija';
  if (t === 'porcentaje' || t === 'porcentaje_piso') {
    const pct = Number(c.esquema_pct) || 0;
    return { aplica: true, pct: pct, monto: Math.round(pct * gross) / 100 };
  }
  return { aplica: false, pct: 0, monto: null };
}
/* v5 — pinta en vivo el esquema heredado y el desprendible en el formulario de Cargar viaje.
   NO es editable: es cálculo puro del esquema del cliente × el gross que escribe el operador. */
function ldRecalcAgencia() {
  const selC = $('ldCliente'), inpT = $('ldTarifa');
  const chip = $('ldEsquemaChip'), caja = $('ldAgencia');
  if (!selC || !caja) return;
  const c = cli(selC.value);
  const gross = Number(inpT && inpT.value) || 0;
  if (chip) chip.innerHTML = c ? `<span class="pg-chip">Esquema: ${esc(esquemaLabel(c))}</span>` : '';
  if (!c) { caja.innerHTML = 'Elige cliente y escribe el gross para ver el desprendible.'; return; }
  const ag = agenciaDeViaje(c, gross);
  if (!ag.aplica) {
    caja.innerHTML = `Tarifa fija semanal — el desprendible se calcula en el cobro, no por viaje.`;
    return;
  }
  if (!gross) {
    caja.innerHTML = `Escribe el <b>gross del viaje</b> (lo que paga Amazon) y aquí verás lo que recibe la agencia (${ag.pct}%).`;
    return;
  }
  caja.innerHTML = `💵 <b>Agencia recibe: ${fmt$(ag.monto)}</b> (${ag.pct}% de ${fmt$(gross)}) · el gross completo queda registrado como ${fmt$(gross)}.`;
}
function esquemaLabel(c) {
  if (!c) return '—';
  const t = c.esquema_tipo || 'fija';
  if (t === 'porcentaje') return `${Number(c.esquema_pct) || 0}% del gross`;
  if (t === 'porcentaje_piso') return `${Number(c.esquema_pct) || 0}% con piso ${fmt$(c.esquema_piso || 0)} × ${Number(c.unidades_activas) || 1}`;
  return `Fija ${fmt$(c.tarifa_semanal || 0)}`;
}
/* Nivel comercial derivado del esquema (solo etiqueta, no se guarda) */
function nivelCliente(c) {
  if (!c) return '';
  const t = c.esquema_tipo || 'fija';
  if (t === 'fija') {
    const v = Number(c.tarifa_semanal) || 0;
    if (v === 70) return 'Nivel 1';
    if (v === 150) return 'Nivel 2';
    return '';
  }
  return 'Nivel 3';
}

/* ==================================================================
   AMAZON RELAY v4 · MODULO A — CLIENTES
   CRUD + esquemas de cobro + clasificacion (chips + filtro)
   Declara SOLO: vClientes, vClienteDetalle, crearCliente, editarCliente,

   ================================================================== */

/* ---------- helpers privados del modulo (var, no pisan nada) ---------- */
var _cliEsDispatch = c => LOADS.some(l => l.cliente_id === c.id)
  || COBROS.some(co => co.cliente_id === c.id && co.tipo === 'semanal')
  || (c.esquema_tipo && c.esquema_tipo !== 'fija')
  || Number(c.tarifa_semanal) > 0;
var _cliEsServicios = c => SERVPRO.some(s => s.cliente_id === c.id);
var _cliFiltroPasa = c => {
  if (CLI_FILTRO === 'todos') return true;
  const d = _cliEsDispatch(c), s = _cliEsServicios(c);
  if (CLI_FILTRO === 'dispatching') return d;
  if (CLI_FILTRO === 'servicios') return s;
  if (CLI_FILTRO === 'ambos') return d && s;
  return true;
};
var _cliEsqObjDeForm = () => ({
  esquema_tipo: ($('ncEsquema') && $('ncEsquema').value) || 'fija',
  esquema_pct: parseFloat($('ncPct') && $('ncPct').value) || 0,
  esquema_piso: parseFloat($('ncPiso') && $('ncPiso').value) || 0,
  unidades_activas: parseInt($('ncUnidades') && $('ncUnidades').value, 10) || 1,
  tarifa_semanal: parseFloat($('ncTarifa') && $('ncTarifa').value) || 0
});

/* ---------- CLASIFICACION: chips + filtro ---------- */
function chipsCliente(c) {
  const chips = [];
  if (_cliEsDispatch(c)) {
    const niv = nivelCliente(c);
    chips.push(`<span class="pg-chip disp">🚛 Dispatching · ${esc(esquemaLabel(c))}${niv ? ' · ' + esc(niv) : ''}</span>`);
  }
  const porTipo = {};
  servproDeCliente(c.id).forEach(s => {
    const prev = porTipo[s.tipo_servicio];
    if (!prev || new Date(s.created_at) > new Date(prev.created_at)) porTipo[s.tipo_servicio] = s;
  });
  Object.values(porTipo).forEach(s => {
    let cls = 'svc';
    if (s.estado === 'Cancelado/Fallido') cls = 'due';
    else if (s.estado === 'En proceso' || s.estado === 'Sometido a revisión') cls = 'warn';
    chips.push(`<span class="pg-chip ${cls}">🧩 ${esc(s.tipo_servicio)} · ${esc(s.estado)}</span>`);
  });
  if (!chips.length) chips.push('<span class="pg-chip">Sin clasificar</span>');
  return `<div class="pg-chipset">${chips.join('')}</div>`;
}
function setFiltroClientes(f) { CLI_FILTRO = f; render(); }

/* ---------- LIBRO DE CLIENTES + FORMULARIO ---------- */
function vClientes() {

/* ---------- ESQUEMA: cambios en vivo + presets ---------- */
function esquemaTipoChange() {
  const sel = $('ncEsquema'); if (!sel) return;
  const t = sel.value;
  if ($('blkFija')) $('blkFija').classList.toggle('hidden', t !== 'fija');
  if ($('blkPct')) $('blkPct').classList.toggle('hidden', t === 'fija');
  if ($('blkPiso')) $('blkPiso').classList.toggle('hidden', t !== 'porcentaje_piso');
  const r = calcMontoEsquema(_cliEsqObjDeForm(), 3000);
  const d = $('ncDesglose'); if (d) d.innerHTML = `Con este esquema, una semana con gross de $3,000 se cobraría <b>${fmt$(r.monto)}</b>`;
}
function presetEsquema(k) {
  if (!$('ncEsquema')) return;
  if (k === 'n1') { $('ncEsquema').value = 'fija'; $('ncTarifa').value = 70; }
  else if (k === 'n2') { $('ncEsquema').value = 'fija'; $('ncTarifa').value = 150; }
  else if (k === 'n3') { $('ncEsquema').value = 'porcentaje'; $('ncPct').value = 9; }
  else if (k === 'n3piso') { $('ncEsquema').value = 'porcentaje_piso'; $('ncPct').value = 9; $('ncPiso').value = 100; if (!$('ncUnidades').value) $('ncUnidades').value = 1; }
  esquemaTipoChange();
}

/* ---------- CRUD ---------- */
async function crearCliente() {
  const empresa = $('ncEmpresa').value.trim();
  if (!empresa) return toast('Falta la empresa');
  const tipo = ($('ncEsquema') && $('ncEsquema').value) || 'fija';
  const row = {
    empresa, dba: $('ncDba').value.trim() || null, dot: $('ncDot').value.trim() || null, mc: $('ncMc').value.trim() || null,
    representante: $('ncRep').value.trim() || null, telefono: $('ncTel').value.trim() || null, email: $('ncEmail').value.trim() || null,
    contrato: $('ncContrato').value.trim() || null, codigos: $('ncCodigos').value.trim() || null, notas: $('ncNotas').value.trim() || null,
    esquema_tipo: tipo,
    esquema_pct: (tipo === 'porcentaje' || tipo === 'porcentaje_piso') ? (parseFloat($('ncPct').value) || 0) : null,
    esquema_piso: tipo === 'porcentaje_piso' ? (parseFloat($('ncPiso').value) || 0) : null,
    unidades_activas: parseInt(($('ncUnidades') && $('ncUnidades').value) || '1', 10) || 1,
    tarifa_semanal: tipo === 'fija' ? (parseFloat($('ncTarifa').value) || 0) : null
  };
  const editId = EDIT.cliente;
  let error, clienteId;
  if (editId) {
    const r = await sb.from('amazon_clientes').update(row).eq('id', editId).select().single();
    error = r.error; clienteId = editId;
  } else {
    const r = await sb.from('amazon_clientes').insert(row).select().single();
    error = r.error; clienteId = r.data && r.data.id;
  }
  if (error) return toast('Error: ' + error.message);
  await eventoAudit(editId ? 'editado' : 'cliente_creado', (editId ? 'Cliente editado: ' : 'Cliente registrado: ') + empresa, { cliente_id: clienteId });
  EDIT.cliente = null;
  toast(editId ? 'Cliente actualizado' : 'Cliente registrado');
  await loadAll(); render();
}
function editarCliente(id) { EDIT.cliente = id; DETALLE = null; render(); }

async function eliminarCliente(id) {
  const c = cli(id); if (!c) return;
  const loadsN = LOADS.filter(l => l.cliente_id === id).length;
  const cobrosN = COBROS.filter(x => x.cliente_id === id).length;
  const invN = INVOICES.filter(x => x.cliente_id === id).length;
  const spN = servproDeCliente(id).length;
  const total = loadsN + cobrosN + invN + spN;
  const guia = esGuia(c) ? 'Es el ejemplo guía del sistema — sirve de referencia para el equipo.' : undefined;
  if (total > 0) {
    const partes = [];
    if (loadsN) partes.push(`${loadsN} viaje${loadsN === 1 ? '' : 's'}`);
    if (cobrosN) partes.push(`${cobrosN} cobro${cobrosN === 1 ? '' : 's'}`);
    if (invN) partes.push(`${invN} invoice${invN === 1 ? '' : 's'}`);
    if (spN) partes.push(`${spN} servicio${spN === 1 ? '' : 's'} profesional${spN === 1 ? '' : 'es'}`);
    pgConfirm({
      titulo: 'Cliente con historial', peligro: false, textoBoton: 'Inactivar (recomendado)', guia,
      cuerpo: `<b>${esc(c.empresa)}</b> tiene ${partes.join(', ')} vinculados. <b>Inactivar</b> lo oculta de los formularios pero conserva toda su historia. <b>Eliminar del todo</b> lo borra a él y TODO lo suyo (${partes.join(', ')}, repartos y su trazabilidad) — no se puede deshacer.`,
      onOk: async () => {
        const { error } = await sb.from('amazon_clientes').update({ estado: 'inactivo' }).eq('id', id);
        if (error) return toast('Error: ' + error.message);
        await eventoAudit('editado', 'Cliente inactivado: ' + c.empresa, { cliente_id: id });
        toast('Cliente inactivado'); await loadAll(); render();
      },
      textoBoton2: 'Eliminar del todo',
      onOk2: async () => {
        const resumen = partes.join(', ');
        let r;
        r = await sb.from('amazon_invoices').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando invoices: ' + r.error.message);
        r = await sb.from('amazon_cobros').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando cobros: ' + r.error.message);
        r = await sb.from('amazon_loads').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando viajes: ' + r.error.message);
        r = await sb.from('amazon_dosieres').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando dosieres: ' + r.error.message);
        r = await sb.from('amazon_clientes').delete().eq('id', id); if (r.error) return toast('Error: ' + r.error.message);
        await eventoAudit('eliminado', 'Cliente eliminado del todo: ' + c.empresa + ' (incluía ' + resumen + ')', {});
        DETALLE = null; toast('Cliente y todo su historial eliminados'); await loadAll(); render();
      }
    });
  } else {
    pgConfirm({
      titulo: 'Eliminar cliente', peligro: true, textoBoton: 'Sí, eliminar', guia,
      cuerpo: `¿Eliminar a <b>${esc(c.empresa)}</b>? No tiene viajes, cobros, invoices ni servicios vinculados.`,
      onOk: async () => {
        const { error } = await sb.from('amazon_clientes').delete().eq('id', id);
        if (error) return toast('Error: ' + error.message);
        await eventoAudit('eliminado', 'Cliente eliminado: ' + c.empresa, { cliente_id: id });
        toast('Cliente eliminado'); await loadAll(); render();
      }
    });
  }
}

/* ---------- 20-loads.js ---------- */
/* ==================================================================

   filtro por cliente en el libro de viajes.

var _ldFiltro = '';

function rowLoad(l) {
  /* v5 — el avance manual solo recorre Pendiente → En camino → Entregado y ahi se detiene. */
  const i = ESTADOS_LOAD_MANUAL.indexOf(l.estado);
  const next = i >= 0 && i < ESTADOS_LOAD_MANUAL.length - 1 ? ESTADOS_LOAD_MANUAL[i + 1] : null;
  const cobro = l.cobro_id ? COBROS.find(c => c.id === l.cobro_id) : null;
  const chipCobro = cobro ? `<div class="pg-chipset"><span class="pg-chip">🔗 En cobro · ${fmt$(cobro.monto || 0)}</span></div>` : '';
  const accionEstado = l.cobro_id
    ? `<span style="font-size:11px;color:var(--pg-muted)">estado lo maneja el cobro</span>`
    : (next
      ? `<button class="pg-btn sm mint" onclick="avanzarLoad('${l.id}','${next}')">→ ${ESTADO_LBL[next]}</button>`
      : (l.estado === 'entregado' ? `<span style="font-size:11px;color:var(--pg-muted)">esperando cobro</span>` : ''));
  /* v5 — desprendible: el guardado manda; si no hay, se calcula al vuelo con el esquema */
  const _ag = l.agencia_monto != null ? Number(l.agencia_monto) : agenciaDeViaje(cli(l.cliente_id), l.tarifa).monto;
  return `<tr><td><b>${esc(l.load_id_externo || '—')}</b><div style="font-size:11px;color:var(--pg-muted)">${esc(cliName(l.cliente_id))}</div>${chipCobro}</td>
  <td style="font-size:12px">${esc(l.origen || '—')} → ${esc(l.destino || '—')}</td>
  <td style="font-size:12px">${fmtD(l.fecha_hora ? l.fecha_hora.slice(0, 10) : null)}</td>
  <td class="num" style="text-align:right">${l.tarifa ? fmt$(l.tarifa) : '—'}</td>
  <td class="num" style="text-align:right;color:var(--pg-mint);font-weight:700">${_ag != null ? fmt$(_ag) : '—'}</td><td>${pill(l.estado)}</td>
  <td style="white-space:nowrap">${accionEstado}
  <button class="pg-btn sm secondary" onclick="generarDosier('${l.id}')">📑</button>
  <button class="pg-actbtn" title="Editar" onclick="editarLoad('${l.id}')">✏️</button>
  <button class="pg-actbtn" title="Eliminar" onclick="eliminarLoad('${l.id}')">🗑️</button></td></tr>`;
}

function vLoads() {
  const editando = EDIT.load ? LOADS.find(x => x.id === EDIT.load) : null;
  const opsCliente = `<option value="">Todos los clientes</option>` + CLIENTES.map(c => `<option value="${c.id}" ${_ldFiltro === c.id ? 'selected' : ''}>${esGuia(c) ? '🧭 ' : ''}${esc(c.empresa)}</option>`).join('');
  const listaLoads = (_ldFiltro ? LOADS.filter(l => l.cliente_id === _ldFiltro) : LOADS);
  return `
  <div class="pg-eyebrow">Autollenado · v4</div><h1>Cargar viaje</h1>
  <div class="pg-sub">Pega el screenshot o correo del load de Amazon Relay y confirma los campos. Estados que mueves tú: <b>⏳ Pendiente → 🚚 En camino → ✅ Entregado</b>. De ahí en adelante lo maneja el cobro: 🧾 En cobro y 💰 Cobrado se ponen solos.</div>
  <div class="two">
    <div class="pg-card">
      <h2>Libro de viajes (loads)</h2>
      <div class="field" style="max-width:280px"><label>Filtrar por cliente</label><select id="ldFiltroCliente" onchange="_ldFiltro=this.value;render()">${opsCliente}</select></div>
      <table class="pg-table"><thead><tr><th>Load / Cliente</th><th>Ruta</th><th>Fecha</th><th style="text-align:right">Gross</th><th style="text-align:right">Agencia</th><th>Estado</th><th></th></tr></thead><tbody>
      ${listaLoads.map(rowLoad).join('') || '<tr><td colspan="7" style="color:var(--pg-muted)">Sin viajes aún.</td></tr>'}
