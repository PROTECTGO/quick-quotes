<script>
/* =====================================================================
   1) CONEXIÓN — proyecto GABI (motor financiero). Ver SPEC_COMUN.md.
   ===================================================================== */
const SUPABASE_URL = "https://hivpqsepwsfmafamxkzy.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpdnBxc2Vwd3NmbWFmYW14a3p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzOTIxNjUsImV4cCI6MjA5MTk2ODE2NX0.pPe1qtWJhnx8Ffo4bvuwVF-tVrkPSmO63Kl7pKWQYqM";
const SB = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* =========================================================================
   AJUSTE 1 (10-ago-2026) — LAS VENTAS SE CUENTAN POR CLIENTE, NO POR PÓLIZA
   Una venta real es un PAQUETE: GL + Liability + Cargo al MISMO cliente, y
   cada cobertura trae su propio número de póliza. Contar pólizas infla al
   vendedor (medido en vivo 2026: entre 1.55x y 4.00x, y REORDENA el ranking).
   Fuente: vista v_ventas_por_cliente — una fila = un cliente en un mes.
   Llave: DOT (o INSURED normalizado si no hay DOT) + año + mes.
   OJO: la vista todavía NO ESTÁ APLICADA en la base. El SQL listo está en
   ventas_por_cliente.sql y lo aplica el chat madre. Si la vista no existe
   (42P01 / PGRST205), estos bloques degradan a "pendiente de aplicar el SQL"
   en vez de romper la pantalla.
   ========================================================================= */
const VPC_VIEW = 'v_ventas_por_cliente';
const VPC_COLS = 'seller,cliente_key,insured,dba,sales_year,sales_month,polizas,coberturas_txt,policy_nums_txt,premium_paquete,fee_agencia_paquete,tiene_fee,cargos_carrier_paquete';
const VPC = { ok:null, err:'' };
function vpcFaltaVista(error){
  const c = String((error && error.code) || '');
  const m = String((error && error.message) || '');
  return c === '42P01' || c === 'PGRST205' || c === 'PGRST202' ||
         /does not exist|schema cache|could not find the table/i.test(m);
}
async function vpcRows(build){
  let q = SB.from(VPC_VIEW).select(VPC_COLS).limit(5000); // FIX RONDA 3 — FALLA 2: tope explícito (el default de Supabase corta en 1.000 filas SIN dar error)
  if (build) q = build(q);
  const { data, error } = await q;
  if (error){
    if (vpcFaltaVista(error)){ VPC.ok = false; VPC.err = error.message || ''; return null; }
    throw error;
  }
  VPC.ok = true;
  return data || [];
}
function vpcEsc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function vpcUSD(n){ return (n===null||n===undefined||isNaN(n)) ? '—' : '$' + Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }
const VPC_PENDIENTE = (que) => '<div class="vpc-pend"><b>Pendiente de aplicar el SQL.</b> ' + que +
  ' ahora se cuenta por <b>cliente cerrado</b> (el paquete completo, no cada póliza) y sale de la vista <code>v_ventas_por_cliente</code>, que todavía no está creada en la base. El archivo listo es <code>ventas_por_cliente.sql</code>. Mientras no se aplique, este bloque no muestra el número, para no publicar un conteo por póliza.</div>';
const VPC_NOTA = '<div class="vpc-nota"><b>Cambió cómo se cuenta.</b> 1 venta = 1 <b>cliente cerrado</b>, no 1 póliza. Un cliente con GL + Liability + Cargo antes contaba 3 ventas; ahora cuenta 1, y sus 3 coberturas se ven al abrir el cliente. Por eso estos números son más bajos que los de la preview anterior. Las métricas de fee también van por paquete: el fee se negocia por cliente, no por póliza.</div>';
function vpcPorVendedor(rows){
  const m = {};
  (rows||[]).forEach(r=>{
    const k = r.seller || '(sin vendedor)';
    if(!m[k]) m[k] = { agente:k, clientes:0, polizas:0, clientes_con_fee:0, fee_agencia:0, premium:0, detalle:[] };
    const g = m[k];
    g.clientes += 1;
    g.polizas  += Number(r.polizas||0);
    if(r.tiene_fee) g.clientes_con_fee += 1;
    g.fee_agencia += Number(r.fee_agencia_paquete||0);
    g.premium     += Number(r.premium_paquete||0);
    g.detalle.push(r);
  });
  return Object.values(m).map(g=>{
    g.tasa_cobro    = g.clientes ? (g.clientes_con_fee / g.clientes * 100) : 0;
    g.fee_x_cliente = g.clientes ? (g.fee_agencia / g.clientes) : 0;
    return g;
  });
}
function vpcIndicePorAgente(rows){
  const idx = {};
  vpcPorVendedor(rows).forEach(g => { idx[String(g.agente).trim().toLowerCase()] = g; });
  return idx;
}
/* --- EL DETALLE DE PÓLIZAS QUEDA UN CLIC ADENTRO (fila expandible) ------- */
let VPC_SEQ = 0;
function vpcDetalleHTML(rows){
  if(!rows || !rows.length) return '<div class="vpc-det-vacio">Sin clientes en el periodo.</div>';
  return rows.slice().sort((a,b)=>Number(b.polizas||0)-Number(a.polizas||0)).map(r=>{
    const np = Number(r.polizas||0);
    return '<div class="vpc-cli">' +
      '<div class="vpc-cli-top"><b>' + vpcEsc(r.insured || r.cliente_key) + '</b>' +
      (r.dba ? ' <span class="vpc-dim">(' + vpcEsc(r.dba) + ')</span>' : '') +
      ' <span class="vpc-badge">este cliente llevó ' + np + ' cobertura' + (np===1?'':'s') + '</span></div>' +
      '<div class="vpc-cli-mid">' + vpcEsc(r.coberturas_txt || '—') + '</div>' +
      '<div class="vpc-cli-bot">fee de agencia del paquete <b>' + vpcUSD(r.fee_agencia_paquete) + '</b>' +
      ' · premium del paquete ' + vpcUSD(r.premium_paquete) +
      ' · pólizas: ' + vpcEsc(r.policy_nums_txt || '—') +

// Estándar de fees cobrados/mes — es un parámetro PERMANENTE de política de
// incentivos (piso mensual, no techo), pero el VALOR se lee en vivo del plan
// vigente en incentivos_config.umbrales.estandar_equipo_usd_mes (no se
// escribe a mano). 1500 es solo el fallback si esa lectura falla.
let ESTANDAR_USD = 1500;

async function resolverEstandarVigente() {
  const hoyISO = new Date().toISOString().slice(0,10);
  const { data, error } = await SB.from('incentivos_config')
    .select('umbrales,vigencia_desde,vigencia_hasta')
    .lte('vigencia_desde', hoyISO)
    .or(`vigencia_hasta.is.null,vigencia_hasta.gte.${hoyISO}`)
    .order('vigencia_desde', { ascending:false }).limit(1);
  if (error || !data || !data.length) return; // se queda con el fallback de 1500
  const v = data[0].umbrales && data[0].umbrales.estandar_equipo_usd_mes;
  if (v != null && !isNaN(Number(v))) ESTANDAR_USD = Number(v);
}

const fmtUSD = (n) => (n===null||n===undefined||isNaN(n)) ? "—" : "$" + Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtUSD0 = (n) => (n===null||n===undefined||isNaN(n)) ? "—" : "$" + Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
const fmtPct = (n,d=0) => (n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toFixed(d) + "%";
const clamp = (n,lo,hi) => Math.max(lo, Math.min(hi, isFinite(n)?n:lo));
const semaforoDot = (color) => `<div class="pg-semaforo ${color}"></div>`;
const sectionDivider = (label) => `<div class="pg-section-divider"><span class="sd-lbl">${label}</span><div class="sd-line"></div></div>`;
function sparkSVG(serie, w=200, h=50, color="#2DBFA3") {
  if (!serie || !serie.length) return "";
  const vals = serie.map(p => Number(p.fees||0));
  const max = Math.max(...vals, 1);
  const stepX = w / (vals.length - 1 || 1);
  const pts = vals.map((v,i) => `${(i*stepX).toFixed(1)},${(h - (v/max)*h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function progressBar(label, valorTxt, pct, cls="", nota="") {
  return `<div class="pg-progress-block">
    <div class="pl-top"><span class="pl-lbl">${label}</span><span class="pl-val">${valorTxt}</span></div>
    <div class="pg-progress-track"><div class="pg-progress-fill ${cls}" style="width:${clamp(pct,0,100)}%"></div></div>
    ${nota ? `<div class="pl-note">${nota}</div>` : ""}
  </div>`;
}
function skeletonBlock(lines=3){ return Array.from({length:lines}).map((_,i)=>`<div class="pg-skel" style="width:${90-i*12}%"></div>`).join(""); }
function errorBanner(nombreSeccion, msg){
  return `<div class="pg-error-box">No pudimos cargar "${nombreSeccion}" ahora mismo. ${msg?('Detalle: '+msg):''} — reintenta con "Actualizar".</div>`;
}

let MI_AGENTE_ID = null;

async function resolverMiAgente() {
  // current_agente_id(): función SECURITY DEFINER ya montada — NO se toca.
  const { data: idData, error: idErr } = await SB.rpc('current_agente_id');
  if (idErr) throw idErr;

}

async function seccion(nombre, mountId, fn) {

/* ---- Sección: Mi mes vs estándar $1,500 (piso) --------------------- */
async function cargarMiMes(el) {
  el.innerHTML = skeletonBlock(4);
  try { await resolverEstandarVigente(); } catch (e) { console.error("[GABI asesor] no se pudo leer el estándar vigente, usando fallback:", e); }
  // Mi mes (meta) vía RPC SECURITY DEFINER: devuelve SOLO la meta del propio asesor, sin exponer
  // el roster del equipo. v_meta_por_asesor arma su lista de activos desde bases_turbo (que trae los
  // baselines de TODOS los asesores) — no se le abre a un asesor por el principio "solo lo tuyo".
  // La RPC resuelve al llamante por dentro (current_agente_id) y trae los mismos campos que usa mm.
  const { data: metaRows, error: e1 } = await SB.rpc('mi_meta_del_mes');
  if (e1) throw e1;
  const { data: liqRows, error: e2 } = await SB.from('v_liquidacion_incentivos').select('*').eq('agente', MI_NOMBRE).order('mes', { ascending:false }).limit(1);
  if (e2) throw e2;

  const mm = (metaRows && metaRows[0]) || null;
  const mes = (liqRows && liqRows[0]) || null;

  if (!mm && !mes) { el.innerHTML = `<div class="pg-warn-box">Sin datos de este mes para tu usuario todavía. Se actualiza con cada venta registrada.</div>`; return; }

  const llevaCobrado = mm ? Number(mm.lleva_cobrado||0) : (mes ? Number(mes.fees_cobrados||0) : 0);
  // "Te faltan" del estándar SIEMPRE sale de restar contra ESTANDAR_USD (el piso de $1,500 leído
  // en vivo) — nunca de v_meta_por_asesor.le_falta, que está calculado contra la META PERSONAL
  // (otra base, casi siempre distinta). Mezclar las dos en una sola frase da aritmética que no cuadra.
  const leFaltaEstandar = Math.max(0, ESTANDAR_USD - llevaCobrado);
  const ventasMes = mm ? Number(mm.ventas_mes||0) : (mes ? Number(mes.ventas||0) : 0);
  const feesRiesgo = mm ? Number(mm.en_riesgo||0) : (mes ? Number(mes.fees_en_riesgo||0) : 0);
  const pctEstandar = clamp(llevaCobrado / ESTANDAR_USD * 100, 0, 100);
  const tieneMetaPersonal = mm && mm.meta_personal_mes != null;
  const metaPersonal = tieneMetaPersonal ? Number(mm.meta_personal_mes) : null;
  const leFaltaMetaPersonal = tieneMetaPersonal ? Number(mm.le_falta||0) : null;

  // AJUSTE 1 — "ventas" = CLIENTES CERRADOS (el paquete), no pólizas. `ventasMes` (de las vistas
  // del motor) cuenta pólizas y queda solo como respaldo/detalle. Si v_ventas_por_cliente no está
  // aplicada todavía, se muestra "—" + aviso, nunca el número por póliza disfrazado de venta.
  const _hoyVPC = new Date();
  let misPaquetes = null;
  try {
    misPaquetes = await vpcRows(q => q.eq('seller', MI_NOMBRE)
      .eq('sales_year', _hoyVPC.getFullYear()).eq('sales_month', _hoyVPC.getMonth()+1));
  } catch(e){ console.error("[GABI asesor] v_ventas_por_cliente", e); }
  const misClientes    = misPaquetes ? misPaquetes.length : null;
  const misPolizas     = misPaquetes ? misPaquetes.reduce((s,r)=>s+Number(r.polizas||0),0) : ventasMes;
  const miFeePaquetes  = misPaquetes ? misPaquetes.reduce((s,r)=>s+Number(r.fee_agencia_paquete||0),0) : null;
  const misConFee      = misPaquetes ? misPaquetes.filter(r=>r.tiene_fee).length : null;
  const miFeeXCliente  = (misClientes && misClientes>0) ? (miFeePaquetes/misClientes) : null;

  el.innerHTML = `
    <div class="pg-headline">
      ${semaforoDot(pctEstandar>=100 ? "green" : pctEstandar>=50 ? "amber" : "red")}
      <div>
        <p class="pg-headline-text">Llevas ${fmtUSD0(llevaCobrado)} cobrado de tu estándar de ${fmtUSD0(ESTANDAR_USD)} este mes (${fmtPct(pctEstandar)}).</p>
        <div class="pg-headline-sub">Te faltan ${fmtUSD0(leFaltaEstandar)} para el estándar · llevas ${misClientes===null ? "—" : misClientes} venta(s) este mes ${misClientes===null ? "(pendiente de aplicar v_ventas_por_cliente)" : `= ${misClientes} cliente(s) cerrado(s), ${misPolizas} póliza(s)`} · fees en riesgo: ${fmtUSD0(feesRiesgo)}.</div>
        ${tieneMetaPersonal ? `<div class="pg-headline-sub">Tu <b>meta personal</b> (no es el estándar, es otra base) es ${fmtUSD0(metaPersonal)} — te faltan ${fmtUSD0(leFaltaMetaPersonal)} para cumplirla.</div>` : ""}
      </div>
    </div>
    <div class="pg-card" style="margin-top:6px;">
      <h2>Fee de agencia cobrado · tuyo · del mes vs estándar ${fmtUSD0(ESTANDAR_USD)}</h2>
      <p class="pg-purpose">El estándar es un <b>piso</b>, no un techo: es lo mínimo esperado, no el límite. Solo cuenta el fee <b>COBRADO</b>, no el prometido. "Fee" aquí siempre es el <b>fee de agencia</b> (<code>seller_fees</code>), lo que tú negociaste — los cargos del carrier (<code>policy_fees</code>) no son ingreso de la agencia y no cuentan.</p>
      ${progressBar("Tu avance", `${fmtUSD0(llevaCobrado)} / ${fmtUSD0(ESTANDAR_USD)}`, pctEstandar, pctEstandar>=100?"pos":pctEstandar>=50?"warn":"neg")}
      <div class="pg-chart-wrap"><canvas id="chEstandar"></canvas></div>
    </div>
    <div class="pg-kpis">
      <div class="pg-kpi"><div class="lbl">Ventas este mes (clientes cerrados)</div><div class="val">${misClientes===null ? "—" : misClientes}</div><div class="sub">${misClientes===null ? "pendiente: falta aplicar v_ventas_por_cliente" : `${misPolizas} póliza(s) en total · 1 venta = 1 cliente (paquete)`}</div>${scope("por cliente cerrado · tuyo · del mes en curso · fuente v_ventas_por_cliente")}</div>
      <div class="pg-kpi"><div class="lbl">Fee de agencia por cliente · tuyo · del mes</div><div class="val">${miFeeXCliente!=null ? fmtUSD(miFeeXCliente) : "—"}</div><div class="sub">${miFeeXCliente!=null ? `seller_fees del mes ÷ ${misClientes} cliente(s) cerrado(s) — el fee se negocia por cliente, no por póliza` : "pendiente: falta aplicar v_ventas_por_cliente"}</div>${scope("fee de agencia · por cliente · tuyo · del mes en curso · fuente seller_fees")}</div>
      <div class="pg-kpi"><div class="lbl">Fee de agencia prometido sin cobrar · tuyo · del mes</div><div class="val ${feesRiesgo>0?'neg':'pos'}">${fmtUSD0(feesRiesgo)}</div><div class="sub">seller_fees sin fecha de pago</div>${scope("fee de agencia prometido sin cobrar · tuyo · del mes en curso")}</div>
      <div class="pg-kpi"><div class="lbl">Premium neto</div><div class="val">${mes ? fmtUSD0(mes.premium_neto) : "—"}</div><div class="sub">no es ingreso de la agencia: es lo que paga el cliente por su seguro</div>${scope("premium neto · tuyo · del mes en curso · fuente policy_premium")}</div>
    </div>
    <div class="pg-card" style="margin-top:6px;">
      <h2>Tus clientes de este mes — el detalle de coberturas</h2>
      <p class="pg-purpose">Cada bloque es UNA venta = UN cliente. Adentro están las coberturas (pólizas) que llevó ese cliente.</p>
      ${VPC_NOTA}
      ${misPaquetes === null ? VPC_PENDIENTE("Tus ventas del mes") : vpcDetalleHTML(misPaquetes)}
      ${misPaquetes ? `<div class="pg-purpose" style="margin-top:8px;">Tasa de cobro del mes: <b>${misConFee} de ${misClientes} cliente(s) cerrado(s) con fee de agencia cobrado</b> — de cada 10 clientes, cobras en ${misClientes ? Math.round(misConFee/misClientes*10) : 0}.</div>` : ""}
    </div>`;

  new Chart(document.getElementById("chEstandar"), {
    type: "bar",
    data: { labels: ["Tu mes"], datasets: [
      { label: "Cobrado", data: [llevaCobrado], backgroundColor: "#2DBFA3", borderRadius: 6 },
      { label: "Estándar " + fmtUSD0(ESTANDAR_USD), data: [ESTANDAR_USD], backgroundColor: "#E7EDF2", borderRadius: 6 }
    ]},
    options: { indexAxis: "y", plugins: { legend: { position:"bottom" } }, scales: { x: { ticks: { callback: v => "$"+v } } } }
  });
}

/* ---- Sección: Mi tasa de cobro explicada (fee es contextual) -------- */
async function cargarMiTasaCobro(el) {
  el.innerHTML = skeletonBlock(4);
  const { data, error } = await SB.from('v_desempeno_fee_justo').select('*').eq('agente', MI_NOMBRE).order('mes', { ascending:false }).limit(5000);
  if (error) throw error;
  if (!data || !data.length) { el.innerHTML = `<div class="pg-warn-box">Aún no hay ventas suficientes para calcular tu tasa de cobro.</div>`; return; }

  // Agregado simple sobre las filas disponibles (evita comparar "fee promedio" entre agentes;
  // la métrica que se usa es SIEMPRE tasa de cobro + captura vs banda, nunca fee promedio absoluto).
  const totVentas = data.reduce((s,r)=>s+Number(r.ventas||0),0);
  const totConFee = data.reduce((s,r)=>s+Number(r.ventas_con_fee||0),0);
  const tasaCobro = totVentas>0 ? (totConFee/totVentas*100) : 0;
  const capturas = data.map(r=>r.captura_vs_tipico).filter(v=>v!=null).map(Number);
  const capturaProm = capturas.length ? (capturas.reduce((a,b)=>a+b,0)/capturas.length) : null;

  // AJUSTE 1 — la tasa de cobro se mide POR CLIENTE CERRADO (el fee se negocia por cliente, no por
  // póliza): así deja de castigar a quien vende paquetes. La tasa por póliza queda como referencia.
  let misPq = null;
  try { misPq = await vpcRows(q => q.eq('seller', MI_NOMBRE)); }
  catch(e){ console.error("[GABI asesor] v_ventas_por_cliente (tasa)", e); }
  const cliTot    = misPq ? misPq.length : null;
  const cliConFee = misPq ? misPq.filter(r=>r.tiene_fee).length : null;
  const tasaCli   = (cliTot && cliTot>0) ? (cliConFee/cliTot*100) : null;

  el.innerHTML = `
    <h2>Tu tasa de cobro — el dato clave</h2>
    <p class="pg-purpose">De cada 10 <b>clientes cerrados</b>, ¿en cuántos terminas cobrando el fee de agencia? El fee depende de qué tan complicado es cada caso, no del premium — por eso aquí no se mide quién cobra más por venta ni se te compara con nadie.</p>
    ${VPC_NOTA}
    <div class="pg-kpis">
      <div class="pg-kpi"><div class="lbl">Tasa de cobro · por cliente cerrado</div><div class="val">${tasaCli!=null ? fmtPct(tasaCli) : "—"}</div><div class="sub">${tasaCli!=null ? `${cliConFee} de ${cliTot} cliente(s) cerrado(s) con fee de agencia cobrado` : "pendiente: falta aplicar v_ventas_por_cliente"}</div>${scope("tasa de cobro · por cliente cerrado · tuyo · del mes en curso")}</div>
      <div class="pg-kpi"><div class="lbl">Referencia · por póliza (así se medía antes)</div><div class="val" style="color:var(--pg-muted)">${fmtPct(tasaCobro)}</div><div class="sub">${totConFee} de ${totVentas} pólizas con fee — castiga a quien vende paquetes</div>${scope("tasa de cobro · por póliza (medida vieja) · tuyo · del mes en curso")}</div>
      <div class="pg-kpi"><div class="lbl">Captura vs banda</div><div class="val pos">${capturaProm!=null ? capturaProm.toFixed(2)+"x" : "—"}</div><div class="sub">cuando cobras, vs. lo típico para ese tipo de riesgo</div>${scope("captura vs banda · tuyo · del mes en curso · fuente v_desempeno_fee_justo")}</div>
    </div>
    <div class="pg-translator">
      ${capturaProm!=null
        ? `Tienes una tasa de cobro del <b>${tasaCli!=null ? fmtPct(tasaCli) : fmtPct(tasaCobro)}</b> — de cada 10 ${tasaCli!=null ? "clientes cerrados" : "pólizas"}, cobras fee en unas ${Math.round((tasaCli!=null?tasaCli:tasaCobro)/10)}. Cuando sí cobras, tu captura es de <b>${capturaProm.toFixed(2)}x</b> lo típico para ese tipo de póliza. En palabras simples: ${capturaProm>=1 ? 'cobras por encima de lo esperado cuando cobras' : 'cobras algo por debajo de lo esperado cuando cobras'}. El reto no es solo "cobrar mejor" — es <b>cobrar más seguido</b>.`
        : `Tienes una tasa de cobro del <b>${fmtPct(tasaCobro)}</b>. Todavía no hay suficientes ventas con fee cobrado para comparar contra la banda típica.`}
    </div>`;
}

/* ---- Sección: TU PROCESO (Fase 2) — toda tu historia, tu evolución ----
   Reemplaza la vieja idea de "costo del puesto" (descartada por Andrés): aquí
   NO se habla de lo que cuestas, ni de nómina, ni de utilidad, ni se te compara
   con NADIE. Es SOLO tu proceso: cómo evolucionó tu fee cobrado y tu premium
   mes a mes, tus mejores marcas y tu crecimiento desde que empezaste. El piso
   (leído en vivo) es un PISO, no un techo.
   Fuentes (todas ya visibles para ti por RLS, sin permisos ni funciones nuevas):
     · v_liquidacion_incentivos  -> fee cobrado / premium / estandar_ok por mes
     · v_ventas_por_cliente      -> clientes cerrados (paquete) por mes, tuyos
     · agente_contexto           -> meses activos (respaldo)                     */
let CH_PROCESO = null;
async function cargarMiProceso(el) {
  el.innerHTML = skeletonBlock(5);
  try { await resolverEstandarVigente(); } catch (e) { console.error("[GABI asesor] estándar (proceso)", e); }

  // 1) Historia fee/premium/estandar por mes, cronológica.
  const { data: histRaw, error: eHist } = await SB.from('v_liquidacion_incentivos')
    .select('mes,fees_cobrados,premium_neto,ventas,estandar_ok')
    .eq('agente', MI_NOMBRE).order('mes', { ascending:true }).limit(5000);
  if (eHist) throw eHist;
  const hist = (histRaw || []).filter(r => r.mes);
  if (!hist.length) {
    el.innerHTML = `<div class="pg-warn-box">Todavía no hay historial para construir tu proceso. Aparecerá aquí con tus primeros meses de ventas.</div>`;
    return;
  }

  // 2) Clientes cerrados (paquete) por mes — del propio seller (RLS: solo lo tuyo).
  let pqRows = null;
  try { pqRows = await vpcRows(q => q.eq('seller', MI_NOMBRE)); }
  catch (e) { console.error("[GABI asesor] v_ventas_por_cliente (proceso)", e); }
  const cliPorMes = {};              // 'YYYY-MM' -> nº de clientes
  let cliAcum = null;
  if (pqRows) {
    cliAcum = pqRows.length;
    pqRows.forEach(r => {
      const k = `${r.sales_year}-${String(r.sales_month).padStart(2,'0')}`;
      cliPorMes[k] = (cliPorMes[k] || 0) + 1;
    });
  }
  const cliDeMes = (mesStr) => { const { y, m } = partesMes(mesStr); return cliPorMes[`${y}-${String(m).padStart(2,'0')}`] ?? null; };

  // 3) Mes en curso (punto hueco "en curso"): no cierra todavía, no cuenta para la racha.
  const hoyP = new Date();
  const mesActualYM = `${hoyP.getFullYear()}-${String(hoyP.getMonth()+1).padStart(2,'0')}`;
  const esMesEnCurso = (mesStr) => String(mesStr).slice(0,7) === mesActualYM;

  // 4) Marcas, récords, racha y crecimiento.
  const feeVals  = hist.map(r => Number(r.fees_cobrados||0));
  const premVals = hist.map(r => Number(r.premium_neto||0));
  const maxFee   = Math.max(...feeVals);
  const maxPrem  = Math.max(...premVals);
  const idxBestFee  = feeVals.indexOf(maxFee);
  const idxBestPrem = premVals.indexOf(maxPrem);
  let bestCliMes = null, bestCliN = -1;
  Object.keys(cliPorMes).forEach(k => { if (cliPorMes[k] > bestCliN) { bestCliN = cliPorMes[k]; bestCliMes = k; } });
  // Racha más larga cumpliendo el piso (estandar_ok consecutivos), sin el mes en curso.
  let rachaMax = 0, rachaCur = 0;
  hist.forEach(r => {
    if (esMesEnCurso(r.mes)) return;
    if (r.estandar_ok) { rachaCur++; if (rachaCur > rachaMax) rachaMax = rachaCur; } else rachaCur = 0;
  });
  // Crecimiento: promedio de tus primeros vs tus últimos meses activos (fee).
  const activos = hist.filter(r => Number(r.fees_cobrados||0) > 0 || Number(r.ventas||0) > 0);
  const mesesActivos = activos.length;
  // Crecimiento: SOLO meses cerrados (excluye el mes en curso, que va incompleto) —
  // consistente con la racha, que tampoco cuenta el mes en curso.
  const activosCerrados = activos.filter(r => !esMesEnCurso(r.mes));
  const tomaN = Math.min(3, Math.max(1, Math.floor(activosCerrados.length/2)));
  const prom = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  const feePrimeros = prom(activosCerrados.slice(0, tomaN).map(r => Number(r.fees_cobrados||0)));
  const feeUltimos  = prom(activosCerrados.slice(-tomaN).map(r => Number(r.fees_cobrados||0)));
  const crecPct = (activosCerrados.length >= 2 && feePrimeros > 0) ? ((feeUltimos - feePrimeros) / feePrimeros * 100) : null;
  const premAcum = premVals.reduce((a,b)=>a+b,0);

  el.innerHTML = `
    <h2>Tu proceso — toda tu historia</h2>
    <p class="pg-purpose">Así ha evolucionado <b>tu</b> fee de agencia cobrado y tu premium, mes a mes, desde que empezaste. La línea gris punteada es <b>tu piso</b> de ${fmtUSD0(ESTANDAR_USD)} — es un <b>piso, no un techo</b>. Los puntos verdes son meses en o sobre el piso; los dorados, meses por debajo. Aquí no hay comparación con nadie: es solo tu camino.</p>
    <div class="pg-chart-wrap" style="height:280px;"><canvas id="chProceso"></canvas></div>

    <div class="pg-section-divider" style="margin:24px 0 14px;"><span class="sd-lbl">Los grandes éxitos de tu proceso</span><div class="sd-line"></div></div>
    <div class="pg-hitos-grid">
      <div class="pg-hito"><div class="hito-ico">🏅</div><div class="hito-lbl">Tu mejor mes de fee</div><div class="hito-val">${maxFee>0 ? fmtUSD0(maxFee) : "—"}</div><div class="hito-sub">${maxFee>0 ? fmtMesLargo(hist[idxBestFee].mes) : "aún sin fee cobrado"}</div></div>
      <div class="pg-hito"><div class="hito-ico">🏅</div><div class="hito-lbl">Tu mejor mes de premium</div><div class="hito-val">${maxPrem>0 ? fmtUSD0(maxPrem) : "—"}</div><div class="hito-sub">${maxPrem>0 ? fmtMesLargo(hist[idxBestPrem].mes) : "aún sin premium"}</div></div>
      <div class="pg-hito"><div class="hito-ico">🏅</div><div class="hito-lbl">Tu mejor mes de clientes</div><div class="hito-val">${bestCliMes ? bestCliN : "—"}</div><div class="hito-sub">${bestCliMes ? `${bestCliN} cliente(s) cerrado(s) · ${fmtMesCorto(bestCliMes+"-01")}` : (pqRows===null ? "pendiente: falta aplicar v_ventas_por_cliente" : "aún sin clientes registrados")}</div></div>
      <div class="pg-hito"><div class="hito-ico">🔥</div><div class="hito-lbl">Tu racha más larga en el piso</div><div class="hito-val">${rachaMax}</div><div class="hito-sub">mes(es) seguidos en o sobre tu piso</div></div>
    </div>

    <div class="pg-section-divider" style="margin:24px 0 14px;"><span class="sd-lbl">Rendimiento de tu proceso</span><div class="sd-line"></div></div>
    <div class="pg-kpis">
      <div class="pg-kpi"><div class="lbl">Meses activos</div><div class="val">${mesesActivos}</div><div class="sub">meses con ventas o fee cobrado</div>${scope("meses activos · tuyo · histórico · fuente v_liquidacion_incentivos")}</div>
      <div class="pg-kpi"><div class="lbl">Crecimiento desde tus inicios</div><div class="val ${crecPct==null?"":(crecPct>=0?"pos":"neg")}">${crecPct==null ? "—" : (crecPct>=0?"+":"")+crecPct.toFixed(0)+"%"}</div><div class="sub">${crecPct==null ? "aún no hay suficientes meses" : `promedio de tus primeros ${tomaN} vs tus últimos ${tomaN} meses activos`}</div>${scope("crecimiento de fee · primeros vs últimos meses · tuyo · histórico")}</div>
      <div class="pg-kpi"><div class="lbl">Premium acumulado</div><div class="val">${fmtUSD0(premAcum)}</div><div class="sub">no es ingreso de la agencia: es lo que han pagado tus clientes por su seguro</div>${scope("premium neto · tuyo · acumulado histórico · fuente v_liquidacion_incentivos")}</div>
      <div class="pg-kpi"><div class="lbl">Clientes cerrados acumulados</div><div class="val">${cliAcum==null ? "—" : cliAcum}</div><div class="sub">${cliAcum==null ? (pqRows===null ? "pendiente: falta aplicar v_ventas_por_cliente" : "—") : "clientes cerrados (paquetes) en toda tu historia"}</div>${scope("clientes cerrados · tuyo · acumulado histórico · fuente v_ventas_por_cliente")}</div>
    </div>
    ${pqRows===null ? VPC_PENDIENTE("Los datos de clientes de tu proceso") : ""}`;

  // --- Gráfica dinámica de curvas (referencia visual: Utilidad por persona de GABI 360) ---
  if (CH_PROCESO) { try { CH_PROCESO.destroy(); } catch (e) {} }
  const ptBg = hist.map(r => esMesEnCurso(r.mes) ? "#FFFFFF" : (r.estandar_ok ? "#1F9D6B" : "#B8841F"));
  const ptBd = hist.map(r => esMesEnCurso(r.mes) ? "#2DBFA3" : (r.estandar_ok ? "#1F9D6B" : "#B8841F"));
  const ptR  = hist.map((r,i) => i===idxBestFee ? 6 : (esMesEnCurso(r.mes) ? 5.5 : 3.5));
  CH_PROCESO = new Chart(document.getElementById("chProceso"), {
    data: {
      labels: hist.map(r => fmtMesCorto(r.mes)),
      datasets: [
        { type:"line", label:"Fee de agencia cobrado", data:feeVals, yAxisID:"y", order:0,
          borderColor:"#2DBFA3", borderWidth:2.6, tension:.35, fill:true,
          backgroundColor:(ctx)=>{ const ch=ctx.chart, {ctx:c2,chartArea}=ch; if(!chartArea) return "rgba(45,191,163,.14)"; const g=c2.createLinearGradient(0,chartArea.top,0,chartArea.bottom); g.addColorStop(0,"rgba(45,191,163,.30)"); g.addColorStop(1,"rgba(45,191,163,0)"); return g; },
          pointBackgroundColor:ptBg, pointBorderColor:ptBd, pointBorderWidth:2, pointRadius:ptR, pointHoverRadius:7, pointStyle:"circle" },
        { type:"line", label:"Premium neto", data:premVals, yAxisID:"y2", order:2,
          borderColor:"#1F9D6B", borderWidth:1.8, borderDash:[5,4], tension:.35, fill:false, pointRadius:0, pointHoverRadius:0 },
        { type:"line", label:`Tu piso (${fmtUSD0(ESTANDAR_USD)})`, data:hist.map(()=>ESTANDAR_USD), yAxisID:"y", order:3,
          borderColor:"#9AA9B4", borderWidth:1.4, borderDash:[4,4], tension:0, fill:false, pointRadius:0, pointHoverRadius:0 }
      ]
    },
    options: {
      maintainAspectRatio:false,
      interaction:{ mode:"index", intersect:false },
      plugins:{
        legend:{ position:"bottom", labels:{ usePointStyle:true, pointStyle:"circle", boxWidth:8, font:{size:12} } },
        tooltip:{ filter:(it)=>it.datasetIndex===0, callbacks:{
          title:(items)=>{ const i=items[0].dataIndex; let t=fmtMesLargo(hist[i].mes); if(i===idxBestFee && maxFee>0) t="🏅 "+t+" · tu récord"; if(esMesEnCurso(hist[i].mes)) t+=" · en curso"; return t; },
          label:(item)=>{ const i=item.dataIndex; const c=cliDeMes(hist[i].mes); return ["Fee cobrado: "+fmtUSD0(feeVals[i]), "Premium neto: "+fmtUSD0(premVals[i]), "Clientes: "+(c==null?"—":c)]; }
        } }
      },
      scales:{
        y:{ beginAtZero:true, position:"left", ticks:{ callback:v=>"$"+Number(v).toLocaleString("en-US") }, title:{ display:true, text:"Fee cobrado (US$)" } },
        y2:{ beginAtZero:true, position:"right", grid:{ drawOnChartArea:false }, ticks:{ callback:v=>"$"+(Number(v)/1000).toLocaleString("en-US",{maximumFractionDigits:0})+"k" }, title:{ display:true, text:"Premium (US$, miles)" } },
        x:{ grid:{ display:false } }
      }
    }
  });
}

/* ---- Sección: leaderboard del equipo (último mes cerrado) ------------ */
const MESES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MESES_ES_ABR = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
// `mes` en v_candidatos_bonos es tipo DATE, siempre día 1 (ej. "2026-08-01"). Se parsea a mano
// (split, no `new Date(str)`) para no correr riesgo de que el timezone del navegador la recorra
// un día y cambie el mes mostrado.
function partesMes(mesStr) {
  const [y, m] = String(mesStr).split("-").map(Number);
  return { y, m }; // m es 1..12
}
function fmtMesLargo(mesStr) { const { y, m } = partesMes(mesStr); return `${MESES_ES[m-1]} de ${y}`; }
function fmtMesCorto(mesStr) { const { y, m } = partesMes(mesStr); return `${MESES_ES_ABR[m-1]}-${y}`; }

async function cargarLeaderboard(el) {
  el.innerHTML = skeletonBlock(4);

  // FIX (Fase 2): el top del equipo se calcula SERVER-SIDE con la RPC
  // reconocimientos_del_mes(year, month) — SECURITY DEFINER, ve a TODOS los
  // vendedores. Antes se calculaba en el navegador sobre v_candidatos_bonos /
  // v_ventas_por_cliente, que son security_invoker (RLS al propio usuario): cada
  // asesor terminaba viéndose a sí mismo como el top. Esa RPC cierra ese bug.
  // La RPC devuelve hasta 3 filas: categoria in ('fee','premium','clientes'),
  // con nombre (agente/seller), cifra (fee cobrado / premium neto / nº clientes)
  // y detalle. Fee y premium son COBRADO y NETO — misma regla de toda la página.
  const hoy = new Date();

  // Mes de reconocimientos = ÚLTIMO MES CERRADO con datos. Se busca hacia atrás
  // desde el mes calendario anterior (nunca el mes en curso) y se toma el primero
  // que la RPC devuelva con datos. Hasta 6 meses atrás por si el arranque es nuevo.
  let reconRows = null, usY = null, usM = null;
  for (let back = 1; back <= 6; back++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - back, 1);
    const py = d.getFullYear(), pm = d.getMonth() + 1;
    const { data, error } = await SB.rpc('reconocimientos_del_mes', { p_year: py, p_month: pm });
    if (error) throw error;
    if (data && data.length) { reconRows = data; usY = py; usM = pm; break; }
  }

  if (!reconRows) {
    el.innerHTML = `<div class="pg-warn-box">Todavía no hay un mes cerrado con datos para reconocimientos. El mes en curso (${MESES_ES[hoy.getMonth()]}) entra cuando cierre.</div>`;
    return;
  }

  const mesReciente = `${usY}-${String(usM).padStart(2,"0")}-01`;
  const rowByCat = (c) => reconRows.find(r => r.categoria === c) || null;
  const rFee = rowByCat('fee'), rPrem = rowByCat('premium'), rCli = rowByCat('clientes');

  const esMesInmediatoAnterior = (() => {
    const antD = new Date(hoy.getFullYear(), hoy.getMonth()-1, 1);
    return usY === antD.getFullYear() && usM === (antD.getMonth()+1);
  })();

  // "Candidato a superación" SÍ es dato propio (es sobre TI, RLS-apropiado): se
  // sigue leyendo de v_candidatos_bonos filtrado a tu nombre y al mes mostrado.
  // Ningún nombre ajeno se publica en esta pantalla personal.
  let soyCandidatoSuperacion = false;
  try {
    const { data: cand } = await SB.from('v_candidatos_bonos')
      .select('cumple_superacion,agente,mes').eq('agente', MI_NOMBRE).eq('mes', mesReciente).limit(1);
    soyCandidatoSuperacion = !!(cand && cand[0] && cand[0].cumple_superacion);
  } catch (e) { console.error("[GABI asesor] candidato superación", e); }

  el.innerHTML = `
    <h2>Reconocimientos del mes — ${fmtMesLargo(mesReciente)}</h2>
    <p class="pg-purpose">Aquí se celebra a quien la rompió el mes pasado. No es un ranking ni una lista de quién va bien y quién va mal: son tres reconocimientos, por fee de agencia cobrado, por premium neto y por clientes cerrados. Tu propio mes está más arriba en esta pantalla, y no se compara con el de nadie.
      ${!esMesInmediatoAnterior ? ` Último mes calculado: ${fmtMesCorto(mesReciente)} — ${MESES_ES[hoy.getMonth()]} entra cuando cierre.` : ` Este es el último mes cerrado — ${MESES_ES[hoy.getMonth()]} entra cuando cierre.`}
    </p>
    ${rFee ? `<div class="pg-rank"><span class="rk-name">🏆 Top fee — ${vpcEsc(rFee.nombre)}</span><span class="rk-badge">${fmtUSD0(rFee.cifra)} cobrado</span></div>` : ""}
    ${rPrem ? `<div class="pg-rank"><span class="rk-name">🏆 Top premium — ${vpcEsc(rPrem.nombre)}</span><span class="rk-badge">${fmtUSD0(rPrem.cifra)} premium neto</span></div>` : ""}
    ${rCli ? `<div class="pg-rank"><span class="rk-name">🏆 Top ventas (clientes cerrados) — ${vpcEsc(rCli.nombre)}</span><span class="rk-badge">${Number(rCli.cifra)} cliente(s)${rCli.detalle ? ` · ${vpcEsc(rCli.detalle)} póliza(s)` : ""}</span></div>` : ""}
    ${scope("fee de agencia cobrado, premium neto y clientes cerrados · el mejor de cada uno · " + fmtMesCorto(mesReciente) + " (último mes cerrado) · fuente reconocimientos_del_mes (server-side, todos los vendedores)")}
    ${soyCandidatoSuperacion ? `<div class="pg-rank" style="margin-top:14px;"><span class="rk-name"><b>Tú eres candidato a superación</b> — superaste tu propio trimestre anterior</span><span class="rk-badge">✓ candidato</span></div>` : ""}`;
}

/* ---- Seccion: Tu cola de retencion (Ronda E) — tono proceso propio, sin comparaciones ---- */
function retEsc(x){ return (x==null?'':String(x)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const RET_SEM = { verde:'green', ambar:'amber', rojo:'red', vencida:'red', lejano:'', 'sin_fecha':'' };
const RET_ESTADOS = ['contactado','cotizando','renovado','perdido'];
function retChipEstado(e){ const m={pendiente:'Pendiente',contactado:'Contactado',cotizando:'Cotizando',renovado:'Renovado',perdido:'Perdido'}; return '<span class="pg-badge">'+(m[e]||e)+'</span>'; }
async function cargarMiRetencion(el){
  const wrap = document.getElementById('wrap-retencion');
  el.innerHTML = skeletonBlock(3);
  const { data, error } = await SB.rpc('mi_cola_retencion');
  if (error || !data || !data.length){ if(wrap) wrap.style.display='none'; return; }
  if (wrap) wrap.style.display='';
  const activas  = data.filter(r => r.estado!=='renovado' && r.estado!=='perdido');
  const cerradas = data.filter(r => r.estado==='renovado' || r.estado==='perdido');
  const fila = (r) => {
    const dot = semaforoDot(RET_SEM[r.semaforo]||'');
    const dias = (r.dias_para_vencer==null) ? 'sin fecha de vencimiento'
      : (r.dias_para_vencer < 0 ? ('vencio hace '+Math.abs(r.dias_para_vencer)+' d')
      : (r.dias_para_vencer+' d para renovar'));
    const cli = retEsc(r.dba || r.insured || r.policy_num || 'Cuenta');
    const botones = RET_ESTADOS.map(e => '<button class="pg-btn '+(r.estado===e?'primary':'')+'" onclick="marcarRetencion(\''+r.id+'\',\''+e+'\')">'+e+'</button>').join(' ');
    return '<div style="padding:12px 0;border-top:1px solid rgba(0,0,0,.06);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;">'+dot+
      '<div style="flex:1;min-width:180px;"><div style="font-weight:800;">'+cli+'</div>'+
      '<div class="pg-sub" style="font-size:12px;">'+dias+(r.mga?(' · '+retEsc(r.mga)):'')+' '+retChipEstado(r.estado)+
      ((r.estado==='perdido'&&r.motivo_perdido)?(' · '+retEsc(r.motivo_perdido)):'')+'</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+botones+'</div></div>';
  };
  el.innerHTML =
    '<h2>Tu cola de retencion</h2>'+
    '<p class="pg-purpose">Estas cuentas estan a tu cargo para renovar. El color te dice cuanto tiempo queda: verde tienes margen, ambar acercate, rojo urge. Marcalas a medida que avanzas — es tu propio tablero, no se compara con nadie.</p>'+
    (activas.length ? activas.map(fila).join('') : '<div class="pg-ok-box">No tienes cuentas activas en cola ahora mismo.</div>')+
    (cerradas.length ? (sectionDivider('Ya cerradas')+cerradas.map(fila).join('')) : '')+
    scope('cuentas asignadas a ti · semaforo 60/30/15 dias al vencimiento · fuente mi_cola_retencion (solo lo tuyo)');
}
window.marcarRetencion = async function(id, estado){
  let motivo = null;
  if (estado==='perdido'){
    motivo = window.prompt('Motivo de la perdida (obligatorio):');
    if (motivo===null) return;
    if (!motivo.trim()){ alert('El motivo es obligatorio para marcar perdido.'); return; }
  }
  const { data, error } = await SB.rpc('retencion_marcar_estado', { p_id:id, p_estado:estado, p_motivo:motivo });
  if (error || (data && data.ok===false)){ alert('No se pudo actualizar: '+(error?error.message:(data&&data.error))); return; }
  const el = document.getElementById('s-retencion'); if (el) cargarMiRetencion(el);
};

      <div class="pg-eyebrow">${MI_NOMBRE} · asesor</div>
      <h1>Mi mes</h1>
      <div class="pg-sub">Tu estándar, tu ficha y tu tasa de cobro — se actualiza con cada venta.</div>
    </div>
    <div class="pg-card" id="s-mimes"></div>
    <div id="wrap-retencion" style="display:none">${sectionDivider("Tu cola de retención")}<div class="pg-card" id="s-retencion"></div></div>
    ${sectionDivider("Tu ficha")}
    <div class="pg-card" id="s-ficha"></div>
    <div class="pg-card" id="s-tasacobro"></div>
    ${sectionDivider("Tu proceso")}
    <div class="pg-card" id="s-proceso"></div>
    ${sectionDivider("Fees pendientes de cobro")}
    <div class="pg-card" id="s-riesgo"></div>
    ${sectionDivider("Reconocimientos del mes")}
    <div class="pg-card" id="s-leaderboard"></div>
    ${footnote()}
  `;
}

async function cargarTodo() {
  document.getElementById("pg-stamp").textContent = "cargando…";
  await Promise.all([
    seccion("Mi mes", "s-mimes", cargarMiMes),
    seccion("Retención", "s-retencion", cargarMiRetencion),
    seccion("Mi ficha", "s-ficha", cargarMiFicha),
    seccion("Mi tasa de cobro", "s-tasacobro", cargarMiTasaCobro),
    seccion("Tu proceso", "s-proceso", cargarMiProceso),
    seccion("Fees en riesgo", "s-riesgo", cargarFeesEnRiesgo),
    seccion("Leaderboard", "s-leaderboard", cargarLeaderboard),
  ]);
  document.getElementById("pg-stamp").textContent = "datos al " + new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
}

async function mostrarApp() {
  document.getElementById("pg-login-screen").style.display = "none";
  document.getElementById("pg-app").style.display = "block";

  let agRow;
  try {
    agRow = await resolverMiAgente();
  } catch (e) {
    document.getElementById("pg-root").innerHTML = `<div class="pg-error-box">No pudimos identificar tu usuario: ${e.message}</div>`;
    return;
  }
  if (!agRow) {
    document.getElementById("pg-root").innerHTML = `
      <div class="pg-warn-box">
        No encontramos tu ficha de agente todavía. Tu login existe, pero tu usuario no está ligado
        a un registro en la tabla <code>agentes</code> (columna <code>auth_user_id</code>).
        Pídele a Andrés que te vincule para ver tu mes aquí.
      </div>`;
    return;
  }
  MI_AGENTE_ID = agRow.id;
  MI_NOMBRE = agRow.nombre;
  document.getElementById("pg-badge-nombre").textContent = `Vista de: ${MI_NOMBRE} · Asesor`;
  pintarEsqueleto();
  await cargarTodo();
}

document.getElementById("pg-login-btn").addEventListener("click", async () => {
  const email = document.getElementById("pg-login-email").value.trim();
  const pass = document.getElementById("pg-login-pass").value;
  const msgEl = document.getElementById("pg-login-msg");
  msgEl.textContent = "";
  const { error } = await SB.auth.signInWithPassword({ email, password: pass });
  if (error) { msgEl.textContent = "No pudimos iniciar sesión: " + error.message; return; }
  await mostrarApp();
});

document.getElementById("pg-btn-refresh").addEventListener("click", cargarTodo);
document.getElementById("pg-btn-logout").addEventListener("click", async () => {
  await SB.auth.signOut();
  location.reload();
});

(async function init() {
  const { data: { session } } = await SB.auth.getSession();
  if (session) { await mostrarApp(); }
})();
</script>
</body>
