  return lista.map(function (c) { return cobCard(c) + (COB_ABIERTO === c.id ? cobFichaHTML(c) : ''); }).join('');

function cobPostRender() {
  var v = $('vista'); if (!v) return;
  if (!v.dataset.cobBound) {
    v.dataset.cobBound = '1';
    ui.on(v, '#cobChips .chip[data-chip]', function (el) { COB_F = el.dataset.chip; render(); });
    ui.on(v, '#cobLista [data-act]', function (el, ev) {
      ev.stopImmediatePropagation();
      if (el.disabled) return;
      var id = el.dataset.id, act = el.dataset.act;
      var c = COBROS.find(function (x) { return x.id === id; });
      if (!c) return;
      if (act === 'avanzar') {
        var i = ESTADOS_COBRO.indexOf(c.estado);
        var n = (i >= 0 && i < ESTADOS_COBRO.length - 1) ? ESTADOS_COBRO[i + 1] : null;
        if (n) avanzarCobro(id, n);
      } else if (act === 'pagar') {
        avanzarCobro(id, 'pagado');
      } else if (act === 'invoice') invoiceDesdeCobro(id);
      else if (act === 'correo') correoCobro(id);
      else if (act === 'editar') editarCobro(id);
      else if (act === 'eliminar') eliminarCobro(id);
    });
    ui.on(v, '#cobLista .card[data-card]', function (el) { cobToggleFicha(el.dataset.card); });
    ui.on(v, '#cobLista [data-copy]', function (el, ev) {
      ev.stopImmediatePropagation();
      var txt = el.dataset.copy;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { toast('Memo copiado'); });
      }
    });
    ui.on(v, '#cobLista [data-guardartrans]', function (el, ev) {
      ev.stopImmediatePropagation();
      cobGuardarTransaccion(el.dataset.guardartrans);
    });
    v.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'cobQ') { COB_Q = e.target.value; cobRepintarLista(); }
    });
  }
}

/* ---------- filtros ---------- */
function invPasaChip(i, f) {
  if (f === 'todos') return true;
  return i.estado === f;
}
function invNorm(s) {
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
function invPasaBusqueda(i, q) {
  if (!q) return true;
  var nq = invNorm(q);
  var cob = COBROS.find(function (x) { return x.id === i.cobro_id; });
  return [i.numero, cliName(i.cliente_id), cob && cob.concepto].some(function (v) {
    return invNorm(v).indexOf(nq) >= 0;
  });
}

/* ---------- pill por estado ---------- */
function invPillDe(estado) {
  var MAP = {
    por_cobrar: { cls: 'p-cot', txt: 'Por cobrar' },
    pagado: { cls: 'p-ren', txt: 'Pagado' },
    anulado: { cls: 'p-per', txt: 'Anulado' }
  };

}

/* ---------- tarjeta de invoice ---------- */
function invCard(i) {
  var cob = COBROS.find(function (x) { return x.id === i.cobro_id; });
  var meta = [
    i.fecha ? ui.fecha(i.fecha) : null,

    cob ? 'cobro de ' + ui.esc(cliName(cob.cliente_id)) : 'invoice suelto'
  ];
  return ui.card({
    id: i.id,

    meta: meta,
    prem: ui.money2(i.total),

    u: i.estado === 'pagado' ? 'mint' : (i.estado === 'anulado' ? 'gris' : 'ambar'),

/* =====================================================================

/* Etiquetas de los chips de periodo. 'anio' es nuevo en v6. */
var RENT_PERIODOS = [
  { id: 'semana', lbl: 'Últimos 7 días' },
  { id: 'mes', lbl: 'Mes actual' },
  { id: 'anterior', lbl: 'Mes anterior' },
  { id: 'anio', lbl: 'Año' },
  { id: 'todo', lbl: 'Todo' }
];

function rentPeriodoLbl(p) {
  var x = RENT_PERIODOS.find(function (r) { return r.id === p; });
  return x ? x.lbl : 'Mes actual';
}

/* Cambia el periodo y repinta. Sustituye a repPeriodo() para la vista v6. */
function rentPeriodo(p) { REP_PERIODO = p; render(); }

/* Clave 'YYYY-MM' de una fila de RENT (usa `mes`, no created_at). */
function rentMesKey(r) {
  if (!r) return '';
  if (r.mes) return String(r.mes).slice(0, 7);
  if (r.created_at) return String(r.created_at).slice(0, 7);
  return '';
}
function rentKey(y, m) { return y + '-' + String(m + 1).padStart(2, '0'); }

/* Filtro de periodo sobre RENT. Mensual por `mes`; los 7 días por created_at. */
function rentEnPeriodo(r) {
  var p = REP_PERIODO || 'mes';
  var hoy = new Date(), yr = hoy.getFullYear(), mo = hoy.getMonth();
  var mk = rentMesKey(r);
  if (p === 'mes') return mk === rentKey(yr, mo);
  if (p === 'anterior') { var a = new Date(yr, mo - 1, 1); return mk === rentKey(a.getFullYear(), a.getMonth()); }
  if (p === 'anio') return mk.slice(0, 4) === String(yr);
  if (p === 'semana') { var t = new Date(); t.setDate(t.getDate() - 7); return r.created_at ? new Date(r.created_at) >= t : false; }
  return true; /* todo */
}

/* Suma segura de una columna. */
function rentSum(list, k) { return (list || []).reduce(function (a, r) { return a + Number(r[k] || 0); }, 0); }

/* Costo de servicio del operario (operario + opex van juntos: es lo que cuesta servir). */
function rentOper(list) { return rentSum(list, 'operario') + rentSum(list, 'opex'); }

/* ¿La comisión de Juan Pablo está sin esquema definido? */
function rentComercialPendiente() {
  var c = CONFIG && CONFIG.comercial_pct_piloto;
  if (c && c.valor != null) return false;
  /* si la vista trae la bandera, manda la vista */
  var f = (RENT || []).find(function (r) { return r.comercial_pendiente != null; });
  if (f) return !!f.comercial_pendiente;
  return true;
}

/* Clase del % de margen para ui.vr */
function rentPctCls(p) { if (p == null || isNaN(p)) return ''; if (p < 0) return 'neg'; return p >= cfgNum('margen_objetivo_pct', 25) ? 'bien' : 'bajo'; }

/* ---------- 12 meses del año para el combo ---------- */
function rentMeses(yr) {
  var acc = [];
  for (var i = 0; i < 12; i++) acc.push({ cobrado: 0, costo: 0, util: 0, n: 0 });
  (RENT || []).forEach(function (r) {
    if (!r.validado) return;
    var mk = rentMesKey(r);
    if (mk.slice(0, 4) !== String(yr)) return;
    var i = Number(mk.slice(5, 7)) - 1;
    if (i < 0 || i > 11) return;
    acc[i].cobrado += Number(r.monto || 0);
    acc[i].costo += Number(r.operario || 0) + Number(r.opex || 0) + Number(r.comercial || 0);
    acc[i].util += Number(r.utilidad_neta || 0);
    acc[i].n++;
  });
  var hayDatos = acc.some(function (m) { return m.n > 0; });
  var filas = acc.map(function (m, i) {
    var mg = m.cobrado ? Math.round(100 * m.util / m.cobrado) : null;
    return {
      lbl: ui.mesCorto(i),
      bar: m.util,
      line: m.cobrado ? mg : null,
      tip: '<span class="tt">' + ui.mesCorto(i) + ' ' + yr + '</span>' +
        'Cobrado <b>' + ui.money(m.cobrado) + '</b><br>' +
        'Costo de servicio <b>' + ui.money(m.costo) + '</b><br>' +
        'Utilidad <b>' + ui.money(m.util) + '</b> · margen <b>' + (m.cobrado ? ui.pct(mg) : '—') + '</b><br>' +
        m.n + ' cobro(s)'
    };
  });
  return { filas: filas, acc: acc, hayDatos: hayDatos };
}

/* ---------- filas por cliente (ui.vr) ---------- */
function rentPorCliente(VAL) {
  var por = {};
  (VAL || []).forEach(function (r) {
    var k = r.cliente_id || '—';
    if (!por[k]) por[k] = { n: 0, cobrado: 0, costo: 0, util: 0, empresa: r.empresa || cliName(k), dot: r.dot, tipo: r.tipo };
    var p = por[k];
    p.n++; p.cobrado += Number(r.monto || 0);
    p.costo += Number(r.operario || 0) + Number(r.opex || 0) + Number(r.comercial || 0);
    p.util += Number(r.utilidad_neta || 0);
  });
  var filas = Object.keys(por).map(function (k) { return [k, por[k]]; })
    .sort(function (a, b) { return b[1].util - a[1].util; });
  if (!filas.length) return ui.vacio('Sin cobros validados en este periodo. El desglose aparece cuando un cobro pasa a <b>Fondos validados</b>.');
  var max = Math.max.apply(null, filas.map(function (f) { return Math.abs(f[1].cobrado); }).concat([1]));
  return filas.map(function (f) {
    var cid = f[0], p = f[1];
    var mg = p.cobrado ? (100 * p.util / p.cobrado) : null;
    return ui.vr({
      nom: p.empresa,
      sub: (p.dot ? 'DOT ' + ui.esc(p.dot) : '') + (p.dot ? ' · ' : '') + p.n + ' cobro(s)',
      a: p.cobrado, b: p.util, max: max,
      num: ui.money(p.cobrado),
      pct: mg, pctCls: rentPctCls(mg),
      tip: '<span class="tt">' + ui.esc(p.empresa) + '</span>' +
        'Cobrado <b>' + ui.money(p.cobrado) + '</b><br>' +
        'Costo de servicio <b>' + ui.money(p.costo) + '</b><br>' +
        'Utilidad neta <b>' + ui.money(p.util) + '</b>'
    });
  }).join('');
}

/* Cinta anual estática (sin animación) para la impresión. */
function rentSvgPrint(yr) {
  var m = rentMeses(yr);
  if (!m.hayDatos) return '<div style="font-size:10.5px;color:#555;margin-bottom:16px">Sin cobros registrados en ' + yr + ': no hay cinta anual que imprimir.</div>';
  var W = 760, H = 130, L = 4, T = 12, B = 22, iw = W - L * 2, ih = H - T - B;
  var vals = m.acc.map(function (x) { return x.util; });
  var maxV = Math.max.apply(null, vals.map(Math.abs).concat([1]));
  var minV = Math.min.apply(null, vals.concat([0]));
  var rango = maxV - minV || 1;
  var y = function (v) { return T + ih * (1 - (v - minV) / rango); };
  var y0 = y(0), step = iw / 12, bw = step * 0.52;
  var barras = vals.map(function (v, i) {
    var x = L + i * step + (step - bw) / 2, yy = Math.min(y0, y(v)), h = Math.max(1, Math.abs(y0 - y(v)));
    return '<rect x="' + x + '" y="' + yy + '" width="' + bw + '" height="' + h + '" fill="' + (v < 0 ? '#D5594F' : '#229A82') + '"/>';
  }).join('');
  var etiq = vals.map(function (v, i) {
    return '<text x="' + (L + i * step + step / 2) + '" y="' + (H - 8) + '" text-anchor="middle" style="font-size:8px;fill:#555">' + ui.mesCorto(i) + '</text>';
  }).join('');
  return '<div style="margin-bottom:18px"><div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#555;margin-bottom:4px">Utilidad neta por mes · ' + yr + ' (verde = gana, rojo = pierde)</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' +
    '<line x1="' + L + '" x2="' + (W - L) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="#999" stroke-width="1"/>' +
    barras + etiq + '</svg></div>';
}

function pilBase() {
  var inicio = cfgTxt('inicio_piloto', '2026-07-30');
  var fin = cfgTxt('fin_piloto', null);
  var VAL = (RENT || []).filter(function (r) {
    if (!r.validado) return false;
    var f = r.periodo_hasta || r.periodo_desde || r.mes || (r.created_at ? String(r.created_at).slice(0, 10) : '');
    f = String(f).slice(0, 10);
    if (!f) return false;
    if (inicio && f < String(inicio).slice(0, 10)) return false;
    if (fin && f > String(fin).slice(0, 10)) return false;
    return true;
  });
  var meses = {};
  VAL.forEach(function (r) { var k = rentMesKey(r); if (k) meses[k] = 1; });
  var n = Object.keys(meses).length;
  var aY = rentSum(VAL, 'monto'), oY = rentOper(VAL), cY = rentSum(VAL, 'comercial'), uY = rentSum(VAL, 'utilidad_neta');
  var mkHoy = rentKey(new Date().getFullYear(), new Date().getMonth());
  var cobradoMesActual = rentSum(VAL.filter(function (r) { return rentMesKey(r) === mkHoy; }), 'monto');
  return {
    inicio: inicio, VAL: VAL, meses: n,
    aY: aY, oY: oY, cY: cY, uY: uY,
    margen: aY ? (100 * uY / aY) : null,
    cobradoM: n ? aY / n : 0,
    operarioM: n ? oY / n : 0,
    comercialM: n ? cY / n : 0,
    utilidadM: n ? uY / n : 0,
    cobradoMesActual: cobradoMesActual,
    sinDatos: VAL.length === 0
  };
}

/* Aritmética del simulador. Nada de opinión: solo cuentas. */
function pilCalc(basicoCop, pct, obj) {
  var B = pilBase();
  var trm = Number(TRM) || 4000;
  var opEsCom = cfgNum('operario_es_comercial', 0) === 1;
  var basicoUSD = basicoCop / trm;

  var jpComision = B.cobradoM * pct / 100;
  var jpSim = basicoUSD + jpComision + (opEsCom ? B.operarioM : 0);
  var agSim = B.cobradoM - B.operarioM - basicoUSD - jpComision;
  var jpHoy = B.comercialM + (opEsCom ? B.operarioM : 0);
  var agHoy = B.utilidadM;

  /* punto de equilibrio y objetivo — sin dividir por cero */
  var d1 = 0.4 - pct / 100;                 /* queda tras operario 60 % y comisión */
  var d2 = 0.4 - pct / 100 - obj / 100;     /* además del margen objetivo */
  var equilibrio = d1 > 0 ? basicoUSD / d1 : null;
  var objetivo = d2 > 0 ? basicoUSD / d2 : null;
  var faltaObj = objetivo != null ? Math.max(0, objetivo - B.cobradoMesActual) : null;

  return {
    B: B, trm: trm, opEsCom: opEsCom, pendEsq: rentComercialPendiente(),
    basicoCop: basicoCop, basicoUSD: basicoUSD, pct: pct, obj: obj,
    jpComision: jpComision, jpSim: jpSim, agSim: agSim, jpHoy: jpHoy, agHoy: agHoy,
    d1: d1, d2: d2, equilibrio: equilibrio, objetivo: objetivo, faltaObj: faltaObj
  };
}

/* número con signo y rojo si es negativo */
function pilNum(v) { return '<b class="' + (Number(v) < 0 ? 'neg' : '') + '">' + ui.money(v) + '</b>'; }

/* ---------- columnas duales ---------- */
function pilDual(c) {
  var B = c.B;
  var whoJP = 'Juan Pablo · al mes' + (c.opEsCom ? ' (incluye el 60 % de operario)' : '');
  return '' +
    '<div class="col jp"><div class="who">' + ui.esc(whoJP) + '</div>' +
    '<div class="row"><span>Hoy (piloto)' + (c.pendEsq ? ui.pend('esquema pendiente') : '') + '</span>' + pilNum(c.jpHoy) + '</div>' +
    '<div class="row"><span>Básico simulado</span>' + pilNum(c.basicoUSD) + '</div>' +
    '<div class="row"><span>Comisión ' + ui.pct(c.pct, 0) + ' simulada</span>' + pilNum(c.jpComision) + '</div>' +
    (c.opEsCom ? '<div class="row"><span>Operario 60 %</span>' + pilNum(B.operarioM) + '</div>' : '') +
    '<div class="row tot"><span>Simulado</span>' + pilNum(c.jpSim) + '</div></div>' +
    '<div class="col ag"><div class="who">Agencia · al mes</div>' +
    '<div class="row"><span>Hoy (piloto)</span>' + pilNum(c.agHoy) + '</div>' +
    '<div class="row"><span>Cobrado − operario</span>' + pilNum(B.cobradoM - B.operarioM) + '</div>' +
    '<div class="row"><span>− básico − comisión</span>' + pilNum(-(c.basicoUSD + c.jpComision)) + '</div>' +
    '<div class="row tot"><span>Simulado</span>' + pilNum(c.agSim) + '</div></div>';
}

/* ---------- gráfica de líneas ---------- */
function pilSvg(c) {
  var top = Math.max(12000, 3 * c.B.cobradoM);
  var xs = [], n = 16;
  for (var i = 0; i < n; i++) xs.push(Math.round(500 + (top - 500) * i / (n - 1)));
  var jp = xs.map(function (x) { return c.basicoUSD + x * c.pct / 100 + (c.opEsCom ? x * 0.6 : 0); });
  var ag = xs.map(function (x) { return x * 0.4 - c.basicoUSD - x * c.pct / 100; });
  var ob = xs.map(function (x) { return x * c.obj / 100; });
  var ci = -1;
  for (var j = 0; j < xs.length; j++) { if (ag[j] >= jp[j]) { ci = j; break; } }
  return ui.svgLineas(xs, [
    { nombre: 'Juan Pablo' + (c.opEsCom ? ' (con operario)' : ''), color: '#5B6BD6', ys: jp },
    { nombre: 'Agencia', color: '#229A82', ys: ag },
    { nombre: 'Margen objetivo', color: '#D9A520', ys: ob, dash: true }
  ], {
    cruce: ci > 0 ? { x: xs[ci], y: jp[ci], lbl: 'a la par' } : null,
    xLbl: 'ingreso mensual bruto de Amazon Relay',
    aria: 'Reparto simulado entre Juan Pablo y la agencia según el ingreso mensual'
  });
}

/* ---------- barra de punto de equilibrio ---------- */
function pilBar(c) {
  var marcas = [];
  var aviso = '';
  if (c.equilibrio != null) marcas.push({ pos: c.equilibrio, cls: 'prom', lab: 'equilibrio ' + ui.moneyC(c.equilibrio) });
  else aviso += '<div class="fi-aviso">Punto de equilibrio <b>inalcanzable con estos porcentajes</b>: con 60 % de operario y ' + ui.pct(c.pct, 0) + ' de comisión no queda nada para pagar el básico.</div>';

  var escalaOk = c.objetivo != null && (c.equilibrio == null || c.objetivo <= 6 * c.equilibrio);
  if (c.objetivo != null && escalaOk) marcas.push({ pos: c.objetivo, cls: 'est', lab: 'objetivo ' + ui.moneyC(c.objetivo) });
  else if (c.objetivo == null) aviso += '<div class="fi-aviso">Margen objetivo <b>inalcanzable con estos porcentajes</b>: 60 % operario + ' + ui.pct(c.pct, 0) + ' comisión + ' + ui.pct(c.obj, 0) + ' de margen suman más de lo que entra.</div>';
  else aviso += '<div class="fi-aviso">El objetivo queda fuera de escala (' + ui.money(c.objetivo) + ' al mes): no se dibuja la marca para no aplastar la barra.</div>';

  var mesLbl = ui.mesLargo(new Date().getMonth());
  return aviso + ui.barrow({
    l: 'Ingreso real del mes', sub: mesLbl,
    val: c.B.cobradoMesActual,
    marcas: marcas,
    n: ui.money(c.B.cobradoMesActual),
    nsub: 'cobrado'
  });
}

/* ---------- las tres frases (pura aritmética) ---------- */
function pilFrases(c) {
  var B = c.B, f = [];
  if (B.sinDatos) {
    f.push({ col: 'var(--ambar)', txt: 'Todavía <b>no hay cobros registrados</b> en el piloto: el promedio mensual real es ' + ui.money(0) + '. El simulador de abajo corre con ingreso 0 — mueve los controles para ver la forma de la curva, pero los números reales llegan cuando se registren los cobros.' });
  } else {
    f.push({
      col: B.utilidadM < 0 ? 'var(--rojo)' : 'var(--renov)',
      txt: 'Con el esquema piloto la agencia ' + (B.utilidadM < 0 ? '<b>pierde</b>' : 'gana') + ' ' + ui.money(B.utilidadM) + ' al mes en promedio (margen ' + ui.pct(B.margen) + ') sobre ' + B.meses + ' mes(es) con cobros.'
    });
  }
  f.push({
    col: 'var(--falta)',
    txt: 'Con básico de <b>' + ui.cop(c.basicoCop) + '</b> (≈ ' + ui.money(c.basicoUSD) + ' a TRM ' + ui.int(c.trm) + ') y <b>' + ui.pct(c.pct, 0) + '</b> de comisión, Juan Pablo recibiría <b>' + ui.money(c.jpSim) + '</b> y la agencia <b>' + ui.money(c.agSim) + '</b> al mes' + (c.agSim < 0 ? ' — <b>la agencia pierde</b> con este ingreso.' : '.')
  });
  if (c.objetivo == null) {
    f.push({ col: 'var(--ambar)', txt: 'Margen objetivo de <b>' + ui.pct(c.obj, 0) + '</b>: <b>inalcanzable con estos porcentajes</b> (60 % operario + ' + ui.pct(c.pct, 0) + ' comisión + ' + ui.pct(c.obj, 0) + ' margen pasan del 100 % del cobrado).' });
  } else if (c.faltaObj > 0) {
    f.push({ col: 'var(--ambar)', txt: 'Para el margen objetivo de <b>' + ui.pct(c.obj, 0) + '</b> hacen falta <b>' + ui.money(c.faltaObj) + '</b> más de ingreso mensual (objetivo ' + ui.money(c.objetivo) + ', hoy ' + ui.money(B.cobradoMesActual) + ').' });
  } else {
    f.push({ col: 'var(--renov)', txt: 'El ingreso del mes (' + ui.money(B.cobradoMesActual) + ') ya <b>supera</b> el objetivo de ' + ui.money(c.objetivo) + ' para un margen de ' + ui.pct(c.obj, 0) + '.' });
  }
  return f.map(function (x) { return '<div class="frase"><i style="background:' + x.col + '"></i><span>' + x.txt + '</span></div>'; }).join('');
}

/* ---------- recálculo sin re-render: solo #simOut, #simSvg, #simFrases, #simBar ---------- */
function pilRecalc() {
  var eb = $('pilBasico'), ep = $('pilPct'), eo = $('pilObj');
  if (!eb || !ep || !eo) return;
  var b = Number(eb.value) || 0, p = Number(ep.value) || 0, o = Number(eo.value) || 0;
  PIL_S = { basico: b, pct: p, obj: o };
  var c = pilCalc(b, p, o);
  var put = function (id, html) { var el = $(id); if (el) el.innerHTML = html; };
  put('pilBasicoVal', ui.cop(b));
  put('pilBasicoUsd', '≈ ' + ui.money(c.basicoUSD) + ' a TRM ' + ui.int(c.trm));
  put('pilPctVal', ui.pct(p, 0));
  put('pilObjVal', ui.pct(o, 0));
  put('simOut', pilDual(c));
  put('simSvg', pilSvg(c));
  put('simBar', pilBar(c));
  put('simFrases', pilFrases(c));
  try { if ($('simBar')) ui.mount($('simBar')); } catch (e) { /* nada */ }
}

/* ---------- guardar parámetros (solo sales@) ---------- */
async function pilGuardar() {
  var email = (ME && ME.email) ? String(ME.email).toLowerCase() : '';
  if (email !== 'sales@protectgoservices.com') { toast('Solo sales@ puede guardar los parámetros del piloto'); return; }
  var s = pilEstado();
  var now = new Date().toISOString();
  var rows = [
    { clave: 'basico_cop_post', valor: s.basico, updated_at: now, updated_by: ME.email },
    { clave: 'comercial_pct_post', valor: s.pct, updated_at: now, updated_by: ME.email },
    { clave: 'margen_objetivo_pct', valor: s.obj, updated_at: now, updated_by: ME.email }
  ];
  var res = await sb.from('amazon_config').upsert(rows, { onConflict: 'clave' });
  if (res && res.error) { toast('No se pudo guardar: ' + res.error.message); return; }
  toast('Parámetros guardados — quedan para todos');
  PIL_S = null;
  await loadAll();
  render();
}

/* ---------- la vista ---------- */

    return '<div class="pg-eyebrow">Solo dirección</div><h1>Resultados del piloto</h1>' +
      ui.err('rentabilidad', 'loadAll().then(render)');
  }

  var s = pilEstado();
  var c = pilCalc(s.basico, s.pct, s.obj);
  var B = c.B;

  /* --- 1. franja real del piloto --- */
  var franja = ui.strip({
    eye: 'Piloto · desde ' + ui.fechaL(B.inicio),
    big: ui.money(B.uY), raw: B.uY, unit: 'utilidad acumulada de la agencia',
    nums: [
      { k: 'Cobrado', v: ui.money(B.aY), cls: 'mint' },
      { k: 'Juan Pablo · 60 %', v: ui.money(B.oY + B.cY) },
      { k: 'Queda en la agencia', v: ui.money(B.uY), cls: 'mint' },
      { k: 'Margen', v: ui.pct(B.margen), cls: 'ambar' }
    ],
    aviso: null,
    ring: { pct: B.margen, cap: 'margen del piloto' }
  });

  var vacio = B.sinDatos
    ? ui.vacio('Todavía no hay cobros validados en el piloto. Los ceros de arriba son <b>reales</b>: registra los cobros que ya ocurrieron (El Potrillo desde el 30 jul, Jean Miro desde el 17 ago). El simulador de abajo sí funciona — corre con ingreso mensual $0 y te muestra la forma de la curva.')
    : '';

  /* --- 2. simulador --- */
  var sim = '' +
    '<div class="sim">' +
    '<div class="sim-c"><label>Básico mensual (COP)</label><div class="val" id="pilBasicoVal">' + ui.cop(s.basico) + '</div>' +
    '<input id="pilBasico" type="range" min="0" max="6000000" step="100000" value="' + s.basico + '" oninput="pilRecalc()" aria-label="Básico mensual en pesos">' +
    '<div id="pilBasicoUsd" style="font-size:11px;color:var(--muted);margin-top:4px">≈ ' + ui.money(c.basicoUSD) + ' a TRM ' + ui.int(c.trm) + '</div></div>' +
    '<div class="sim-c"><label>Comisión comercial %</label><div class="val" id="pilPctVal">' + ui.pct(s.pct, 0) + '</div>' +
    '<input id="pilPct" type="range" min="0" max="40" step="1" value="' + s.pct + '" oninput="pilRecalc()" aria-label="Comisión comercial por ciento"></div>' +
    '<div class="sim-c"><label>Margen objetivo (solvencia)</label><div class="val" id="pilObjVal">' + ui.pct(s.obj, 0) + '</div>' +
    '<input id="pilObj" type="range" min="0" max="60" step="1" value="' + s.obj + '" oninput="pilRecalc()" aria-label="Margen objetivo por ciento"></div>' +
    '</div>' +
    '<div class="dual" id="simOut">' + pilDual(c) + '</div>' +
    '<div class="pb" style="padding-top:0" id="simSvg">' + pilSvg(c) + '</div>';

  var esSales = (ME && String(ME.email).toLowerCase() === 'sales@protectgoservices.com');
  var btnGuardar = esSales
    ? '<button type="button" class="mini" onclick="pilGuardar()">Guardar parámetros</button>'
    : '';

  var panelSim = ui.panel({
    tit: '¿Y si ya estuviéramos en el esquema de después?',
    sub: 'Básico prestacional en COP + comisión. Mueve los controles: recalcula sobre el promedio mensual de los cobros reales del piloto' + (B.meses ? ' (' + B.meses + ' mes(es) con cobros).' : ' — hoy ese promedio es $0.'),
    der: btnGuardar,
    body: sim
  });

  /* --- 3. equilibrio + frases --- */
  var panelEq = ui.panel({
    tit: 'Punto de equilibrio y ajustes',
    sub: 'Con el básico propuesto, cuánto tiene que entrar al mes para que la agencia no pierda, y cuánto para cumplir el margen objetivo.',
    body: '<div id="simBar">' + pilBar(c) + '</div><div class="frases" id="simFrases">' + pilFrases(c) + '</div>'
  });

  return '' +
    '<div class="pg-eyebrow">Solo dirección</div><h1>Resultados del piloto</h1>' +
    '<div class="pg-sub">Lo rentable y los ajustes necesarios. El primer bloque es real; los dos de abajo simulan el esquema de después sobre los cobros reales.</div>' +
    franja + vacio + panelSim + panelEq;
}



/* ================== v6.1 · Casilla 09 reescrita ==================
   Sin simulador de sueldo: solo el piloto real y a qué volumen la
   operación se sostiene sola. Los parámetros viven en amazon_config
   y solo los lee dirección. Redefine vPiloto, pilRecalc y pilGuardar. */

function pil2Pct() {
  var r = (REGLAS || []).find(function (x) { return x.tipo === 'semanal'; }) ||
          (REGLAS || [])[0];
  var p = r && r.operario_pct != null ? Number(r.operario_pct) : 60;
  if (!(p >= 0 && p < 100)) p = 60;
  return p;
}

function pil2Estado() {
  if (!window.PIL2 || PIL2.dirty !== true) {
    window.PIL2 = { objetivo: cfgNum('costo_objetivo_usd', 0), dirty: false };
  }
  return PIL2;
}

/* Aritmética. Sin opinión. */
function pil2Calc(objetivo) {
  var B = pilBase();
  var pctJP = pil2Pct();
  var quedaPct = (100 - pctJP) / 100;              /* lo que le queda a la agencia */
  var jpY = B.oY + B.cY;
  var necesario = quedaPct > 0 ? (objetivo / quedaPct) : null;
  var faltan = necesario == null ? null : Math.max(0, necesario - B.cobradoM);
  return {
    B: B, pctJP: pctJP, quedaPct: quedaPct, jpY: jpY,
    objetivo: objetivo, necesario: necesario, faltan: faltan,
    quedaM: B.utilidadM, cubre: objetivo > 0 && B.utilidadM >= objetivo
  };
}

/* Gráfica: lo que le queda a la agencia según lo que facture al mes. */
function pil2Svg(c) {
  var tope = Math.max(4000, (c.necesario || 0) * 1.6, c.B.cobradoM * 2.5);
  var xs = [], i;
  for (i = 0; i <= 16; i++) xs.push(Math.round(tope * i / 16));
  var agencia = xs.map(function (x) { return x * c.quedaPct; });
  var series = [{ nombre: 'Queda en la agencia', color: '#229A82', ys: agencia }];
  var o = { xLbl: 'lo que Amazon Relay factura al mes', aria: 'Lo que le queda a la agencia según el ingreso mensual' };
  if (c.objetivo > 0) {
    o.marca = { y: c.objetivo, lbl: 'costo objetivo ' + ui.money(c.objetivo) };
    if (c.necesario) o.cruce = { x: c.necesario, y: c.objetivo, lbl: 'se sostiene sola' };
  }
  return ui.svgLineas(xs, series, o);
}

function pil2Bar(c) {
  if (!(c.objetivo > 0)) {
    return ui.vacio('Pon un <b>costo objetivo mensual</b> arriba y aquí sale cuánto tiene que facturar Amazon Relay para sostenerlo.');
  }
  return ui.barrow({
    l: 'Facturación del mes', sub: ui.mesLargo(new Date().getMonth()),
    val: c.B.cobradoMesActual,
    max: Math.max(c.necesario * 1.15, c.B.cobradoMesActual * 1.15, 1),
    marcas: [{ pos: c.necesario, cls: 'est', lab: 'se sostiene en ' + ui.moneyC(c.necesario) }],
    n: ui.money(c.B.cobradoMesActual), nsub: 'cobrado'
  });
}

function pil2Frases(c) {
  var f = [];
  var B = c.B;
  if (B.sinDatos) {
    f.push({ col: 'var(--ambar)', txt: 'Todavía no hay cobros validados en el piloto. Los números de arriba son ceros <b>reales</b>, no un error.' });
  } else {
    f.push({
      col: (B.uY < 0 ? 'var(--rojo)' : 'var(--renov)'),
      txt: 'En el piloto van <b>' + ui.money(B.aY) + '</b> cobrados: <b>' + ui.money(c.jpY) +
           '</b> para Juan Pablo y <b>' + ui.money(B.uY) + '</b> para la agencia (margen <b>' + ui.pct(B.margen) + '</b>).'
    });
    f.push({
      col: 'var(--falta)',
      txt: 'Con el reparto de hoy (' + ui.pct(c.pctJP, 0) + ' / ' + ui.pct(100 - c.pctJP, 0) +
           '), de cada <b>' + ui.money(1000) + '</b> facturados quedan <b>' + ui.money(1000 * c.quedaPct) +
           '</b> en la agencia — y de ahí sale la comisión de quien vende.'
    });
  }
  if (c.objetivo > 0) {
    if (c.necesario == null) {
      f.push({ col: 'var(--ambar)', txt: 'Con este reparto no queda nada para la agencia: no hay volumen que lo sostenga.' });
    } else if (c.cubre) {
      f.push({
        col: 'var(--renov)',
        txt: 'Al ritmo actual (<b>' + ui.money(B.cobradoM) + '</b> al mes) la operación <b>ya se sostiene sola</b>: le quedan <b>' +
             ui.money(c.quedaM) + '</b> contra un objetivo de <b>' + ui.money(c.objetivo) + '</b>.'
      });
    } else {
      f.push({
        col: 'var(--ambar)',
        txt: 'Para sostener <b>' + ui.money(c.objetivo) + '</b> al mes, Amazon Relay tiene que facturar <b>' +
             ui.money(c.necesario) + '</b> al mes. Hoy promedia <b>' + ui.money(B.cobradoM) +
             '</b>: faltan <b>' + ui.money(c.faltan) + '</b>.'
      });
    }
  }
  return '<div class="frases">' + f.map(function (x) {
    return '<div class="frase"><i style="background:' + x.col + '"></i><span>' + x.txt + '</span></div>';
  }).join('') + '</div>';
}

/* Recalcula sin re-render completo */
function pilRecalc() {
  var el = document.getElementById('pilObjetivo');
  if (!el) return;
  var v = Math.max(0, Number(el.value) || 0);
  window.PIL2 = { objetivo: v, dirty: true };
  var c = pil2Calc(v);
  var q = function (id) { return document.getElementById(id); };
  if (q('simSvg')) q('simSvg').innerHTML = pil2Svg(c);
  if (q('simBar')) { q('simBar').innerHTML = pil2Bar(c); ui.mount(q('simBar')); }
  if (q('simFrases')) q('simFrases').innerHTML = pil2Frases(c);
}

async function pilGuardar() {
  if (!ME || String(ME.email).toLowerCase() !== 'sales@protectgoservices.com') return;
  var el = document.getElementById('pilObjetivo');
  var v = el ? Math.max(0, Number(el.value) || 0) : 0;
  var r = await sb.from('amazon_config').upsert({
    clave: 'costo_objetivo_usd', valor: v,
    nota: 'Costo objetivo mensual de la operacion Amazon (USD). Solo direccion.',
    updated_at: new Date().toISOString(), updated_by: ME.email
  }, { onConflict: 'clave' });

  await loadAll(); render();
}

/* ==================================================================
   AMAZON RELAY v7 — Servicios Profesionales: estado editable en la
   tabla, paso automatico a Cobros, y plantilla de invoice corporativa.
   Estas funciones REEMPLAZAN a las de arriba.
   ================================================================== */
var AMZ_VERSION = 7;

/* Etiquetas del costo de operación.
   Dirección (sales@ / socio) ve el reparto con nombre propio; la operación ve
   los mismos números con etiqueta neutra: le sirve igual para operar y no
   expone el trato con la agencia externa. */
function lblCosto(conPct) {
  if (typeof ES_DIR !== 'undefined' && ES_DIR) return 'Juan Pablo' + (conPct ? ' · 60 %' : '');
  return 'Costo de operación';
}
function lblQueda() { return (typeof ES_DIR !== 'undefined' && ES_DIR) ? 'Queda en la agencia' : 'Margen de la agencia'; }
function esDir() { return (typeof ES_DIR !== 'undefined' && ES_DIR); }

/* ---------- 1 · ESTADO EDITABLE DESDE LA TABLA ---------- */
/* Solo los cinco estados operativos. "Facturado" y "Pagado" son del
   estado de COBRO y los mueve el sistema, nunca la persona. */
function spSelectEstado(s) {
  var cls = SP_CLS[s.estado] || 'n';
  var opts = SP_ESTADOS.map(function (e) {
    return '<option value="' + esc(e) + '"' + (s.estado === e ? ' selected' : '') + '>' + esc(e) + '</option>';
  }).join('');
  return '<select class="sp-estado-sel ' + cls + '" data-id="' + s.id + '"' +
    ' title="Cambia el estado del caso — se guarda solo"' +
    ' onchange="spCambiarEstado(\'' + s.id + '\', this.value, this)">' + opts + '</select>';
}

/* Guarda en segundo plano. Si queda Completado y el caso todavia no se
   ha cobrado, lo deja listo para facturar: con eso aparece solo en el
   desplegable "Caso a cobrar" de la pestana Cobros. */
async function spCambiarEstado(id, nuevo, el) {
  var s = SERVPRO.find(function (x) { return x.id === id; });
  if (!s) return;
  var anterior = s.estado;
  if (nuevo === anterior) return;
  if (SP_ESTADOS.indexOf(nuevo) < 0) return toast('Estado no valido');

  if (el) { el.disabled = true; el.classList.add('sp-guardando'); }

  var upd = { estado: nuevo };
  /* el estado de cobro es del sistema: solo se toca si el caso aun no tiene cobro */
  if (!s.cobro_id) upd.estado_cobro = 'Pendiente de facturar';

  var r = await sb.from('amazon_servicios_pro').update(upd).eq('id', id);
  if (el) { el.disabled = false; el.classList.remove('sp-guardando'); }
  if (r && r.error) {
    if (el) el.value = anterior;
    return toast('No se pudo guardar: ' + r.error.message);
  }

  /* refleja el cambio de una vez, sin esperar a la recarga */
  s.estado = nuevo;
  if (upd.estado_cobro) s.estado_cobro = upd.estado_cobro;
  if (el) { el.className = 'sp-estado-sel ' + (SP_CLS[nuevo] || 'n'); }

  try {
    await eventoAudit('editado', 'Servicio profesional: ' + anterior + ' → ' + nuevo +
      ' (' + (s.tipo_servicio || '') + ')', { cliente_id: s.cliente_id, servpro_id: id });
  } catch (e) { }

  if (nuevo === 'Completado' && !s.cobro_id) {
    toast('Completado — ya aparece en 💵 Cobros como caso a cobrar');
  } else {
    toast('Estado actualizado');
  }
  await loadAll(); render();
}

/* El estado de cobro nunca se escribe a mano desde el formulario. */
function spEstadoCobroCalculado() {
  var ed = EDIT.servpro ? SERVPRO.find(function (x) { return x.id === EDIT.servpro; }) : null;
  if (ed && ed.cobro_id) return ed.estado_cobro || 'Facturado';  /* ya cobrado: no se toca */
  return 'Pendiente de facturar';
}

/* ---------- 2 · PLANTILLA DE INVOICE (OPERYX GROUP / PROTECTGO) ---------- */
function imprimirInvoice(id) {
  var i = INVOICES.find(function (x) { return x.id === id; });
  if (!i) return;
  var c = cli(i.cliente_id) || {};
  var items = i.items || [];
  var esFee = function (it) { return /administrative processing fee/i.test(it.descripcion || ''); };
  var lineas = items.filter(function (it) { return !esFee(it); });
  var subtotal = Number(i.subtotal != null ? i.subtotal : lineas.reduce(function (a, it) { return a + Number(it.total || 0); }, 0));
  var feePct = Number(i.fee_pct || 0);
  var fee = Number(i.fee != null ? i.fee : (feePct ? Math.round(subtotal * feePct) / 100 : 0));
  var total = Number(i.total != null ? i.total : subtotal + fee);
  var metodo = i.metodo_pago || '—';

  var filas = lineas.map(function (it) {
    return '<tr>' +
      '<td>' + esc(it.descripcion || '') + '</td>' +
      '<td class="c">' + (it.qty != null ? esc(it.qty) : 1) + '</td>' +
      '<td class="c">' + fmt$(it.rate) + ' USD</td>' +
      '<td class="c">' + fmt$(it.total) + ' USD</td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="4" style="color:#777">—</td></tr>';

  $('printArea').innerHTML =
  '<div class="pgprint pgprint-page">' +
    '<div class="ivhdr">' +
      '<div class="ivlogo"><img src="' + (window.PG_LOGO_OPERYX || '') + '" alt="" onerror="this.style.display=\'none\'"><div class="ivlogo-txt">OPERYX<span>GROUP</span></div></div>' +
      '<div class="ivlogo r"><img src="' + (window.PG_LOGO_PROTECTGO || '') + '" alt="" onerror="this.style.display=\'none\'"><div class="ivlogo-txt">Protect<span class="go">GO</span></div></div>' +
    '</div>' +
    '<h1>INVOICE <span>/ COMPROBANTE DE PAGO</span></h1>' +
    '<div class="meta">' +
      '<div>' +
        '<b>Invoice #:</b> ' + esc(i.numero || '—') + '<br>' +
        '<b>Fecha de Emisión:</b> ' + fmtD(i.fecha) + '<br>' +
        '<b>Método de Pago:</b> ' + esc(metodo) +
      '</div>' +
      '<div class="r">' +
        '<div class="ivlbl">CLIENT INFORMATION</div>' +
        '<b>Compañía / Carrier:</b> ' + esc(c.empresa || '—') + (c.dba ? '<br><b>DBA:</b> ' + esc(c.dba) : '') + '<br>' +
        '<b>Representante Legal:</b> ' + esc(c.representante || '—') + '<br>' +
        '<b>USDOT #:</b> ' + esc(c.dot || '—') + ' &nbsp;|&nbsp; <b>MC #:</b> ' + esc(c.mc || '—') +
      '</div>' +
    '</div>' +
    '<table class="inv">' +
      '<tr><th>Descripción del Servicio / Gestión</th><th>Cantidad</th><th>Tarifa Unitaria</th><th>Total</th></tr>' +
      filas +
    '</table>' +
    '<div class="ivtot">' +
      '<div class="row"><span>Subtotal</span><b>' + fmt$(subtotal) + ' USD</b></div>' +
      (fee > 0
        ? '<div class="row"><span>Administrative Processing Fee: Credit Card Processing (' + (feePct || 3.9) + '%)</span><b>' + fmt$(fee) + ' USD</b></div>'
        : '') +
      '<div class="row tot"><span>TOTAL A PAGAR</span><b>' + fmt$(total) + ' USD</b></div>' +
    '</div>' +
    '<div class="terms">' +
      '<h3>SERVICE TERMS AND CONDITIONS (SLA) &amp; DISCLAIMER</h3>' +
      '<p>This invoice covers professional operational management/technical consulting services. ' +
      'Results depend strictly on Amazon Relay and FMCSA compliance decisions, which remain at their sole discretion. ' +
      'Operations and technical filings are executed on an On-Demand basis; therefore, processed fees are considered final.</p>' +
    '</div>' +
    '<div class="footline">Operyx Group &amp; ProtectGo — We run operations. You scale.</div>' +
  '</div>';
  window.print();
}

</script>
