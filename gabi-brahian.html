<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,1,800&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --pg-ink:#1B2D3A; --pg-ink-2:#162630; --pg-mint:#2DBFA3; --pg-mint-soft:#C4E8DF; --pg-mint-deep:#229A82;
  --pg-bg:#F4F7FA; --pg-card:#FFFFFF; --pg-line:#E7EDF2; --pg-txt:#28323B; --pg-muted:#6B7D89;
  --pg-pos:#1F9D6B; --pg-neg:#D5594F; --pg-warn:#B8841F;
  --pg-font-gabi:"Fraunces",Georgia,serif; --pg-font-title:"Montserrat","Arial Black",sans-serif;
  --pg-font-body:"Inter",Arial,Helvetica,sans-serif; --pg-font-num:"JetBrains Mono","Courier New",monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--pg-bg); }
.pg-app { background: var(--pg-bg); color: var(--pg-txt); font-family: var(--pg-font-body); min-height: 100vh; display:flex; }
.pg-side { width: 262px; background: var(--pg-ink); color: #fff; padding: 28px 18px; flex-shrink: 0; position: sticky; top:0; height:100vh; overflow-y:auto; }
.pg-side .pg-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.pg-side .pg-brand .pg-logo { width: 40px; height: 40px; border-radius:10px; background:var(--pg-mint); display:flex;align-items:center;justify-content:center; font-family:var(--pg-font-title); font-weight:800; color:var(--pg-ink); }
.pg-side .pg-brand .pg-wordmark { font-family: var(--pg-font-gabi); font-style: italic; font-weight: 800; font-size: 24px; color: var(--pg-mint); letter-spacing: -0.5px; }
.pg-side .pg-tagline { font-size: 11.5px; color:#8da0ad; margin: -2px 0 22px 52px; letter-spacing:.03em;}
.pg-side a { display: flex; align-items: center; gap: 13px; padding: 12px 15px; border-radius: 11px; color: #b9c6d0; font-size: 14px; font-weight: 600; text-decoration: none; margin-bottom: 4px; transition: background .15s; cursor:pointer; }
.pg-side a .ico { width:20px; text-align:center; }
.pg-side a.on, .pg-side a:hover { background: rgba(45,191,163,.15); color: #fff; }
.pg-side a.on { box-shadow: inset 3px 0 0 var(--pg-mint); }
.pg-side .pg-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); font-size: 11.5px; color: #8da0ad; }
.pg-side .pg-logout { cursor:pointer; text-decoration:underline; }
.pg-main { flex: 1; padding: 32px 38px 60px; max-width: 1240px; }
.pg-top { margin-bottom: 22px; }
.pg-top h1 { font-family: var(--pg-font-title); font-size: 26px; font-weight: 800; color: var(--pg-ink); margin: 0; }
.pg-top .pg-sub { color: var(--pg-muted); font-size: 14px; margin-top: 5px; max-width:760px; }
.pg-eyebrow { font-family: var(--pg-font-body); font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--pg-mint-deep); margin-bottom: 6px; }
.pg-kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.pg-kpi { flex: 1; min-width: 175px; background: var(--pg-card); border: 1px solid var(--pg-line); border-radius: 16px; padding: 16px 18px; position: relative; overflow: hidden; box-shadow: 0 1px 3px rgba(27,45,58,.04); }
.pg-kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--pg-mint); }
.pg-kpi .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pg-muted); }
.pg-kpi .val { font-family: var(--pg-font-num); font-size: 25px; font-weight: 600; color: var(--pg-ink); margin: 7px 0 3px; font-variant-numeric: tabular-nums; }
.pg-kpi .val.neg { color: var(--pg-neg); } .pg-kpi .val.pos { color: var(--pg-pos); }
.pg-kpi .sub { font-size: 11.5px; color: var(--pg-muted); }
.pg-card { background: var(--pg-card); border: 1px solid var(--pg-line); border-radius: 18px; padding: 22px; margin-bottom:20px; box-shadow: 0 1px 3px rgba(27,45,58,.04); }
.pg-card h2 { font-family: var(--pg-font-title); font-size: 17.5px; font-weight: 800; color: var(--pg-ink); margin: 0 0 4px; }
.pg-card .pg-purpose { color: var(--pg-muted); font-size: 13px; margin: 0 0 14px; }
.pg-table { width: 100%; border-collapse: collapse; }
.pg-table th { text-align: left; font-size: 11px; color: var(--pg-muted); text-transform: uppercase; letter-spacing: .04em; padding: 9px 8px; border-bottom: 2px solid var(--pg-ink); font-weight: 700; }
.pg-table td { padding: 10px 8px; font-size: 13px; color: #3a4751; border-bottom: 1px solid var(--pg-line); vertical-align: middle; }
.pg-table tr:hover td { background: #FAFCFD; }
.pg-table td.num { font-family: var(--pg-font-num); font-variant-numeric: tabular-nums; color: var(--pg-ink); font-weight: 600; }
.pg-table td.num.neg { color: var(--pg-neg); } .pg-table td.num.pos { color: var(--pg-pos); }
.pg-pill { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space:nowrap;}
.pg-pill.ok   { background: #E3F4EF; color: var(--pg-pos); }
.pg-pill.due  { background: #FCEEEC; color: var(--pg-neg); }
.pg-pill.warn { background: #FBF3E2; color: var(--pg-warn); }
.pg-pill.muted{ background:#EEF2F5; color:var(--pg-muted); }
.pg-warn-box   { background: #FBF3E2; border: 1px solid #EAD09A; border-radius: 12px; padding: 13px 17px; color: #8a6a1d; font-size:13px; margin-bottom:14px; }
.pg-danger-box { background: #FCEEEC; border: 1px solid #F0C2BD; border-radius: 12px; padding: 13px 17px; color: #9c3d35; font-size:13px; margin-bottom: 14px;}
.pg-headline { display:flex; align-items:flex-start; gap:14px; margin-bottom: 18px; }
.pg-semaforo { width:20px; height:20px; border-radius:50%; flex-shrink:0; margin-top:4px; box-shadow: 0 0 0 5px rgba(0,0,0,.04); }
.pg-semaforo.green { background: var(--pg-pos); } .pg-semaforo.amber { background: var(--pg-warn); } .pg-semaforo.red { background: var(--pg-neg); }
.pg-headline-text { font-family: var(--pg-font-title); font-size: 21px; font-weight:800; color: var(--pg-ink); line-height:1.3; margin:0;}
.pg-headline-sub { color: var(--pg-muted); font-size:13px; margin-top:5px; }
.pg-section { display:none; } .pg-section.on { display:block; }
.pg-grid-2 { display:grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
@media (max-width: 980px) { .pg-grid-2 { grid-template-columns: 1fr; } }
.pg-chart-wrap { position:relative; height: 260px; }
.pg-chart-wrap.tall { height: 340px; }
.pg-rank { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--pg-line); gap:10px; }
.pg-rank:last-child { border-bottom:none; }
.pg-rank .rk-name { font-weight:700; color:var(--pg-ink); font-size:13.5px; }
.pg-rank .rk-badge { font-family: var(--pg-font-num); font-size: 11.5px; color: var(--pg-mint-deep); font-weight:700; text-align:right; }
.pg-loading { color: var(--pg-muted); font-size:13px; font-family: var(--pg-font-num); padding: 20px 0; }
.pg-footnote { font-size: 11.5px; color: var(--pg-muted); margin-top: 26px; border-top:1px solid var(--pg-line); padding-top:14px; line-height:1.6; }
.pg-login-wrap { max-width:380px; margin:80px auto; background:var(--pg-card); border:1px solid var(--pg-line); border-radius:18px; padding:32px; text-align:center; box-shadow:0 1px 3px rgba(27,45,58,.06); }
.pg-login-wrap h2 { font-family:var(--pg-font-title); color:var(--pg-ink); margin:8px 0 6px; }
.pg-login-wrap p { color:var(--pg-muted); font-size:13px; margin:0 0 18px; }
.pg-login-wrap input { width:100%; padding:11px 13px; margin-bottom:10px; border:1px solid var(--pg-line); border-radius:10px; font-family:var(--pg-font-body); font-size:14px; }
.pg-login-wrap .pg-logo { width:44px; height:44px; border-radius:11px; background:var(--pg-mint); display:flex; align-items:center; justify-content:center; font-family:var(--pg-font-title); font-weight:800; color:var(--pg-ink); }
.pg-btn { background: var(--pg-ink); color:#fff; border:none; border-radius: 10px; padding: 11px 20px; font-family: var(--pg-font-body); font-weight:700; font-size: 13.5px; cursor:pointer; width:100%; }
.pg-btn.mint { background: var(--pg-mint); color: var(--pg-ink); }
.pg-login-err { color:var(--pg-neg); font-size:12.5px; margin-top:10px; min-height:16px; }
.pg-negado { max-width:420px; margin:80px auto; text-align:center; color:var(--pg-muted); }
.vpc-cli { border-bottom:1px solid var(--pg-line); padding:9px 4px; font-size:12.5px; }
.vpc-cli-top b { color:var(--pg-ink); }
.vpc-dim { color:var(--pg-muted); }
.vpc-badge { background:var(--pg-mint-soft); color:var(--pg-ink-2); border-radius:999px; padding:2px 9px; font-size:10.5px; font-weight:700; margin-left:6px; }
.vpc-cli-mid { color:var(--pg-muted); margin:3px 0; }
.vpc-cli-bot i { color:var(--pg-muted); }
.vpc-toggle { cursor:pointer; color:var(--pg-mint-deep); font-weight:700; font-size:11.5px; }
</style>
</head>
<body>
<div id="root-outer"></div>

<script>
/* ============================================================
GABI · Vista de Brahian Toro (líder comercial) — Fase 1 Tramo C
Fuente única: Supabase GABI (hivpqsepwsfmafamxkzy). NADA hardcodeado salvo
la lista de nombres del equipo (agentes.lider_id = Brahian) — se refresca
en vivo al cargar contra la tabla agentes, con este arreglo como respaldo
si esa consulta falla por RLS.
Acceso: RLS ya deja pasar a brahian@protectgoservices.com (candado
paquete_incentivos_bos_registros aplicado 12-ago). Esta pantalla filtra a
SOLO su equipo aunque el permiso técnico sea de agencia completa.
============================================================ */
const SB_URL = "https://hivpqsepwsfmafamxkzy.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpdnBxc2Vwd3NmbWFmYW14a3p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzOTIxNjUsImV4cCI6MjA5MTk2ODE2NX0.pPe1qtWJhnx8Ffo4bvuwVF-tVrkPSmO63Kl7pKWQYqM";
const SB = window.supabase.createClient(SB_URL, SB_ANON);

const EQUIPO_RESPALDO = ["Carolina Sepulveda","Daniela Arbelaez","Dayanna Jaramillo","Juan Baquero",
  "Luis Miguel Ascanio","Maria Alejandra Garcia","Mau Ramirez","Samuel Pulgarin","Sandra Bolivar",
  "Simon Restrepo","Valentina Londoño","Valeria Valencia","Veronica Montoya","Victor Amaro",
  "Andrea Perez","Andres Alzate","Andres Torrealba","Dana Berrocal","Dayan Atehortua",
  "Evelyn Arboleda","Javier Jimenez","Jorge Escobar","Juan Jaramillo","Michel Gallego","Paola Bustos","Xiomara Arango"];
let EQUIPO = EQUIPO_RESPALDO.slice();

const esc = (s) => (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUSD = (n) => (n===null||n===undefined||isNaN(n)) ? "—" : "$" + Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtUSD0 = (n) => (n===null||n===undefined||isNaN(n)) ? "—" : "$" + Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
const fmtPct = (n,d=1) => (n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toFixed(d) + "%";
const enEquipo = (nombre) => EQUIPO.some(n => n.trim().toLowerCase() === String(nombre||'').trim().toLowerCase());
function loadingHTML(){ return '<div class="pg-loading">Cargando datos en vivo de Supabase…</div>'; }
function errHTML(view, e){ return '<div class="pg-warn-box"><b>' + esc(view) + ' no cargó.</b> ' + esc((e && e.message) || 'Sin detalle.') + '</div>'; }
function semaforoDot(color) { return '<div class="pg-semaforo ' + color + '"></div>'; }

function renderShell(session){
  const email = session.user.email;
  document.getElementById('root-outer').innerHTML = `
    <div class="pg-app">
      <nav class="pg-side">
        <div class="pg-brand"><div class="pg-logo">PG</div><span class="pg-wordmark">GABI</span></div>
        <div class="pg-tagline">Brahian Toro · líder comercial</div>
        <a data-tab="resumen" class="on"><span class="ico">◎</span> Resumen del equipo</a>
        <a data-tab="ventas"><span class="ico">◆</span> Ventas por cliente</a>
        <a data-tab="fees"><span class="ico">≈</span> Fees y captura (guía)</a>
        <a data-tab="constancia"><span class="ico">▮</span> Constancia y patrones</a>
        <a data-tab="alertas"><span class="ico">!</span> Alertas</a>
        <div class="pg-foot">${esc(email)}<br><span class="pg-logout" id="btnLogout">Cerrar sesión</span></div>
      </nav>
      <main class="pg-main" id="root"></main>
    </div>`;
  document.getElementById('btnLogout').addEventListener('click', () => SB.auth.signOut());
  document.querySelectorAll('.pg-side a[data-tab]').forEach(a => {
    a.addEventListener('click', () => {
      document.querySelectorAll('.pg-side a[data-tab]').forEach(x=>x.classList.remove('on'));
      a.classList.add('on');
      showTab(a.dataset.tab);
    });
  });
  cargarEquipoYArrancar();
}

async function cargarEquipoYArrancar(){
  try {
    const { data, error } = await SB.from('agentes').select('id,nombre,lider_id').limit(5000);
    if (!error && data && data.length) {
      const brahianRow = data.find(a => String(a.nombre||'').trim().toLowerCase() === 'brahian toro');
      if (brahianRow) {
        const idBrahian = brahianRow.id;
        const equipo = data.filter(a => a.lider_id === idBrahian).map(a => a.nombre);
        if (equipo.length) EQUIPO = equipo;
      }
    }
  } catch(e) { /* usa EQUIPO_RESPALDO */ }
  showTab('resumen');
}

let CACHE = {};
async function fetchOnce(view, cols, filterFn){
  if (CACHE[view]) return CACHE[view];
  let q = SB.from(view).select(cols).limit(5000);
  if (filterFn) q = filterFn(q);
  const { data, error } = await q;
  if (error) { CACHE[view] = { error }; return CACHE[view]; }
  CACHE[view] = { data: data || [] };
  return CACHE[view];
}

async function showTab(tab){
  document.querySelectorAll('.pg-section').forEach(s=>s.classList.remove('on'));
  const root = document.getElementById('root');
  if (tab === 'resumen') return renderResumen(root);
  if (tab === 'ventas') return renderVentas(root);
  if (tab === 'fees') return renderFees(root);
  if (tab === 'constancia') return renderConstancia(root);
  if (tab === 'alertas') return renderAlertas(root);
}

/* ===================== 1. RESUMEN DEL EQUIPO ===================== */
async function renderResumen(root){
  root.innerHTML = `<div class="pg-top"><div class="pg-eyebrow">Tu equipo</div><h1>Resumen del equipo</h1>
    <div class="pg-sub">Solo lo que le pasa a tu equipo. Sin sueldos, costos salariales, utilidad por persona, liquidez ni retiro de socios.</div></div>
    <div id="resumenBody">${loadingHTML()}</div>`;
  const [piloto, estandar, patrones] = await Promise.all([
    fetchOnce('v_semaforo_piloto','mes,ventas,ventas_con_fee,fee_x_venta_equipo,meta_fee_x_venta,pct_ventas_con_fee,meta_pct_ventas_con_fee,alarma_activa,estado'),
    fetchOnce('v_estandar_agencia','agente,mes,ventas,total_fees_cobrados_mes,piso_mensual,le_falta_para_el_piso,pct_avance_piso,semaforo_piso'),
    fetchOnce('v_patrones_agente','agente,mes,ventas,ventas_prev,patron')
  ]);
  const body = document.getElementById('resumenBody');
  if (piloto.error) { body.innerHTML = errHTML('v_semaforo_piloto', piloto.error); return; }
  const p = (piloto.data||[])[0];
  const alarma = p ? p.alarma_activa : false;
  const estandarEquipo = (estandar.data||[]).filter(e => enEquipo(e.agente));
  const ultimoMes = estandarEquipo.length ? estandarEquipo.reduce((m,e)=> e.mes > m ? e.mes : m, estandarEquipo[0].mes) : null;
  const estandarMesActual = estandarEquipo.filter(e => e.mes === ultimoMes);
  const cumplen = estandarMesActual.filter(e => e.semaforo_piso === 'verde').length;
  const patronesEquipo = (patrones.data||[]).filter(p => enEquipo(p.agente));
  const caidaRitmo = patronesEquipo.filter(x => x.patron === 'CAIDA_DE_RITMO');
  body.innerHTML = `
    <div class="pg-headline">
      ${semaforoDot(alarma ? 'red' : 'green')}
      <div><p class="pg-headline-text">${alarma ? `Alarma del piso activa: el fee por venta del equipo va en ${fmtUSD(p.fee_x_venta_equipo)}, por debajo de la meta de ${fmtUSD0(p.meta_fee_x_venta)}.` : 'El equipo va dentro de la meta del piso.'}</p>
      <div class="pg-headline-sub">${p ? fmtPct(p.pct_ventas_con_fee) : '—'} de las ventas del mes ya tienen fee (meta ${p ? fmtPct(p.meta_pct_ventas_con_fee) : '—'}).</div></div>
    </div>
    <div class="pg-kpis">
      <div class="pg-kpi"><div class="lbl">Ventas del mes (equipo)</div><div class="val">${p ? p.ventas : '—'}</div><div class="sub">${p ? p.ventas_con_fee : '—'} con fee cobrado</div></div>
      <div class="pg-kpi"><div class="lbl">Estándar $1,500 cumplido</div><div class="val ${cumplen < estandarMesActual.length/2 ? 'neg':''}">${cumplen}/${estandarMesActual.length}</div><div class="sub">agentes con venta este mes</div></div>
      <div class="pg-kpi"><div class="lbl">Caída de ritmo</div><div class="val ${caidaRitmo.length ? 'neg':''}">${caidaRitmo.length}</div><div class="sub">agente(s) cayeron a menos de la mitad</div></div>
    </div>
    <div class="pg-card">
      <h2>Estándar $1,500 — tu equipo, mes en curso</h2>
      <p class="pg-purpose">Cobrado vs el piso, ordenado de quien está más lejos a quien ya lo superó.</p>
      <table class="pg-table"><thead><tr><th>Agente</th><th>Ventas</th><th>Cobrado</th><th>Le falta</th><th>% avance</th><th>Semáforo</th></tr></thead>
      <tbody>${estandarMesActual.sort((a,b)=>a.pct_avance_piso-b.pct_avance_piso).map(e => `<tr>
        <td>${esc(e.agente)}</td><td class="num">${e.ventas}</td>
        <td class="num pos">${fmtUSD(e.total_fees_cobrados_mes)}</td>
        <td class="num">${fmtUSD(e.le_falta_para_el_piso)}</td>
        <td class="num">${fmtPct(e.pct_avance_piso,0)}</td>
        <td>${e.semaforo_piso==='verde'?'<span class="pg-pill ok">cumple</span>':e.semaforo_piso==='amarillo'?'<span class="pg-pill warn">cerca</span>':'<span class="pg-pill due">lejos</span>'}</td>
      </tr>`).join('') || '<tr><td colspan="6">Sin ventas del equipo este mes todavía.</td></tr>'}</tbody></table>
    </div>
    <div class="pg-footnote">Equipo: ${EQUIPO.length} personas (activas + inactivas con histórico). Fuente: v_semaforo_piloto, v_estandar_agencia, v_patrones_agente — filtradas a tu equipo en esta pantalla.</div>`;
}

/* ===================== 2. VENTAS POR CLIENTE ===================== */
async function renderVentas(root){
  root.innerHTML = `<div class="pg-top"><div class="pg-eyebrow">Ventas por cliente</div><h1>Tu equipo — ventas por cliente</h1>
    <div class="pg-sub">1 venta = 1 cliente cerrado (el paquete completo: GL + Liability + Cargo), no 1 póliza suelta. El detalle de coberturas está un clic adentro.</div></div>
    <div id="ventasBody">${loadingHTML()}</div>`;
  const r = await fetchOnce('v_ventas_por_cliente','seller,cliente_key,insured,dba,sales_year,sales_month,polizas,coberturas_txt,policy_nums_txt,premium_paquete,fee_agencia_paquete,tiene_fee,cargos_carrier_paquete');
  const body = document.getElementById('ventasBody');
  if (r.error) { body.innerHTML = errHTML('v_ventas_por_cliente', r.error); return; }
  const rows = (r.data||[]).filter(x => enEquipo(x.seller));
  const porAgente = {};
  rows.forEach(x => {
    const k = x.seller || '(sin vendedor)';
    if (!porAgente[k]) porAgente[k] = { agente:k, clientes:0, con_fee:0, fee_total:0, detalle:[] };
    porAgente[k].clientes++;
    if (x.tiene_fee) porAgente[k].con_fee++;
    porAgente[k].fee_total += Number(x.fee_agencia_paquete||0);
    porAgente[k].detalle.push(x);
  });
  const lista = Object.values(porAgente).sort((a,b)=>b.clientes-a.clientes);
  body.innerHTML = `
    <div class="pg-card">
      <h2>Clientes cerrados por agente (todo el histórico disponible)</h2>
      <table class="pg-table"><thead><tr><th>Agente</th><th>Clientes</th><th>Con fee</th><th>Tasa de cobro</th><th>Fee de agencia total</th><th></th></tr></thead>
      <tbody>${lista.map((a,i) => `<tr>
        <td>${esc(a.agente)}</td><td class="num">${a.clientes}</td><td class="num">${a.con_fee}</td>
        <td class="num">${fmtPct(a.clientes ? a.con_fee/a.clientes*100 : 0,0)}</td>
        <td class="num pos">${fmtUSD(a.fee_total)}</td>
        <td><span class="vpc-toggle" data-i="${i}">ver clientes →</span></td>
      </tr><tr id="det${i}" style="display:none"><td colspan="6">${a.detalle.slice().sort((x,y)=>Number(y.polizas||0)-Number(x.polizas||0)).map(x => `
        <div class="vpc-cli"><div class="vpc-cli-top"><b>${esc(x.insured||x.cliente_key)}</b>${x.dba?` <span class="vpc-dim">(${esc(x.dba)})</span>`:''}<span class="vpc-badge">${x.polizas||0} cobertura(s)</span></div>
        <div class="vpc-cli-mid">${esc(x.coberturas_txt||'—')}</div>
        <div class="vpc-cli-bot">fee del paquete <b>${fmtUSD(x.fee_agencia_paquete)}</b> · premium ${fmtUSD(x.premium_paquete)} · pólizas: ${esc(x.policy_nums_txt||'—')} · cargos del carrier ${fmtUSD(x.cargos_carrier_paquete)} <i>(no son ingreso de la agencia)</i></div></div>`).join('') || 'Sin clientes.'}</td></tr>`).join('') || '<tr><td colspan="6">Sin datos del equipo.</td></tr>'}</tbody></table>
    </div>
    <div class="pg-footnote">Fuente: v_ventas_por_cliente (.limit(5000)). Fee visible = seller_fees (fee de agencia); los cargos del carrier (policy_fees) nunca cuentan como ingreso.</div>`;
  body.querySelectorAll('.vpc-toggle').forEach(el => el.addEventListener('click', () => {
    const row = document.getElementById('det' + el.dataset.i);
    row.style.display = row.style.display === 'none' ? '' : 'none';
  }));
}

/* ===================== 3. FEES Y CAPTURA (GUÍA) ===================== */
async function renderFees(root){
  root.innerHTML = `<div class="pg-top"><div class="pg-eyebrow">Fees y captura — GUÍA, no policía</div><h1>¿Cómo va cobrando tu equipo?</h1>
    <div class="pg-sub">El fee es contextual: depende de la complejidad de la póliza, no del premium. La referencia por canal es una guía de "así se suele cobrar", no una regla dura — la única vara dura es el estándar de $1,500/mes.</div></div>
    <div id="feesBody">${loadingHTML()}</div>`;
  const [fj, guia, ref] = await Promise.all([
    fetchOnce('v_desempeno_fee_justo','agente,mes,ventas,tasa_cobro_pct,captura_vs_tipico,oportunidad_perdida'),
    fetchOnce('v_fee_guia_asesor','agente,mes,ventas_mes,total_fees_cobrados_mes,promedio_fee_por_venta,mediana_fee_por_venta,sector,referencia_canal,referencia_canal_texto'),
    fetchOnce('v_fee_referencia_canal_actual','sector,fee_referencia,etiqueta')
  ]);
  const body = document.getElementById('feesBody');
  if (fj.error) { body.innerHTML = errHTML('v_desempeno_fee_justo', fj.error); return; }
  const fjEquipo = {};
  (fj.data||[]).filter(x => enEquipo(x.agente)).forEach(x => {
    if (!fjEquipo[x.agente] || x.mes > fjEquipo[x.agente].mes) fjEquipo[x.agente] = x;
  });
  const filas = Object.values(fjEquipo).sort((a,b)=>(b.tasa_cobro_pct||0)-(a.tasa_cobro_pct||0));
  body.innerHTML = `
    <div class="pg-card">
      <h2>Tasa de cobro por agente (mes más reciente con venta)</h2>
      <p class="pg-purpose">De cada 10 ventas, en cuántas se logró cobrar un fee. Captura vs típico: 1.0 = cobra lo esperado para ese tipo de póliza.</p>
      <table class="pg-table"><thead><tr><th>Agente</th><th>Mes</th><th>Ventas</th><th>Tasa de cobro</th><th>Captura vs típico</th></tr></thead>
      <tbody>${filas.map(f => `<tr><td>${esc(f.agente)}</td><td>${esc(f.mes)}</td><td class="num">${f.ventas}</td>
        <td class="num">${fmtPct(f.tasa_cobro_pct,0)}</td>
        <td>${f.captura_vs_tipico===null||f.captura_vs_tipico===undefined ? '<span class="pg-pill muted">sin cobros</span>' : Number(f.captura_vs_tipico)>=1 ? `<span class="pg-pill ok">${Number(f.captura_vs_tipico).toFixed(2)}x típico</span>` : `<span class="pg-pill warn">${Number(f.captura_vs_tipico).toFixed(2)}x típico</span>`}</td>
      </tr>`).join('') || '<tr><td colspan="5">Sin datos.</td></tr>'}</tbody></table>
    </div>
    ${ref.data && ref.data.length ? `<div class="pg-card"><h2>Referencia de fee por canal (guía, no ley)</h2>
      <p class="pg-purpose">"Un servicio así se cobra alrededor de esto" — no marca ventas individuales como falta.</p>
      <table class="pg-table"><thead><tr><th>Canal</th><th>Referencia</th></tr></thead>
      <tbody>${ref.data.map(r => `<tr><td>${esc(r.etiqueta||r.sector)}</td><td class="num">${fmtUSD0(r.fee_referencia)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div class="pg-footnote">Fuente: v_desempeno_fee_justo, v_fee_guia_asesor, v_fee_referencia_canal_actual. Solo seller_fees — nunca policy_fees.</div>`;
}

/* ===================== 4. CONSTANCIA Y PATRONES ===================== */
async function renderConstancia(root){
  root.innerHTML = `<div class="pg-top"><div class="pg-eyebrow">Constancia y patrones</div><h1>¿Quién es constante y quién no?</h1>
    <div class="pg-sub">Racha del estándar $1,500 y el perfil de venta de cada agente de tu equipo.</div></div>
    <div id="constBody">${loadingHTML()}</div>`;
  const sector = await fetchOnce('v_sector_resumen_paquete','sector,sales_year,sales_month,paquetes,filas_bos,fee_agencia_total,premium_total');
  const body = document.getElementById('constBody');
  body.innerHTML = `
    <div class="pg-card">
      <h2>Paquetes por sector (agencia — contexto)</h2>
      <p class="pg-purpose">Referencia de dónde está vendiendo la agencia; tu equipo aporta parte de este total.</p>
      <table class="pg-table"><thead><tr><th>Sector</th><th>Paquetes</th><th>Fee de agencia</th><th>Premium</th></tr></thead>
      <tbody>${(sector.error ? [] : (sector.data||[])).slice(0,15).map(s => `<tr><td>${esc(s.sector||'sin clasificar')}</td><td class="num">${s.paquetes}</td><td class="num pos">${fmtUSD0(s.fee_agencia_total)}</td><td class="num">${fmtUSD0(s.premium_total)}</td></tr>`).join('') || (sector.error ? errHTML('v_sector_resumen_paquete', sector.error) : '<tr><td colspan="4">Sin datos.</td></tr>')}</tbody></table>
    </div>
    <div class="pg-footnote">TODO: v_patrones_agente ya se usa en Resumen y Alertas; una vista de "racha del estándar por persona" (v_estandar_1500 histórica) queda pendiente de exponer aquí en detalle — hoy Resumen ya trae el mes en curso.</div>`;
}

/* ===================== 5. ALERTAS ===================== */
async function renderAlertas(root){
  root.innerHTML = `<div class="pg-top"><div class="pg-eyebrow">Alertas</div><h1>Qué necesita seguimiento hoy</h1>
    <div class="pg-sub">Patrones de tu equipo — caída de ritmo, vende sin cobrar, vende más y cobra menos.</div></div>
    <div id="alertasBody">${loadingHTML()}</div>`;
  const patrones = await fetchOnce('v_patrones_agente','agente,mes,ventas,ventas_prev,fees_cobrados,fees_prev,patron');
  const body = document.getElementById('alertasBody');
  if (patrones.error) { body.innerHTML = errHTML('v_patrones_agente', patrones.error); return; }
  const equipo = (patrones.data||[]).filter(x => enEquipo(x.agente));
  const grupos = { CAIDA_DE_RITMO: [], VENDE_SIN_COBRAR: [], VENDE_MAS_COBRA_MENOS: [] };
  equipo.forEach(x => { if (grupos[x.patron]) grupos[x.patron].push(x); });
  const bloque = (titulo, purpose, arr, render) => `<div class="pg-card"><h2>${titulo}</h2><p class="pg-purpose">${purpose}</p>
    ${arr.length ? arr.map(render).join('') : '<div class="pg-purpose">Sin casos actuales en tu equipo.</div>'}</div>`;
  body.innerHTML =
    bloque('Caída de ritmo', 'Cayeron a menos de la mitad de sus ventas del mes anterior.', grupos.CAIDA_DE_RITMO,
      x => `<div class="pg-rank"><span class="rk-name">${esc(x.agente)}</span><span class="rk-badge">${x.ventas_prev ?? '—'} → ${x.ventas} ventas</span></div>`) +
    bloque('Vende sin cobrar', 'Vendió y no cobró un solo fee el mes más reciente.', grupos.VENDE_SIN_COBRAR,
      x => `<div class="pg-rank"><span class="rk-name">${esc(x.agente)}</span><span class="rk-badge">${x.ventas} venta(s), $0 cobrado</span></div>`) +
    bloque('Vende más, cobra menos', 'Subió las ventas pero cobró menos fees que el mes pasado.', grupos.VENDE_MAS_COBRA_MENOS,
      x => `<div class="pg-rank"><span class="rk-name">${esc(x.agente)}</span><span class="rk-badge">${fmtUSD(x.fees_prev)} → ${fmtUSD(x.fees_cobrados)}</span></div>`) +
    `<div class="pg-footnote">Fuente: v_patrones_agente, filtrada a tu equipo. Candado de acceso ya aplicado (paquete_incentivos_bos_registros) — esta pantalla nunca muestra caja, retiros ni nómina.</div>`;
}

/* ===================== LOGIN GATE ===================== */
function renderLogin(){
  document.getElementById('root-outer').innerHTML = `
    <div class="pg-login-wrap">
      <div class="pg-logo" style="margin:0 auto 10px;">PG</div>
      <h2>Acceso · Brahian Toro</h2>
      <p>Inicia sesión con tu cuenta de Protect GO para ver el desempeño de tu equipo.</p>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="brahian@protectgoservices.com" required>
        <input type="password" id="loginPass" placeholder="Contraseña" required>
        <button class="pg-btn mint" type="submit" style="margin-top:6px;">Entrar</button>
      </form>
      <div class="pg-login-err" id="loginErr"></div>
    </div>`;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');
    errEl.textContent = "Entrando…";
    const { error } = await SB.auth.signInWithPassword({ email, password });
    if (error) errEl.textContent = "No se pudo entrar: " + error.message;
  });
}

async function boot(){
  const { data: { session } } = await SB.auth.getSession();
  if (!session) renderLogin(); else renderShell(session);
}
SB.auth.onAuthStateChange((_event, session) => {
  CACHE = {};
  if (session) renderShell(session); else renderLogin();
});
boot();
</script>
