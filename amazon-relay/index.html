    </div>
    <div class="pg-card">
      <h2>Cargar viaje</h2><div class="h2sub">Solo Cliente y Load ID son obligatorios — el resto lo llenas si lo tienes a mano.</div>
      ${editando ? editBar('load', editando.load_id_externo || editando.id.slice(0, 8)) : ''}
      ${editando ? '' : `<div class="paste-zone" id="pasteZone" tabindex="0">📸 Clic aquí y pega (Ctrl/Cmd+V) el screenshot del load, de referencia
        <small>Por ahora los campos se llenan a mano abajo mirando la imagen — la lectura automática es la siguiente fase.</small>
        <div class="pz-preview"></div>
      </div>`}
      <div class="field"><label>Cliente *</label><select id="ldCliente" onchange="ldRecalcAgencia()">${CLIENTES.map(c => `<option value="${c.id}" ${editando && editando.cliente_id === c.id ? 'selected' : ''}>${esGuia(c) ? '🧭 ' : ''}${esc(c.empresa)}</option>`).join('')}</select>
      <div id="ldEsquemaChip" class="pg-chipset" style="margin-top:6px"></div></div>
      <div class="frow2">
        <div class="field"><label>Load ID *</label><input id="ldLoadId" placeholder="Ej: AMZL-US1-2345678" value="${editando ? esc(editando.load_id_externo || '') : ''}"></div>
        <div class="field"><label>Tipo de carga <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="ldTipo" placeholder="Ej: Dry Van" value="${editando ? esc(editando.tipo_carga || '') : ''}"></div>
      </div>
      <div class="frow2">
        <div class="field"><label>Origen</label><input id="ldOrigen" placeholder="Ciudad, estado" value="${editando ? esc(editando.origen || '') : ''}"></div>
        <div class="field"><label>Destino</label><input id="ldDestino" placeholder="Ciudad, estado" value="${editando ? esc(editando.destino || '') : ''}"></div>
      </div>
      <div class="frow2">
        <div class="field"><label>Fecha del viaje</label><input id="ldFecha" type="date" value="${editando ? esc((editando.fecha_hora || '').slice(0, 10)) : hoyISO()}"></div>
        <div class="field"><label>Millas <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="ldMillas" type="number" value="${editando ? esc(editando.millas || '') : ''}"></div>
      </div>
      <div class="frow2">
        <div class="field"><label>GROSS DEL VIAJE $ <span style="font-weight:400;text-transform:none">(lo que paga Amazon — NO lo que recibe la agencia)</span></label><input id="ldTarifa" type="number" step="0.01" placeholder="Ej: 1924.00" value="${editando ? esc(editando.tarifa || '') : ''}" oninput="ldRecalcAgencia()"></div>
        <div class="field"><label>Camión / Placa <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="ldCamion" value="${editando ? esc(editando.camion_placa || '') : ''}"></div>
      </div>
      <div id="ldAgencia" class="pg-desglose">Elige cliente y escribe el gross para ver el desprendible.</div>
      <div class="field"><label>Conductor <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="ldConductor" value="${editando ? esc(editando.conductor || '') : ''}"></div>
      <div class="field"><label>Notas / soporte <span style="font-weight:400;text-transform:none">(opcional)</span></label><textarea id="ldNotas" rows="2">${editando ? esc(editando.notas || '') : ''}</textarea></div>
      <button class="pg-btn" onclick="crearLoad()">${editando ? 'Guardar cambios' : 'Confirmar y registrar'} <span class="a">→</span></button>
    </div>
  </div>`;
}

async function crearLoad() {
  const cliente_id = $('ldCliente').value;
  if (!cliente_id) return toast('Falta el cliente');
  if (!$('ldLoadId').value.trim()) return toast('Falta el Load ID');
  const row = {
    cliente_id, load_id_externo: $('ldLoadId').value.trim() || null, origen: $('ldOrigen').value.trim() || null,
    destino: $('ldDestino').value.trim() || null, fecha_hora: $('ldFecha').value ? $('ldFecha').value + 'T12:00:00' : null,
    millas: $('ldMillas').value || null, tarifa: $('ldTarifa').value || null, camion_placa: $('ldCamion').value.trim() || null,
    conductor: $('ldConductor').value.trim() || null, tipo_carga: $('ldTipo').value.trim() || null, notas: $('ldNotas').value.trim() || null,
  };
  /* v5 — el desprendible se guarda calculado (histórico estable si luego cambia el esquema) */
  row.agencia_monto = agenciaDeViaje(cli(cliente_id), row.tarifa).monto;
  if (EDIT.load) {
    const { error } = await sb.from('amazon_loads').update(row).eq('id', EDIT.load);
    if (error) return toast('Error: ' + error.message);
    await eventoAudit('editado', `Load ${row.load_id_externo || EDIT.load.slice(0, 8)} editado`, { cliente_id, load_id: EDIT.load });
    EDIT.load = null; toast('Viaje actualizado');
  } else {
    row.created_by = ME.email;
    const { data, error } = await sb.from('amazon_loads').insert(row).select().single();
    if (error) return toast('Error: ' + error.message);
    await evento('nota', `Load ${row.load_id_externo || data.id.slice(0, 8)} cargado (${row.origen || '—'} → ${row.destino || '—'})`, { cliente_id, load_id: data.id });
    toast('Viaje registrado');
  }
  _pastedImg = null; await loadAll(); render();
}

async function avanzarLoad(id, estado) {
  const l = LOADS.find(x => x.id === id);
  if (l && l.cobro_id) return toast('Este viaje sigue el estado de su cobro');
  /* v5 — 🧾 En cobro y 💰 Cobrado los pone el sistema; a mano no se llega ahí */
  if (ESTADOS_LOAD_AUTO.indexOf(estado) >= 0) return toast('"' + ESTADO_LBL[estado] + '" lo pone el sistema desde el cobro');
  const { error } = await sb.from('amazon_loads').update({ estado }).eq('id', id);
  if (error) return toast('Error: ' + error.message);
  await evento('cambio_estado', `Load ${l?.load_id_externo || id.slice(0, 8)} pasó a ${ESTADO_LBL[estado]}`, { cliente_id: l?.cliente_id, load_id: id });
  toast('Estado: ' + ESTADO_LBL[estado]); await loadAll(); render();
}

function editarLoad(id) { EDIT.load = id; render(); }

function eliminarLoad(id) {
  const l = LOADS.find(x => x.id === id);
  if (!l) return;
  const c = cli(l.cliente_id);
  const cobro = l.cobro_id ? COBROS.find(co => co.id === l.cobro_id) : null;
  pgConfirm({
    titulo: '¿Eliminar viaje?',
    cuerpo: `Vas a eliminar el load <b>${esc(l.load_id_externo || l.id.slice(0, 8))}</b>${cobro ? ` que está dentro del cobro <b>${esc(cobro.concepto || '')}</b> (${fmt$(cobro.monto || 0)}) del periodo <b>${fmtD(cobro.periodo_desde)} – ${fmtD(cobro.periodo_hasta)}</b>.` : '.'}`,
    guia: esGuia(c) ? 'Es el ejemplo guía del sistema — sirve de referencia para el equipo.' : null,
    aviso: cobro ? 'Este viaje está dentro de un cobro.' : null,
    extra: cobro ? `<label><input type="checkbox" id="delDesvincular" checked> Desvincular del cobro y borrarlo de todos modos</label>` : null,
    textoBoton: 'Sí, eliminar',
    onOk: async () => {
      if (cobro && !pgConfirmChecked('delDesvincular')) {
        toast('Desvincula el viaje del cobro primero');
        return;
      }
      if (cobro) {
        const { error: e1 } = await sb.from('amazon_loads').update({ cobro_id: null }).eq('id', id);
        if (e1) return toast('Error: ' + e1.message);
      }
      // TODO: si el FK de amazon_eventos.load_id bloquea el insert tras el delete, este evento ya se registra ANTES asi que no deberia fallar.
      await eventoAudit('eliminado', `Load ${l.load_id_externo || id.slice(0, 8)} eliminado`, { cliente_id: l.cliente_id, load_id: id });
      const { error } = await sb.from('amazon_loads').delete().eq('id', id);
      if (error) return toast('Error: ' + error.message);
      toast('Viaje eliminado'); await loadAll(); render();
    }
  });
}

/* ENTREGA: Libro de viajes con CRUD completo (crear/editar/eliminar), fecha sin hora
   (input type=date, se guarda a mediodia), chip de vinculo con cobro y bloqueo de avance
   de estado cuando el load esta vinculado a un cobro, filtro por cliente en el listado.
   Funciones declaradas: vLoads, rowLoad, crearLoad, avanzarLoad, editarLoad, eliminarLoad.
   TODO: lectura automatica del screenshot pegado (_pastedImg) sigue sin conectarse a los
   campos del formulario, igual que en v3 — queda manual.
   Supuesto: al eliminar un load vinculado a un cobro, si el checkbox no esta marcado se
   aborta sin desvincular ni borrar. */


/* ---------- 30-cobros.js ---------- */
/* ==================================================================
   AMAZON RELAY v4 · MODULO C — COBROS
   CRUD de cobros + herencia CARGAS -> COBRO con calculo automatico.
   Declara SOLO: vCobros, rowCobro, crearCobro, avanzarCobro, editarCobro,
   eliminarCobro, cbTipoChange, cbSvcChange, cbRefrescarLoads, cbRecalcular,
   cbToggleTodos, cbBuscarLoad, verLoadsDeCobro
   ================================================================== */

var _cbMontoManual = false;      // el operador piso el monto a mano
var _cbConceptoManual = false;   // el operador piso el concepto a mano
var _cbBusqueda = '';            // filtro visual de la lista de loads
/* v5 — de dónde nace el cobro: '' (nada elegido), 'viaje' o 'servpro'.
   Sin origen NO hay botón de registrar: un cobro huérfano ya no se puede crear. */
var _cbOrigen = '';
var _cbSinOrigen = false;        // escotilla admin (sales@): cobro manual sin origen

/* solo sales@ ve la escotilla de cobro manual sin origen */
function cbEsAdmin() { return !!(ME && ME.email && ME.email.toLowerCase().indexOf('sales@') === 0); }

/* servicios profesionales que se pueden cobrar: Completados, sin cobro y pendientes de facturar */
var _cbServprosElegibles = function () {
  return SERVPRO.filter(function (s) {
    return s.estado === 'Completado' && !s.cobro_id && (s.estado_cobro || 'Pendiente de facturar') === 'Pendiente de facturar';
  });
};

/* loads elegibles para un cobro: del cliente, en el periodo, sin cobro y entregado/facturado */
var _cbLoadsElegibles = function (cid, desde, hasta) {
  var d = desde || '0000-01-01', h = hasta || '9999-12-31';
  return LOADS.filter(function (l) {
    if (l.cliente_id !== cid) return false;
    if (l.cobro_id) return false;
    if (l.estado !== 'entregado' && l.estado !== 'facturado') return false;
    var f = (l.fecha_hora || '').slice(0, 10);
    if (!f) return false;
    return f >= d && f <= h;
  }).sort(function (a, b) { return (a.fecha_hora || '') < (b.fecha_hora || '') ? -1 : 1; });
};

/* ------------------------------------------------------------------ VISTA */
function vCobros() {
  var ed = EDIT.cobro ? COBROS.find(function (x) { return x.id === EDIT.cobro; }) : null;
  if (EDIT.cobro && !ed) EDIT.cobro = null;
  if (!EDIT.cobro) { _cbMontoManual = false; _cbConceptoManual = false; _cbBusqueda = ''; _cbOrigen = ''; _cbSinOrigen = false; }

  var cliSel = ed ? ed.cliente_id : (CLIENTES[0] ? CLIENTES[0].id : '');
  var desde = ed ? (ed.periodo_desde || haceISO(9)) : haceISO(9);
  var hasta = ed ? (ed.periodo_hasta || hoyISO()) : hoyISO();

  /* pinta la lista de loads y precarga el formulario justo despues del innerHTML */
  setTimeout(function () {
    if (VIEW !== 'cobros') return;
    if (!EDIT.cobro) cbOrigenChange(_cbOrigen, true);
  }, 0);

  var filas = COBROS.map(function (c) {
    var i = ESTADOS_COBRO.indexOf(c.estado);
    var n = i >= 0 && i < ESTADOS_COBRO.length - 1 ? ESTADOS_COBRO[i + 1] : null;
    var lds = loadsDeCobro(c.id);
    var chip = (c.tipo === 'semanal' && lds.length)
      ? `<span class="pg-chip disp" style="cursor:pointer" onclick="verLoadsDeCobro('${c.id}')">${lds.length} viaje${lds.length === 1 ? '' : 's'} · Gross ${fmt$(grossDeCobro(c.id))} ▾</span>`
      : '';
    var detalle = lds.length ? `<div id="lds_${c.id}" style="display:none;margin-top:6px;font-size:11.5px;color:var(--pg-muted);line-height:1.7">` +
      lds.map(function (l) { return `· <span class="mono">${esc(l.load_id_externo || '—')}</span> · ${fmtD((l.fecha_hora || '').slice(0, 10))} · ${fmt$(l.tarifa || 0)}`; }).join('<br>') +
      '</div>' : '';
    return `<tr><td><span class="linkish" onclick="abrirCliente('${c.cliente_id}')">${esc(cliName(c.cliente_id))}</span>
      <div style="font-size:11.5px;color:var(--pg-muted)">${esc(c.concepto)}${c.transaccion ? ` · <span class="mono">#${esc(c.transaccion)}</span>` : ''}${c.monto_manual ? ' · <b>manual</b>' : ''}</div>
      ${chip ? `<div class="pg-chipset">${chip}</div>` : ''}${detalle}</td>
      <td style="font-size:12px">${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}</td>
      <td class="num" style="text-align:right">${fmt$(c.monto)}${c.gross_total ? `<div style="font-size:10px;color:var(--pg-muted)">Gross ${fmt$(c.gross_total)}</div>` : ''}</td>
      <td>${pill(c.estado)}</td>
      <td style="white-space:nowrap">${n ? `<button class="pg-btn sm mint" title="Pasar a ${ESTADO_LBL[n]}" onclick="avanzarCobro('${c.id}','${n}')">→</button>` : ''}
      <button class="pg-btn sm secondary" title="Generar correo" onclick="correoCobro('${c.id}')">✉</button>
      <button class="pg-btn sm secondary" title="Generar invoice" onclick="invoiceDesdeCobro('${c.id}')">🧾</button>
      <button class="pg-actbtn" title="Editar" onclick="editarCobro('${c.id}')">✏️</button>
      <button class="pg-actbtn" title="Eliminar" onclick="eliminarCobro('${c.id}')">🗑️</button></td></tr>`;
  }).join('') || '<tr><td colspan="5" style="color:var(--pg-muted)">Sin cobros aún.</td></tr>';

  return `
  <div class="pg-eyebrow">Cobros externos</div><h1>Cobros</h1>
  <div class="pg-sub">Un cobro nace de un <b>viaje entregado</b> o de un <b>servicio profesional completado</b> — nunca de la nada. Flujo: Registrado → Autorizado → Enviado a FAM → Fondos validados → Pagado. Al llegar a Fondos validados/Pagado, los viajes pasan solos a 💰 Cobrado.</div>
  <div class="two">
    <div class="pg-card">
      <h2>Libro de cobros</h2>
      <table class="pg-table"><thead><tr><th>Cliente / Concepto</th><th>Periodo</th><th style="text-align:right">Monto</th><th>Estado</th><th></th></tr></thead><tbody>
      ${filas}
      </tbody></table>
      <div id="correoOut"></div>
    </div>
    <div class="pg-card">
      <h2>${ed ? 'Editar cobro' : 'Registrar un cobro'}</h2>
      <div class="h2sub">${ed ? 'Cambia lo que necesites y guarda. Los viajes vinculados no se tocan.' : 'Un cobro siempre nace de algo ya registrado: un viaje entregado o un servicio profesional completado. Elige el origen y el resto se llena solo.'}</div>
      ${ed ? editBar('cobro', ed.concepto || 'cobro') : ''}

      ${ed ? '' : `<div class="field"><label>¿Qué vas a cobrar? *</label>
        <div class="cb-origen">
          <button type="button" class="cb-opt" id="cbOptViaje" onclick="cbOrigenChange('viaje')">🚚 Viaje / Carga logística<small>Viajes entregados sin cobrar</small></button>
          <button type="button" class="cb-opt" id="cbOptServpro" onclick="cbOrigenChange('servpro')">✳️ Servicio profesional<small>Casos completados sin facturar</small></button>
        </div>
      </div>`}

      <!-- ORIGEN: VIAJES -->
      <div id="cbPanelViaje" class="${ed ? '' : 'hidden'}">
        <div class="field"><label>Cliente *</label><select id="cbCliente" onchange="cbRefrescarLoads()">${CLIENTES.map(function (c) { return `<option value="${c.id}"${c.id === cliSel ? ' selected' : ''}>${esGuia(c) ? '🧭 ' : ''}${esc(c.empresa)}${c.dot ? ' · DOT ' + esc(c.dot) : ''}</option>`; }).join('')}</select></div>
        <div class="frow2">
          <div class="field"><label>Desde</label><input id="cbDesde" type="date" value="${desde}" onchange="cbRefrescarLoads()"></div>
          <div class="field"><label>Hasta</label><input id="cbHasta" type="date" value="${hasta}" onchange="cbRefrescarLoads()"></div>
        </div>
        <div id="cbHerencia" class="${ed ? 'hidden' : ''}">
          <div class="field"><label>Viajes entregados sin cobrar <span style="font-weight:400;text-transform:none">(marca los que entran en este cobro)</span></label>
            <input id="cbBuscar" oninput="cbBuscarLoad()" placeholder="Buscar por Load ID…" style="margin-bottom:6px">
            <div id="cbLoads" class="pg-loadpick"></div>
            <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px">
              <button type="button" class="pg-preset" onclick="cbToggleTodos()">Marcar / desmarcar todos</button>
              <span style="font-size:11.5px;color:var(--pg-muted)">Gross total: <b id="cbGross" class="num">$0.00</b></span>
            </div>
          </div>
        </div>
      </div>

      <!-- ORIGEN: SERVICIO PROFESIONAL -->
      ${ed ? '' : `<div id="cbPanelServpro" class="hidden">
        <div class="field"><label>Caso a cobrar *</label><select id="cbServpro" onchange="cbServproChange()">
          <option value="">— Elige el caso completado —</option>
          ${_cbServprosElegibles().map(function (s) { return `<option value="${s.id}">${esc(s.tipo_servicio || 'Servicio profesional')} · ${esc(cliName(s.cliente_id))}${s.id_caso ? ' · caso ' + esc(s.id_caso) : ''} — ${fmt$(s.precio || 0)}</option>`; }).join('')}
        </select>
        <div class="cb-lockrow">🔒 Cliente, concepto y precio se heredan del caso — no se digitan aquí.</div></div>
        <div id="cbServproFicha" class="cb-lock">Elige un caso para ver su ficha.</div>
      </div>`}

      <div class="field" style="margin-top:12px"><label>Monto ($) a debitar *</label><input id="cbMonto" type="number" step="0.01" placeholder="Ej: 169.12" value="${ed ? (ed.monto != null ? ed.monto : '') : ''}" ${ed ? '' : 'readonly'} oninput="_cbMontoManual=true"></div>
      <div id="cbDesglose" class="pg-desglose">${ed ? 'Cobro en edición — el monto es el que guardaste.' : 'Elige primero de dónde nace el cobro.'}</div>
      <div class="field" style="margin-top:12px"><label>Concepto <span style="font-weight:400;text-transform:none">(se llena solo — en servicio profesional lo pone el caso 🔒)</span></label><input id="cbConcepto" placeholder="Servicios de dispatching" value="${ed ? esc(ed.concepto || '') : ''}" oninput="_cbConceptoManual=true"></div>
      <div class="field"><label>Notas <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="cbNotas" value="${ed ? esc(ed.notas || '') : ''}"></div>
      ${ed
      ? `<button class="pg-btn" onclick="crearCobro()">Guardar cambios <span class="a">→</span></button>`
      : `<button class="pg-btn hidden" id="cbBtnRegistrar" onclick="crearCobro()">Registrar cobro <span class="a">→</span></button>
         <div id="cbAvisoOrigen" style="font-size:12px;color:var(--pg-muted);line-height:1.6">Elige arriba si cobras un <b>viaje</b> o un <b>servicio profesional</b>. Si no aparece lo que buscas, primero regístralo en 📸 Cargar viaje o en 🧩 Servicios Profesionales.
           ${cbEsAdmin() ? `<br><span class="linkish" style="font-size:11px" onclick="cbManualSinOrigen()">cobro manual sin origen (solo admin)</span>` : ''}
         </div>`}
    </div>
  </div>`;
}

/* fila compacta usada en el detalle de cliente */
function rowCobro(c) {
  var i = ESTADOS_COBRO.indexOf(c.estado);
  var next = i >= 0 && i < ESTADOS_COBRO.length - 1 ? ESTADOS_COBRO[i + 1] : null;
  return `<tr><td>${esc(c.concepto)}${c.transaccion ? `<div style="font-size:10.5px;color:var(--pg-muted)" class="mono">Trans #${esc(c.transaccion)}</div>` : ''}</td>
  <td style="font-size:12px">${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}</td>
  <td class="num" style="text-align:right">${fmt$(c.monto)}</td><td>${pill(c.estado)}</td>
  <td style="white-space:nowrap">${next ? `<button class="pg-btn sm mint" onclick="avanzarCobro('${c.id}','${next}')">→ ${ESTADO_LBL[next]}</button>` : ''}
  <button class="pg-btn sm secondary" onclick="correoCobro('${c.id}')">✉</button>
  <button class="pg-btn sm secondary" onclick="invoiceDesdeCobro('${c.id}')">🧾</button>
  <button class="pg-actbtn" title="Editar" onclick="editarCobro('${c.id}')">✏️</button>
  <button class="pg-actbtn" title="Eliminar" onclick="eliminarCobro('${c.id}')">🗑️</button></td></tr>`;
}

/* ------------------------------------------------- FORMULARIO / HERENCIA */
/* v5 — elige el ORIGEN del cobro. Sin origen no hay botón de registrar. */
function cbOrigenChange(origen, silencioso) {
  if (EDIT.cobro) return;
  _cbOrigen = origen || '';
  _cbSinOrigen = false;
  _cbMontoManual = false; _cbConceptoManual = false;
  if ($('cbOptViaje')) $('cbOptViaje').classList.toggle('on', _cbOrigen === 'viaje');
  if ($('cbOptServpro')) $('cbOptServpro').classList.toggle('on', _cbOrigen === 'servpro');
  if ($('cbPanelViaje')) $('cbPanelViaje').classList.toggle('hidden', _cbOrigen !== 'viaje');
  if ($('cbPanelServpro')) $('cbPanelServpro').classList.toggle('hidden', _cbOrigen !== 'servpro');
  if ($('cbMonto')) $('cbMonto').readOnly = true;
  /* el concepto solo se bloquea en servicio profesional (lo pone el caso); en viaje es editable */
  if ($('cbConcepto')) $('cbConcepto').readOnly = (_cbOrigen === 'servpro');
  if ($('cbConcepto') && !silencioso) $('cbConcepto').value = '';
  if (_cbOrigen === 'viaje') cbRefrescarLoads();
  else if (_cbOrigen === 'servpro') cbServproChange();
  else {
    if ($('cbMonto')) $('cbMonto').value = '';
    if ($('cbDesglose')) $('cbDesglose').innerHTML = 'Elige primero de dónde nace el cobro.';
  }
  cbActualizarBoton();
}

/* escotilla admin: permite un cobro sin viaje ni servicio detrás (casos raros) */
function cbManualSinOrigen() {
  if (!cbEsAdmin()) return toast('Solo el admin puede registrar un cobro sin origen');
  pgConfirm({
    titulo: '¿Cobro manual sin origen?',
    cuerpo: 'Vas a crear un cobro que <b>no queda amarrado a ningún viaje ni servicio</b>. Es la excepción, no la regla: si el trabajo existe, regístralo primero y cóbralo desde ahí para que no haya que redigitar nada.',
    aviso: 'Queda marcado como manual en el libro de cobros y en la auditoría.',
    textoBoton: 'Sí, cobro manual',
    onOk: function () {
      _cbOrigen = ''; _cbSinOrigen = true; _cbMontoManual = true;
      if ($('cbOptViaje')) $('cbOptViaje').classList.remove('on');
      if ($('cbOptServpro')) $('cbOptServpro').classList.remove('on');
      if ($('cbPanelViaje')) $('cbPanelViaje').classList.remove('hidden');
      if ($('cbHerencia')) $('cbHerencia').classList.add('hidden');
      if ($('cbPanelServpro')) $('cbPanelServpro').classList.add('hidden');
      if ($('cbMonto')) { $('cbMonto').readOnly = false; $('cbMonto').focus(); }
      if ($('cbDesglose')) $('cbDesglose').innerHTML = '⚠️ <b>Cobro manual sin origen</b> — escribe cliente, periodo, monto y concepto a mano.';
      cbActualizarBoton();
    }
  });
}

/* muestra u oculta el botón de registrar según haya (o no) un origen válido */
function cbActualizarBoton() {
  var btn = $('cbBtnRegistrar'), aviso = $('cbAvisoOrigen');
  if (!btn) return;
  var ok = false;
  if (_cbSinOrigen) ok = true;
  else if (_cbOrigen === 'viaje') ok = document.querySelectorAll('#cbLoads input.cbLd:checked').length > 0;
  else if (_cbOrigen === 'servpro') ok = !!($('cbServpro') && $('cbServpro').value);
  btn.classList.toggle('hidden', !ok);
  if (aviso) {
    aviso.classList.toggle('hidden', ok);
    if (!ok && _cbOrigen === 'viaje') aviso.innerHTML = 'Marca al menos <b>un viaje</b> para poder registrar el cobro. Si el viaje no aparece, revisa que esté en <b>✅ Entregado</b> y dentro del periodo.';
    else if (!ok && _cbOrigen === 'servpro') aviso.innerHTML = 'Elige el <b>caso</b> que vas a cobrar. Si no aparece, el caso todavía no está en <b>Completado</b> o ya fue facturado.';
  }
}

/* v5 — hereda cliente, concepto y precio del servicio profesional elegido (bloqueados) */
function cbServproChange() {
  var sel = $('cbServpro'), ficha = $('cbServproFicha');
  if (!sel) return;
  var s = SERVPRO.find(function (x) { return x.id === sel.value; });
  if (!s) {
    if (ficha) ficha.innerHTML = 'Elige un caso para ver su ficha.';
    if ($('cbMonto')) { $('cbMonto').value = ''; $('cbMonto').readOnly = true; }
    if ($('cbDesglose')) $('cbDesglose').innerHTML = 'Elige el caso: el precio lo trae el servicio, no se digita.';
    cbActualizarBoton();
    return;
  }
  var concepto = `${s.tipo_servicio || 'Servicio profesional'}${s.id_caso ? ' · caso ' + s.id_caso : ''}`;
  if (ficha) ficha.innerHTML = `🔒 <b>${esc(cliName(s.cliente_id))}</b><br>${esc(s.tipo_servicio || 'Servicio profesional')}${s.id_caso ? ' · caso <span class="mono">' + esc(s.id_caso) + '</span>' : ''}<br>Solicitado ${fmtD(s.fecha_solicitud)} · Precio del caso <b>${fmt$(s.precio || 0)}</b>`;
  if ($('cbMonto')) { $('cbMonto').value = s.precio != null ? Number(s.precio).toFixed(2) : ''; $('cbMonto').readOnly = true; }
  if ($('cbConcepto')) { $('cbConcepto').value = concepto; $('cbConcepto').readOnly = true; _cbConceptoManual = false; }
  _cbMontoManual = false;
  if ($('cbDesglose')) $('cbDesglose').innerHTML = `Servicio profesional · monto heredado del caso: <b>${fmt$(s.precio || 0)}</b>. Al registrarlo, el caso queda <b>Facturado</b>.`;
  cbActualizarBoton();
}

function cbRefrescarLoads() {
  var box = $('cbLoads');
  if (!box || EDIT.cobro) return;   // en edición no se tocan los viajes vinculados
  if (_cbOrigen !== 'viaje') return;
  var cid = $('cbCliente') ? $('cbCliente').value : null;
  var lds = _cbLoadsElegibles(cid, $('cbDesde') ? $('cbDesde').value : '', $('cbHasta') ? $('cbHasta').value : '');
  var aviso = '';
  /* v5 — la causa raíz de los cobros manuales fue una lista vacía: si el perido por defecto deja
     viajes cobrables por fuera, la ventana se abre sola en vez de mandar al operador a digitar. */
  if (!lds.length && cid) {
    var todos = _cbLoadsElegibles(cid, '', '');
    if (todos.length) {
      var f0 = (todos[0].fecha_hora || '').slice(0, 10);
      var fN = (todos[todos.length - 1].fecha_hora || '').slice(0, 10);
      if ($('cbDesde') && f0) $('cbDesde').value = f0;
      if ($('cbHasta') && fN > $('cbHasta').value) $('cbHasta').value = fN;
      lds = _cbLoadsElegibles(cid, $('cbDesde') ? $('cbDesde').value : '', $('cbHasta') ? $('cbHasta').value : '');
      aviso = '<div style="font-size:11.5px;color:#8a6d1f;background:#fff8e6;border:1px solid #f0dfae;border-radius:8px;padding:7px 9px;margin-bottom:7px;line-height:1.5">📅 Este cliente tenía viajes sin cobrar <b>fuera del periodo</b> — abrimos las fechas para que los veas. Ajústalas si cobras solo una parte.</div>';
    }
  }
  if (!lds.length) {
    box.innerHTML = '<div style="font-size:12px;color:var(--pg-muted);padding:8px 4px;line-height:1.5">Este cliente no tiene viajes <b>✅ Entregados sin cobrar</b>.<br>Cárgalo primero en <b>📸 Cargar viaje</b> y vuelve aquí — un cobro no nace de la nada.</div>';
  } else {
    box.innerHTML = aviso + lds.map(function (l) {
      var ag = l.agencia_monto != null ? Number(l.agencia_monto) : agenciaDeViaje(cli(l.cliente_id), l.tarifa).monto;
      return `<label data-lid="${esc((l.load_id_externo || '').toLowerCase())}"><input type="checkbox" class="cbLd" value="${l.id}" data-t="${Number(l.tarifa) || 0}" checked onchange="cbRecalcular()"><span><span class="mono">${esc(l.load_id_externo || '—')}</span> · ${fmtD((l.fecha_hora || '').slice(0, 10))} · Gross ${fmt$(l.tarifa || 0)}${ag != null ? ' · agencia ' + fmt$(ag) : ''}</span></label>`;
    }).join('');
  }
  cbBuscarLoad();
  cbRecalcular();
}

/* v5 — el operador decide pisar el monto a mano; queda registrado como manual */
function cbAjustarMontoManual() {
  _cbMontoManual = true;
  if ($('cbMonto')) { $('cbMonto').readOnly = false; $('cbMonto').focus(); }
  cbRecalcular();
}

function cbRecalcular() {
  if (!$('cbDesglose') || EDIT.cobro) return;
  var g = 0, n = 0;
  var chks = document.querySelectorAll('#cbLoads input.cbLd');
  for (var i = 0; i < chks.length; i++) { if (chks[i].checked) { g += Number(chks[i].dataset.t) || 0; n++; } }
  g = Math.round(g * 100) / 100;
  if ($('cbGross')) $('cbGross').textContent = fmt$(g);
  var c = cli($('cbCliente') ? $('cbCliente').value : null);
  var r = calcMontoEsquema(c, g);
  if (!_cbMontoManual && $('cbMonto')) { $('cbMonto').value = r.monto ? r.monto.toFixed(2) : ''; $('cbMonto').readOnly = true; }
  if (_cbSinOrigen) { cbActualizarBoton(); return; }
  $('cbDesglose').innerHTML = `🔒 <b>${n}</b> viaje${n === 1 ? '' : 's'} marcado${n === 1 ? '' : 's'} · Cliente <b>${esc(cliName(c ? c.id : null))}</b> · Gross total <b>${fmt$(g)}</b><br>Nivel/esquema heredado — ${esc(esquemaLabel(c))}: ${r.desglose}` +
    (_cbMontoManual
      ? ' · <b>monto puesto a mano</b> · <span class="linkish" onclick="_cbMontoManual=false;cbRecalcular()">volver al automático</span>'
      : ' · <span class="linkish" onclick="cbAjustarMontoManual()">ajustar monto manual</span>');
  /* concepto automatico */
  if (!_cbConceptoManual && !EDIT.cobro && $('cbConcepto') && _cbOrigen === 'viaje') {
    $('cbConcepto').value = `Dispatching ${fmtD($('cbDesde').value)} → ${fmtD($('cbHasta').value)} · ${n} viaje${n === 1 ? '' : 's'}`;
  }
  cbActualizarBoton();
}

function cbToggleTodos() {
  var chks = document.querySelectorAll('#cbLoads input.cbLd');
  var vis = [];
  for (var i = 0; i < chks.length; i++) {
    var lab = chks[i].parentElement;
    if (lab && lab.style.display !== 'none') vis.push(chks[i]);
  }
  if (!vis.length) return;
  var todos = vis.every(function (x) { return x.checked; });
  vis.forEach(function (x) { x.checked = !todos; });
  cbRecalcular();
}

/* filtro SOLO visual — nunca desmarca checkboxes */
function cbBuscarLoad() {
  _cbBusqueda = ($('cbBuscar') ? $('cbBuscar').value : '').trim().toLowerCase();
  var labs = document.querySelectorAll('#cbLoads label');
  for (var i = 0; i < labs.length; i++) {
    var id = labs[i].dataset.lid || '';
    labs[i].style.display = (!_cbBusqueda || id.indexOf(_cbBusqueda) >= 0) ? '' : 'none';
  }
}

/* despliega/oculta los loads de un cobro en el libro — sin re-render */
function verLoadsDeCobro(id) {
  var d = document.getElementById('lds_' + id);
  if (!d) return;
  d.style.display = (d.style.display === 'none' || !d.style.display) ? 'block' : 'none';
}

/* ------------------------------------------------------ CREAR / EDITAR */
async function crearCobro() {
  /* v5 — sin origen no se crea nada (salvo la escotilla admin) */
  var sp = null;
  if (!EDIT.cobro) {
    if (!_cbOrigen && !_cbSinOrigen) return toast('Elige primero qué vas a cobrar: un viaje o un servicio profesional');
    if (_cbOrigen === 'servpro') {
      sp = SERVPRO.find(function (x) { return x.id === ($('cbServpro') ? $('cbServpro').value : ''); });
      if (!sp) return toast('Elige el caso que vas a cobrar');
      if (sp.cobro_id) return toast('Ese caso ya tiene un cobro vinculado');
    }
  }
  var cliente_id = sp ? sp.cliente_id : ($('cbCliente') ? $('cbCliente').value : null);
  var monto = parseFloat($('cbMonto').value);
  if (!cliente_id || !monto) return toast('Falta cliente o monto');
  var tipo = EDIT.cobro ? ((COBROS.find(function (x) { return x.id === EDIT.cobro; }) || {}).tipo || 'semanal') : (_cbOrigen === 'servpro' ? 'servicio' : 'semanal');
  var concepto = $('cbConcepto').value.trim() || (tipo === 'semanal' ? 'Servicios de dispatching' : 'Servicio profesional');
  var base = {
    cliente_id: cliente_id, tipo: tipo, concepto: concepto,
    periodo_desde: ($('cbDesde') && $('cbDesde').value) || null, periodo_hasta: ($('cbHasta') && $('cbHasta').value) || null,
    monto: monto, notas: $('cbNotas').value.trim() || null
  };
  if (sp) { base.servpro_id = sp.id; base.periodo_desde = sp.fecha_solicitud || null; base.periodo_hasta = hoyISO(); }

  /* ---- modo edicion ---- */
  if (EDIT.cobro) {
    var idEd = EDIT.cobro;
    var cEd = COBROS.find(function (x) { return x.id === idEd; });
    base.monto_manual = (cEd && Number(cEd.monto) !== monto) ? true : (cEd ? cEd.monto_manual : null);
    var re = await sb.from('amazon_cobros').update(base).eq('id', idEd);
    if (re.error) return toast('Error: ' + re.error.message);
    await eventoAudit('editado', `Cobro editado · ${concepto} · ${fmt$(monto)}`, { cliente_id: cliente_id, cobro_id: idEd });
    EDIT.cobro = null; _cbMontoManual = false; _cbConceptoManual = false;
    toast('Cobro actualizado');
    await loadAll(); render();
    return;
    // TODO: reasignar loads en edición
  }

  /* ---- alta ---- */
  var ids = [], gross = 0;
  if (_cbOrigen === 'viaje') {
    var chks = document.querySelectorAll('#cbLoads input.cbLd');
    for (var i = 0; i < chks.length; i++) if (chks[i].checked) { ids.push(chks[i].value); gross += Number(chks[i].dataset.t) || 0; }
    gross = Math.round(gross * 100) / 100;
    if (!ids.length) return toast('Marca al menos un viaje');
  }
  base.gross_total = gross || null;
  base.monto_manual = (_cbMontoManual || _cbSinOrigen) || null;
  base.created_by = ME.email;
  if (_cbSinOrigen) base.notas = ((base.notas ? base.notas + ' · ' : '') + 'Cobro manual sin origen (admin)');

  var r = await sb.from('amazon_cobros').insert(base).select().single();
  if (r.error) return toast('Error: ' + r.error.message);
  var cobroId = r.data.id;

  if (ids.length) {
    var ru = await sb.from('amazon_loads').update({ cobro_id: cobroId, estado: 'facturado' }).in('id', ids);
    if (ru.error) toast('Cobro creado pero los viajes no se vincularon: ' + ru.error.message);
  }
  if (sp) {
    var rs = await sb.from('amazon_servicios_pro').update({ cobro_id: cobroId, estado_cobro: 'Facturado' }).eq('id', sp.id);
    if (rs.error) toast('Cobro creado pero el caso no se vinculó: ' + rs.error.message);
  }
  await eventoAudit('cobro_registrado',
    sp
      ? `Cobro ${fmt$(monto)} desde servicio profesional · ${concepto}`
      : `Cobro ${fmt$(monto)} · ${ids.length} viaje${ids.length === 1 ? '' : 's'} · Gross ${fmt$(gross)}${_cbSinOrigen ? ' · SIN ORIGEN (manual admin)' : (_cbMontoManual ? ' · monto manual' : '')}`,
    { cliente_id: cliente_id, cobro_id: cobroId });

  _cbMontoManual = false; _cbConceptoManual = false; _cbOrigen = ''; _cbSinOrigen = false;
  toast(sp ? 'Cobro registrado · caso marcado Facturado' : (ids.length ? `Cobro registrado · ${ids.length} viaje${ids.length === 1 ? '' : 's'} en cobro` : 'Cobro registrado'));
  await loadAll(); render();
}

function editarCobro(id) {
  var c = COBROS.find(function (x) { return x.id === id; });
  if (!c) return toast('No encuentro ese cobro');
  EDIT.cobro = id;
  _cbMontoManual = true; _cbConceptoManual = true;   // respeta lo guardado, no recalcula encima
  VIEW = 'cobros'; DETALLE = null;
  render();
  var m = $('main'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ------------------------------------------------------ MAQUINA DE ESTADOS */
async function avanzarCobro(id, estado) {
  var transaccion = null;
  if (estado === 'fondos_validados') { transaccion = prompt('Número de transacción (FAM):') || null; }
  var upd = { estado: estado };
  if (transaccion) upd.transaccion = transaccion;
  var r = await sb.from('amazon_cobros').update(upd).eq('id', id);
  if (r.error) return toast('Error: ' + r.error.message);
  var c = COBROS.find(function (x) { return x.id === id; });

  /* v5 — disparador de cierre: el cobro arrastra a sus viajes y a su servicio */
  var nLd = 0, nSp = 0, cerrado = (estado === 'fondos_validados' || estado === 'pagado');
  var sps = servprosDeCobro(id);
  if (cerrado) {
    nLd = loadsDeCobro(id).length;
    if (nLd) {
      var rl = await sb.from('amazon_loads').update({ estado: 'cobrado' }).eq('cobro_id', id);
      if (rl.error) toast('Viajes no actualizados: ' + rl.error.message);
    }
    nSp = sps.length;
    if (nSp) {
      var rsp = await sb.from('amazon_servicios_pro').update({ estado_cobro: 'Pagado' }).eq('cobro_id', id);
      if (rsp.error) toast('Servicio no actualizado: ' + rsp.error.message);
    }
  } else {
    /* reversa limpia si el cobro retrocede a un estado anterior al cierre */
    var ldsAtras = loadsDeCobro(id).filter(function (l) { return l.estado === 'cobrado'; });
    if (ldsAtras.length) {
      nLd = ldsAtras.length;
      await sb.from('amazon_loads').update({ estado: 'facturado' }).eq('cobro_id', id);
    }
    var spAtras = sps.filter(function (s) { return s.estado_cobro === 'Pagado'; });
    if (spAtras.length) {
      nSp = spAtras.length;
      await sb.from('amazon_servicios_pro').update({ estado_cobro: 'Facturado' }).eq('cobro_id', id);
    }
  }

  await evento('cambio_estado',
    `Cobro pasó a ${ESTADO_LBL[estado]}${transaccion ? ' · Trans #' + transaccion : ''}${nLd ? ' · ' + nLd + ' viaje(s) a ' + (cerrado ? 'Cobrado' : 'En cobro') : ''}${nSp ? ' · servicio a ' + (cerrado ? 'Pagado' : 'Facturado') : ''}`,
    { cliente_id: c ? c.cliente_id : null, cobro_id: id });
  if (estado === 'fondos_validados' && c) await generarReparto(c);
  toast('Estado: ' + ESTADO_LBL[estado] + (nLd ? ` · ${nLd} viaje${nLd === 1 ? '' : 's'} cobrado${nLd === 1 ? '' : 's'}` : ''));
  await loadAll();
  if (DETALLE) abrirCliente(DETALLE); else render();
}

/* ------------------------------------------------------------- ELIMINAR */
function eliminarCobro(id) {
  var c = COBROS.find(function (x) { return x.id === id; });
  if (!c) return toast('No encuentro ese cobro');
  var clc = cli(c.cliente_id);
  var lds = loadsDeCobro(id);
  var sps = servprosDeCobro(id);
  var rep = REPARTOS.find(function (r) { return r.cobro_id === id; });
  var inv = INVOICES.find(function (v) { return v.cobro_id === id; });

  var cuerpo = `Vas a eliminar el cobro <b>${esc(c.concepto)}</b> de <b>${esc(cliName(c.cliente_id))}</b> por <b>${fmt$(c.monto)}</b>.<br><br>Esto va a pasar:<br>` +
    `· Se elimina el cobro y su historial queda en eventos.<br>` +
    `· ${lds.length ? `<b>${lds.length}</b> viaje${lds.length === 1 ? '' : 's'} se desvincula${lds.length === 1 ? '' : 'n'} y vuelve${lds.length === 1 ? '' : 'n'} a estado <b>✅ Entregado</b>.` : 'No hay viajes vinculados.'}<br>` +
    `· ${sps.length ? `<b>${sps.length}</b> caso profesional vuelve a <b>Pendiente de facturar</b>.` : 'No hay servicio profesional vinculado.'}<br>` +
    `· ${rep ? 'Se borra el <b>reparto</b> (operario / opex / utilidad) de este cobro.' : 'No tiene reparto generado.'}<br>` +
    (inv ? `· Existe el invoice <b>${esc(inv.numero)}</b> por ${fmt$(inv.total)} — decide abajo qué hacer con él.` : '· No tiene invoice asociado.');

  pgConfirm({
    titulo: '¿Eliminar este cobro?',
    cuerpo: cuerpo,
    aviso: 'Esta acción no se puede deshacer.',
    guia: esGuia(clc) ? 'Es el ejemplo guía del sistema — sirve de referencia para el equipo.' : null,
    extra: inv ? `<label><input type="checkbox" id="delInvoice"> Eliminar también el invoice ${esc(inv.numero)}</label>` : null,
    textoBoton: 'Sí, eliminar',
    onOk: async function () {
      if (inv && !pgConfirmChecked('delInvoice')) { toast('Decide qué hacer con el invoice ' + inv.numero + ' primero'); return; }

      var resumen = `Cobro eliminado · ${c.concepto} · ${fmt$(c.monto)} · ${lds.length} viaje(s) desvinculado(s)${rep ? ' · reparto borrado' : ''}${inv ? ' · invoice ' + inv.numero + ' eliminado' : ''}`;
      await eventoAudit('eliminado', resumen, { cliente_id: c.cliente_id, cobro_id: id });

      if (rep) await sb.from('amazon_repartos').delete().eq('cobro_id', id);
      if (inv) {
        var ri = await sb.from('amazon_invoices').delete().eq('id', inv.id);
        if (ri.error) return toast('No se pudo borrar el invoice: ' + ri.error.message);
      }
      if (lds.length) await sb.from('amazon_loads').update({ cobro_id: null, estado: 'entregado' }).eq('cobro_id', id);
      if (sps.length) await sb.from('amazon_servicios_pro').update({ cobro_id: null, estado_cobro: 'Pendiente de facturar' }).eq('cobro_id', id);

      var rd = await sb.from('amazon_cobros').delete().eq('id', id);
      if (rd.error) return toast('Error: ' + rd.error.message);
      // TODO: si el FK de amazon_eventos impide borrar el cobro, registrar el evento solo con cliente_id
      if (EDIT.cobro === id) EDIT.cobro = null;
      toast('Cobro eliminado');
      await loadAll(); render();
    }
  });
}

/* ENTREGA (Módulo C — Cobros)
   FUNCIONA: vCobros con libro (chip expandible "N viajes · Gross $X" por cobro semanal),
   formulario con herencia cargas→cobro (lista automática de loads sin cobrar del cliente en el
   periodo, búsqueda visual por Load ID que no desmarca, marcar/desmarcar todos, gross en vivo,
   monto propuesto con calcMontoEsquema + desglose y flag de monto manual con link "recalcular
   automático", concepto autollenado editable), crearCobro (insert + update de loads a 'facturado'
   + eventoAudit), avanzarCobro (arrastra loads a 'cobrado' en fondos_validados/pagado, conserva
   prompt de transacción y generarReparto), editarCobro/crearCobro en modo edición con editBar,

var _spFiltro = 'Todos';

/* ---------- helpers de fecha proxima accion ---------- */
function _spDiasProxima(fecha) {
  if (!fecha) return null;
  const hoy = new Date(hoyISO() + 'T00:00:00');
  const fp = new Date(fecha + 'T00:00:00');
  return Math.round((fp - hoy) / 86400000);
}
function _spProximaHTML(fecha) {
  if (!fecha) return '—';
  const d = _spDiasProxima(fecha);
  if (d < 0) return `<span style="color:#C0392B">${fmtD(fecha)} · ⚠ vencida hace ${Math.abs(d)} día${Math.abs(d) === 1 ? '' : 's'}</span>`;
  if (d <= 7) return `<span style="color:#B7791F">${fmtD(fecha)}</span>`;
  return fmtD(fecha);
}

function spTipoChange() {
  const sel = $('spTipo');
  const otroWrap = $('spTipoOtroWrap');
  if (!sel) return;
  if (sel.value === 'otro') { otroWrap.style.display = ''; return; }
  otroWrap.style.display = 'none';
  const opt = sel.options[sel.selectedIndex];
  const precio = opt ? opt.getAttribute('data-precio') : null;
  if (precio && $('spPrecio')) $('spPrecio').value = precio;
}

async function crearServpro() {
  const cliente_id = $('spCliente').value;
  if (!cliente_id) return toast('Falta el cliente');
  const selTipo = $('spTipo');
  let tipo_servicio = '';
  if (selTipo.value === 'otro') tipo_servicio = ($('spTipoOtro').value || '').trim();
  else { const opt = selTipo.options[selTipo.selectedIndex]; tipo_servicio = opt ? opt.getAttribute('data-nombre') : ''; }
  if (!tipo_servicio) return toast('Falta el tipo de servicio');
  const row = {
    cliente_id, tipo_servicio,
    fecha_solicitud: $('spFecha').value || hoyISO(),
    estado: $('spEstado').value,
    id_caso: $('spCaso').value.trim() || null,
    link_safer: $('spSafer').value.trim() || null,
    fecha_proxima_accion: $('spProxima').value || null,
    precio: $('spPrecio').value || 0,
    estado_cobro: spEstadoCobroCalculado(),
  };
  if (EDIT.servpro) {
    const { error } = await sb.from('amazon_servicios_pro').update(row).eq('id', EDIT.servpro);
    if (error) return toast('Error: ' + error.message);
    await eventoAudit('editado', `Servicio profesional editado: ${tipo_servicio}`, { cliente_id, servpro_id: EDIT.servpro });
    EDIT.servpro = null; toast('Servicio actualizado');
  } else {
    row.created_by = ME.email;
    const { error } = await sb.from('amazon_servicios_pro').insert(row);
    if (error) return toast('Error: ' + error.message);
    await eventoAudit('creado', `Servicio profesional registrado: ${tipo_servicio}`, { cliente_id });
    toast('Servicio registrado');
  }
  await loadAll(); render();
}

function editarServpro(id) { EDIT.servpro = id; render(); }

  const s = SERVPRO.find(x => x.id === id);

    cuerpo: `Vas a eliminar el caso <b>${esc(s.tipo_servicio || '')}</b> de <b>${esc(cliName(s.cliente_id))}</b>.${notas.length ? ` Tiene <b>${notas.length}</b> nota${notas.length === 1 ? '' : 's'} en la bitácora — se borran también.` : ''}${s.cobro_id ? ' El cobro ya generado <b>NO se borra</b>, solo se desvincula.' : ''}`,

}

async function agregarNotaServpro(id) {

  if (error) return toast('Error: ' + error.message);
  toast('Nota agregada'); await loadAll(); render();
}

function eliminarNotaServpro(notaId, servicioId) {
  pgConfirm({
    titulo: '¿Eliminar nota?',
    cuerpo: 'Esta nota se borra de la bitácora del caso.',
    textoBoton: 'Sí, eliminar',

async function generarCobroServpro(id) {
  const s = SERVPRO.find(x => x.id === id);
  if (!s) return;
  if (s.cobro_id) return toast('Este caso ya tiene un cobro vinculado');
  const concepto = `${s.tipo_servicio || 'Servicio profesional'}${s.id_caso ? ' · caso ' + s.id_caso : ''}`;
  /* v5 — servicio_id apunta al TARIFARIO (amazon_servicios); el caso profesional va en servpro_id */
  const { data, error } = await sb.from('amazon_cobros').insert({
    cliente_id: s.cliente_id, tipo: 'servicio', servpro_id: id, concepto, monto: s.precio || 0,
    periodo_desde: s.fecha_solicitud || null, periodo_hasta: hoyISO(), created_by: ME.email
  }).select().single();
  if (error) return toast('Error: ' + error.message);
  const { error: e2 } = await sb.from('amazon_servicios_pro').update({ cobro_id: data.id, estado_cobro: 'Facturado' }).eq('id', id);
  if (e2) return toast('Error: ' + e2.message);
  await eventoAudit('cobro_registrado', `Cobro generado desde servicio profesional: ${concepto}`, { cliente_id: s.cliente_id, cobro_id: data.id });
  toast('Cobro generado — ve a 💵 Cobros para emitir el invoice');
  await loadAll(); render();
}

/* ---------- RESUMEN (con widget Próximas acciones) ---------- */
function vResumen() {
  const mes = new Date().getMonth(), yr = new Date().getFullYear();
  const cobrosMes = COBROS.filter(c => { const d = new Date(c.created_at); return d.getMonth() === mes && d.getFullYear() === yr; });
  const pagadoMes = cobrosMes.filter(c => ['fondos_validados', 'pagado'].includes(c.estado)).reduce((a, c) => a + Number(c.monto), 0);
  const pendiente = COBROS.filter(c => !['fondos_validados', 'pagado'].includes(c.estado)).reduce((a, c) => a + Number(c.monto), 0);
  const invPorCobrar = INVOICES.filter(i => i.estado === 'por_cobrar').length;
  const ult = COBROS.slice(0, 8);

  const abiertos = SERVPRO.filter(s => !['Completado', 'Cancelado/Fallido'].includes(s.estado));
  const porFacturar = SERVPRO.filter(s => (s.estado_cobro || 'Pendiente de facturar') === 'Pendiente de facturar').length;
  const proximas = SERVPRO.filter(s => s.fecha_proxima_accion && !['Completado', 'Cancelado/Fallido'].includes(s.estado))
    .filter(s => { const d = _spDiasProxima(s.fecha_proxima_accion); return d !== null && d <= 7; })
    .sort((a, b) => new Date(a.fecha_proxima_accion) - new Date(b.fecha_proxima_accion));

  const proximasHTML = proximas.length ? `
  <div class="pg-card" style="background:#FFF8F0;border-color:#F0C36D">
    <h2>⏰ Próximas acciones</h2><div class="h2sub">Casos vencidos o con vencimiento en los próximos 7 días.</div>
    <div class="pg-tl">
      ${proximas.map(s => `<div class="it"><span class="linkish" onclick="abrirServpro('${s.id}')">${esc(cliName(s.cliente_id))} · ${esc(s.tipo_servicio || '')}</span> — ${_spProximaHTML(s.fecha_proxima_accion)}<div class="w">${spPill(s.estado)}</div></div>`).join('')}
    </div>
  </div>` : '';

  return `
  <div class="pg-eyebrow">Dashboard operativo · Amazon Audit</div>
  <h1>Amazon Relay</h1>
  <div class="pg-sub">Trazabilidad de clientes, cobros semanales, tarifas e invoices.</div>
  <div class="pg-card" style="background:#F2FBF8;border-color:var(--pg-mint)">
    <h2>🧭 Guía rápida de registro</h2>
    <div class="h2sub">Todo se escribe UNA sola vez: <b>viaje o servicio → cobro → invoice</b>. Lo de más abajo hereda lo de más arriba.</div>
    <div style="font-size:12.8px;color:var(--pg-txt);line-height:2.1">
      <b>1.</b> 👤 Clientes → "Registrar cliente" (empresa + DOT + contrato es lo mínimo). Ahí queda su esquema (6%, fijo o piso) y de ahí lo hereda todo lo demás.<br>
      <b>2.</b> 📸 Cargar viaje → escribe el <b>GROSS del viaje</b> (lo que paga Amazon, ej. $1,924) — el sistema calcula solo lo que recibe la agencia. <b>Nunca escribas ahí el desprendible.</b><br>
      <b>3.</b> 🧩 Servicios Profesionales → casos que NO son dispatching (recuperación de cuenta, fondos, Safer/FMCSA).<br>
      <b>4.</b> 💵 Cobros → elige <b>qué vas a cobrar</b> (viaje o servicio), marca los viajes entregados y listo: cliente, gross y monto vienen solos y quedan bloqueados.<br>
      <b>5.</b> 🧾 Invoices → sale del cobro, ya numerado. Sin cobro no hay invoice.<br>
      <b>Estados del viaje:</b> tú mueves ⏳ Pendiente → 🚚 En camino → ✅ Entregado. 🧾 En cobro y 💰 Cobrado <b>los pone el sistema solo</b> cuando creas y pagas el cobro — por eso ya no hay que marcarlos a mano.<br>
      Hay un cliente <b>🧭 EJEMPLO GUÍA</b> ya armado de punta a punta en Clientes — ábrelo para ver cómo se ve todo lleno.
    </div>

function ivCobroChange() {
  const sel = $('ivCobro'), ficha = $('ivFicha'), btn = $('ivBtn'), aviso = $('ivAviso');
  const c = sel ? COBROS.find(x => x.id === sel.value) : null;
  if (!c) {
    if (ficha) ficha.innerHTML = 'Elige un cobro para ver qué se va a facturar.';
    if (btn) btn.classList.add('hidden');
    if (aviso) aviso.classList.remove('hidden');
    return;
  }
  const lds = loadsDeCobro(c.id);
  const sps = servprosDeCobro(c.id);
  if (ficha) ficha.innerHTML = `🔒 <b>${esc(cliName(c.cliente_id))}</b><br>${esc(c.concepto || '')}<br>` +
    (c.periodo_desde ? `Periodo ${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}<br>` : '') +
    (lds.length ? `${lds.length} viaje${lds.length === 1 ? '' : 's'} · Gross ${fmt$(grossDeCobro(c.id))}<br>` : '') +
    (sps.length ? `Servicio profesional: ${esc(sps[0].tipo_servicio || '')}<br>` : '') +
    `Total a facturar: <b>${fmt$(c.monto || 0)}</b>`;

}

async function crearInvoiceDelCobro() {
  const sel = $('ivCobro');
  const c = sel ? COBROS.find(x => x.id === sel.value) : null;
  if (!c) return toast('Elige el cobro que vas a facturar');
  if (INVOICES.some(i => i.cobro_id === c.id)) return toast('Ese cobro ya tiene invoice');
  const per = c.periodo_desde ? ` (${fmtD(c.periodo_desde)} – ${fmtD(c.periodo_hasta)})` : '';
  await crearInvoice({
    cliente_id: c.cliente_id,
    desc: (c.tipo === 'semanal' ? 'Dispatching Service — Amazon Relay: ' : 'Service / Management: ') + (c.concepto || '') + per,
    qty: 1, rate: Number(c.monto) || 0,
    fee: !!($('ivFee') && $('ivFee').checked),
    metodo: ($('ivMetodo') && $('ivMetodo').value.trim()) || null,
    cobro_id: c.id
  });
}

/* ---------- editar ---------- */
function editarInvoice(id) {
  EDIT.invoice = id;
  render();
}

async function guardarInvoice() {
  const id = EDIT.invoice;
  const i = INVOICES.find(x => x.id === id);
  if (!i) return toast('No se encontró el invoice');
  const fecha = $('ivEFecha').value || i.fecha;
  const metodo_pago = $('ivEMetodo').value.trim() || null;
  const estado = $('ivEEstado').value;
  const desc = $('ivEDesc').value.trim();
  const qty = parseFloat($('ivEQty').value) || 1;
  const rate = parseFloat($('ivERate').value) || 0;
  const conFee = $('ivEFee').checked;
  if (!desc || !rate) return toast('Falta descripción o tarifa');

  const subtotal = qty * rate;
  const fee_pct = conFee ? 3.9 : 0;
  const fee = conFee ? Math.round(subtotal * 0.039 * 100) / 100 : 0;
  const items = [{ descripcion: desc, qty, rate, total: subtotal }]; // TODO: solo se edita el primer item
  if (conFee) items.push({ descripcion: 'Administrative Processing Fee: Applicable for the use of the payment platform (3.9%).', qty: 1, rate: fee, total: fee });
  const total = subtotal + fee;

  const { error } = await sb.from('amazon_invoices').update({ fecha, metodo_pago, estado, items, subtotal, fee_pct, fee, total }).eq('id', id);
  if (error) return toast('Error: ' + error.message);

  await eventoAudit('editado', `Invoice ${i.numero} editado · total ${fmt$(total)}`, { cliente_id: i.cliente_id, invoice_id: id });
  toast('Invoice actualizado');
  EDIT.invoice = null;
  await loadAll(); render();
}

/* ---------- eliminar ---------- */
function eliminarInvoice(id) {
  const i = INVOICES.find(x => x.id === id);
  if (!i) return;
  const guia = esGuia(cli(i.cliente_id));
  pgConfirm({
    titulo: 'Eliminar invoice',
    cuerpo: `Vas a eliminar el invoice <b>${esc(i.numero)}</b> de <b>${esc(cliName(i.cliente_id))}</b> por <b>${fmt$(i.total)}</b>.`,
    aviso: (i.cobro_id
      ? 'Este invoice está vinculado a un cobro. El cobro <b>NO</b> se borra, solo queda sin invoice asociado. '
      : '') + 'La numeración OP-### no se reutiliza.',
    guia: guia ? 'Es el ejemplo guía del sistema — sirve de referencia para el equipo.' : null,
    textoBoton: 'Sí, eliminar invoice',
    peligro: true,
    onOk: async () => {
      // liberar dosieres que apuntan a este invoice para no romper el FK
      await sb.from('amazon_dosieres').update({ invoice_id: null }).eq('invoice_id', id);
      await eventoAudit('eliminado', `Invoice ${i.numero} eliminado (${fmt$(i.total)} total)`, { cliente_id: i.cliente_id });
      const { error } = await sb.from('amazon_invoices').delete().eq('id', id);
      if (error) return toast('Error: ' + error.message);
      toast('Invoice eliminado');
      await loadAll(); render();
    }
  });
}

/* ---------- auxiliares "res" ---------- */

/* Año y mes (0-11) de un valor tipo 'YYYY-MM-01' o timestamp, sin líos de zona horaria. */
function resMesInfo(m) {
  if (!m) return { y: null, i: null };
  const d = new Date(m.length === 10 ? m + 'T12:00:00' : m);
  return { y: d.getFullYear(), i: d.getMonth() };
}

/* Tarjeta ui.card de un cobro (usada en "Últimos cobros"). */
function resCobroCard(c) {
  const cl = cli(c.cliente_id);
  const nom = cl ? cl.empresa : cliName(c.cliente_id);
  const dot = cl && cl.dot ? cl.dot : null;
  const semana = c.periodo_desde ? ui.semanaISO(c.periodo_desde) : null;
  const memo = ui.memo(dot, semana || c.id);

  const meta = [
    dot ? `<span class="mono">DOT ${ui.esc(dot)}</span>` : null,
    c.concepto ? ui.esc(c.concepto) : null,
    `<span class="mono">${ui.esc(memo)}</span>`,
    c.transaccion ? `<span class="mono">#${ui.esc(c.transaccion)}</span>` : null
  ];

  const _cl = cli(c.cliente_id);
  const premSub = c.gross_total
    ? `${_cl && _cl.esquema_pct ? _cl.esquema_pct : 6} % de ${ui.money(c.gross_total)} gross`
    : (c.tipo === 'servicio' ? 'servicio profesional'
       : (_cl && _cl.esquema_tipo === 'fija' ? 'tarifa fija semanal' : 'dispatching semanal'));

  const PILL_MAP = {
    registrado: { cls: 'p-pend', txt: 'Registrado' },
    autorizado: { cls: 'p-cont', txt: 'Autorizado' },
    enviado_fam: { cls: 'p-cont', txt: 'Enviado a FAM' },
    fondos_validados: { cls: 'p-cot', txt: 'Fondos validados' },
    pagado: { cls: 'p-ren', txt: 'Pagado' },
    anulado: { cls: 'p-per', txt: 'Anulado' }
  };
  const pillO = PILL_MAP[c.estado] || { cls: 'p-pend', txt: c.estado || '—' };

  let u = 'gris';
  if (c.estado === 'pagado') u = 'mint';
  else if (c.estado === 'fondos_validados') u = 'ambar';
  else if (['registrado', 'autorizado', 'enviado_fam'].includes(c.estado)) {
    const dias = (Date.now() - new Date(c.created_at).getTime()) / 86400000;
    if (dias > 14) u = 'rojo';
  }

  return ui.card({
    id: c.id,
    nom: nom,
    meta: meta,
    prem: ui.money2(c.monto),
    premSub: premSub,
    pill: pillO,
    u: u,
    hecha: c.estado === 'pagado'
  });
}

/* Delegación de clics para la cinta de meses y las tarjetas de "Últimos cobros".
   Se engancha UNA sola vez sobre #vista (persiste entre renders porque solo se
   reemplaza su innerHTML), y los selectores están anclados a los contenedores
   que solo existen mientras la vista pintada es Resumen. */
function resPostRender() {
  const v = $('vista');
  if (!v || v.dataset.resBound) return;
  v.dataset.resBound = '1';

  ui.on(v, '#resCinta .mo[data-mes]', el => {
    const raw = el.dataset.mes;
    if (raw === '' || raw == null) return;
    const n = Number(raw);
    if (!isNaN(n)) resumenMes(n);
  });

  ui.on(v, '#resUltimos .card[data-card]', el => {
    const id = el.dataset.card;
    if (!id) return;
    nav('cobros');
    ui.hash.set('c', id);
  });
}

  const num = v => Number(v || 0);
  const ANIO = new Date().getFullYear();
  const MES_HOY = new Date().getMonth();

  /* fondos validados o pagado */
  const VAL = RENT.filter(r => r.validado);
  const valAnio = VAL.filter(r => resMesInfo(r.mes).y === ANIO);

  const cabecera = `
  <div class="pg-eyebrow">Dashboard operativo · Amazon Audit</div>
  <h1>Resumen del piloto</h1>
  <div class="pg-sub">Lo que entra, lo que cuesta servirlo y lo que queda. Todo sale de los cobros con fondos validados.</div>`;

  /* ---------- bloque de utilidad (kpis + strip + cinta) ---------- */
  let bloqueUtilidad;

  if (ERRORES.rent) {
    bloqueUtilidad = ui.err('la rentabilidad', 'refrescar()');
  } else {
    /* KPIs */
    const utilAnio = valAnio.reduce((a, r) => a + num(r.utilidad_neta), 0);
    const cobradoAnio = valAnio.reduce((a, r) => a + num(r.monto), 0);
    const costoAnio = valAnio.reduce((a, r) => a + num(r.operario) + num(r.opex) + num(r.comercial), 0);
    const mesesConCobro = new Set(valAnio.map(r => r.mes)).size;

    const enFlujo = RENT.filter(r => ['registrado', 'autorizado', 'enviado_fam'].includes(r.estado));
    const facturadoSinCobrar = enFlujo.reduce((a, r) => a + num(r.monto), 0);

    const kpisHtml = ui.kpis([
      {
        k: 'Utilidad neta del año', v: ui.money(utilAnio), raw: utilAnio,
        d: `${ui.int(mesesConCobro)} ${mesesConCobro === 1 ? 'mes' : 'meses'} de piloto`
      },
      {
        k: 'Cobrado del año', v: ui.money(cobradoAnio),
        d: `${ui.int(valAnio.length)} ${valAnio.length === 1 ? 'cobro validado' : 'cobros validados'}`
      },
      {
        k: 'Costo de servicio', v: ui.money(costoAnio),
        d: esDir() ? 'Juan Pablo 60 % del cobro' : '60 % del cobro'
      },
      {
        k: 'Facturado sin cobrar', v: ui.money(facturadoSinCobrar),
        d: `${ui.int(enFlujo.length)} ${enFlujo.length === 1 ? 'cobro en flujo' : 'cobros en flujo'}`
      }
    ]);

    /* Strip del mes seleccionado (MES_SEL) */
    const filasMes = valAnio.filter(r => resMesInfo(r.mes).i === MES_SEL);
    const cobradoMes = filasMes.reduce((a, r) => a + num(r.monto), 0);
    const operarioMes = filasMes.reduce((a, r) => a + num(r.operario), 0);
    const comercialMes = filasMes.reduce((a, r) => a + num(r.comercial), 0);
    const utilMes = filasMes.reduce((a, r) => a + num(r.utilidad_neta), 0);
    const margenMes = cobradoMes > 0 ? Math.round(100 * utilMes / cobradoMes) : null;

    const cfgComercial = CONFIG.comercial_pct_piloto;
    const comercialPendiente = !cfgComercial || cfgComercial.valor == null;

    const stripHtml = ui.strip({
      eye: `${ui.mesLargo(MES_SEL).toUpperCase()} ${ANIO}`,
      big: ui.money(utilMes), raw: utilMes, unit: 'utilidad neta del mes',
      nums: [
        { k: 'Cobrado', v: ui.money(cobradoMes), cls: 'mint' },
        { k: lblCosto(true), v: ui.money(operarioMes + comercialMes) },
        { k: lblQueda(), v: ui.money(utilMes) },
        { k: 'Margen', v: ui.pct(margenMes), cls: 'ambar' }
      ],
      aviso: null,
      ring: { pct: margenMes, cap: 'margen del mes' }
    });

    /* Panel "Tu piloto mes a mes" (cinta de 12 meses) o vacío si no hay cobros */
    let panelPiloto;
    if (!RENT.length) {
      panelPiloto = ui.panel({
        tit: 'Tu piloto mes a mes',
        sub: 'Verde = lo que queda para la agencia. Azul = lo que cuesta servir (operario + comercial). Juntos = lo cobrado.',
        body: ui.vacio('Todavía no hay cobros registrados. <b>Registra los que ya ocurrieron</b> (El Potrillo desde el 30 jul, Jean Miro desde el 17 ago) y esta pantalla se llena sola.')
      });
    } else {
      const meses = [];
      for (let i = 0; i < 12; i++) {
        const rows = valAnio.filter(r => resMesInfo(r.mes).i === i);
        const cobradoI = rows.reduce((a, r) => a + num(r.monto), 0);
        const operarioI = rows.reduce((a, r) => a + num(r.operario), 0);
        const comercialI = rows.reduce((a, r) => a + num(r.comercial), 0);
        const utilI = rows.reduce((a, r) => a + num(r.utilidad_neta), 0);
        meses.push({
          lbl: ui.mesCorto(i),
          num: cobradoI ? ui.moneyC(cobradoI) : '—',
          a: operarioI + comercialI,
          b: utilI,
          bneg: utilI < 0,
          futuro: i > MES_HOY,
          on: i === MES_SEL,
          v: i,
          tip: `<span class="tt">${ui.esc(ui.mesLargo(i))}</span>Cobrado <b>${ui.money(cobradoI)}</b><br>Costo <b>${ui.money(operarioI + comercialI)}</b><br>Utilidad <b>${ui.money(utilI)}</b>`
        });
      }
      panelPiloto = ui.panel({
        tit: 'Tu piloto mes a mes',
        sub: 'Verde = lo que queda para la agencia. Azul = lo que cuesta servir (operario + comercial). Juntos = lo cobrado.',
        leg: [{ color: '#229A82', lbl: 'Utilidad' }, { color: '#5B6BD6', lbl: 'Costo de servicio' }],
        body: `<div id="resCinta">${ui.cinta(meses)}</div>`
      });
    }

    bloqueUtilidad = kpisHtml + stripHtml + panelPiloto;
  }

  /* ---------- Últimos cobros (de COBROS, no depende de RENT) ---------- */
  const ult = COBROS.slice(0, 8);
  const ultimosHtml = ult.length
    ? `<div id="resUltimos">${ult.map(resCobroCard).join('')}</div>`
    : ui.vacio('Sin cobros aún. <b>Registra el primero</b> en 💵 Cobros.');

  return `
  ${cabecera}
  ${bloqueUtilidad}
  <div class="sec-t">Últimos cobros</div>
  <div class="sec-s">Los más recientes en el flujo.</div>
  ${ultimosHtml}
  ${(function () { setTimeout(resPostRender, 0); return ''; })()}`;
}



/* ================== v6 · E2 · Clientes + ficha acordeón ==================
   Estas definiciones sobrescriben a las anteriores del archivo. */
/* =====================================================================
   AMAZON RELAY · v6 · E2 — vClientes() + ficha acordeón (absorbe vClienteDetalle)
   Ejecutor E2. Prefijo propio: "clx" (evita chocar con el helper global
   `cli(id)`). Usa datos ya cargados por loadAll (CLIENTES, COBROS,
   INVOICES, RENOV, RENT) y los helpers ui.* / $ / esc / fmt$ / fmtD /
   pill / cliName / cli / esGuia / toast ya existentes en index.html.
   También reutiliza TAL CUAL (sin tocar su lógica): crearCliente(),
   esquemaTipoChange(), presetEsquema(), calcMontoEsquema(), esquemaLabel(),
   cargarDirectorio(), dirAutofill(), agregarNota(), eventoAudit(), EDIT.

   Estado propio (inicializado perezosamente dentro de vClientes(), nunca
   como statement suelto, para respetar "solo funciones" del entregable):
   CLI_F (chip activo), CLI_Q (texto del buscador). DETALLE (id de la
   ficha abierta) y EDIT.cliente ya son globales existentes — aquí se
   mantienen sincronizados entre sí mientras una ficha está abierta.

   Cero datos inventados: si un cliente no tiene cobros, su cifra es 0
   y se dice; si RENT/RENOV llegan null (falló su consulta), se tratan
   como vacíos sin inventar números.
   ===================================================================== */

/* ---------- filtros ---------- */
function clxTieneSaldo(c) {
  return COBROS.some(x => x.cliente_id === c.id && !['pagado', 'anulado'].includes(x.estado));
}
function clxPasaChip(c, f) {
  if (f === 'activo') return c.estado === 'activo';
  if (f === 'suspendido') return c.estado === 'suspendido';
  if (f === 'saldo') return clxTieneSaldo(c);
  return true; /* 'todos' */
}
function clxNorm(s) {
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
function clxPasaBusqueda(c, q) {
  if (!q) return true;
  const nq = clxNorm(q);
  return [c.empresa, c.dot, c.contrato, c.representante].some(v => clxNorm(v).includes(nq));
}

/* ---------- pólizas Amazon del cliente (RENOV cruzado por DOT) ---------- */
function clxPolizasInfo(c) {
  const rows = (Array.isArray(RENOV) ? RENOV : []).filter(r => c.dot && r.dot === c.dot);
  const vig = rows.filter(r => r.es_vigente);
  const premium = vig.reduce((a, r) => a + Number(r.premium_activo || 0), 0);
  const hoy = new Date();
  const futuras = rows.map(r => r.vence).filter(v => v && new Date(v + 'T12:00:00') >= hoy).sort();
  return {
    polizas: rows.length ? `${ui.int(vig.length)} · ${ui.money(premium)}` : null,
    primerVenc: futuras.length ? ui.fechaL(futuras[0]) : null
  };
}

/* ---------- tarjeta de cliente (libro) ---------- */
function clxCardCliente(c) {
  const PILL_CLI = {
    activo: { cls: 'p-ren', txt: 'Activo' },
    suspendido: { cls: 'p-per', txt: 'Suspendido' },
    recuperacion: { cls: 'p-cot', txt: 'Recuperación' },
    inactivo: { cls: 'p-pend', txt: 'Inactivo' }
  };
  const pillO = PILL_CLI[c.estado] || { cls: 'p-pend', txt: c.estado || '—' };

  const cobrosCli = COBROS.filter(x => x.cliente_id === c.id).filter(x => x.estado !== 'anulado');
  let u = 'gris';
  if (cobrosCli.length) {
    const vencido = cobrosCli.some(x => x.estado !== 'pagado' && x.periodo_hasta &&
      (Date.now() - new Date(x.periodo_hasta + 'T12:00:00').getTime()) / 86400000 > 14);
    const porValidar = cobrosCli.some(x => x.estado === 'fondos_validados');
    const todoPagado = cobrosCli.every(x => x.estado === 'pagado');
    if (vencido) u = 'rojo'; else if (porValidar) u = 'ambar'; else if (todoPagado) u = 'mint';
  }

  const cobradoPiloto = (Array.isArray(RENT) ? RENT : [])
    .filter(r => r.cliente_id === c.id && r.validado)
    .reduce((a, r) => a + Number(r.monto || 0), 0);

  const meta = [
    c.dot ? `<span class="mono">DOT ${ui.esc(c.dot)}</span>` : null,
    (c.contrato ? ui.esc(c.contrato) + ' · ' : '') + ui.esc(esquemaLabel(c)),
    c.representante ? ui.esc(c.representante) : null,
    c.created_at ? `desde ${ui.fecha(c.created_at)}` : null
  ];

  return ui.card({
    id: c.id,
    nom: ui.esc(c.empresa),
    extra: esGuia(c) ? ' <span class="pg-pill fin">GUÍA</span>' : '',
    abierta: DETALLE === c.id,
    meta: meta,
    prem: ui.money(cobradoPiloto),
    premSub: 'cobrado en el piloto',
    pill: pillO,
    u: u,
    acciones: [
      { lbl: 'Editar', act: 'edit' },
      { lbl: 'Nuevo cobro', act: 'cobro' },
      { lbl: 'Dosier', act: 'dos' }
    ]
  });
}

/* ---------- tarjeta compacta de cobro (dentro de la ficha) ---------- */
function clxCardCobro(c) {
  const cl = cli(c.cliente_id);
  const dot = cl && cl.dot ? cl.dot : null;
  const semana = c.periodo_desde ? ui.semanaISO(c.periodo_desde) : null;
  const memo = ui.memo(dot, semana || c.id);
  const PILL_COB = {
    registrado: { cls: 'p-pend', txt: 'Registrado' },
    autorizado: { cls: 'p-cont', txt: 'Autorizado' },
    enviado_fam: { cls: 'p-cont', txt: 'Enviado a FAM' },
    fondos_validados: { cls: 'p-cot', txt: 'Fondos validados' },
    pagado: { cls: 'p-ren', txt: 'Pagado' },
    anulado: { cls: 'p-per', txt: 'Anulado' }
  };
  const pillO = PILL_COB[c.estado] || { cls: 'p-pend', txt: c.estado || '—' };
  let u = 'gris';
  if (c.estado === 'pagado') u = 'mint';
  else if (c.estado === 'fondos_validados') u = 'ambar';
  else if (['registrado', 'autorizado', 'enviado_fam'].includes(c.estado) && c.periodo_hasta &&
    (Date.now() - new Date(c.periodo_hasta + 'T12:00:00').getTime()) / 86400000 > 14) u = 'rojo';

  const meta = [
    dot ? `<span class="mono">DOT ${ui.esc(dot)}</span>` : null,
    (c.periodo_desde || c.periodo_hasta) ? `${ui.fecha(c.periodo_desde)} → ${ui.fecha(c.periodo_hasta)}` : null,
    `<span class="mono">${ui.esc(memo)}</span>`,
    c.transaccion ? `<span class="mono">#${ui.esc(c.transaccion)}</span>` : null
  ];
  const premSub = c.gross_total ? `${ui.esc(esquemaLabel(cl))} de ${ui.money(c.gross_total)} gross`
    : (cl && cl.esquema_tipo === 'fija' ? 'tarifa fija semanal' : null);

  return ui.card({
    id: c.id, nom: ui.esc(c.concepto || 'Cobro'), meta: meta,
    prem: ui.money2(c.monto), premSub: premSub, pill: pillO, u: u, hecha: c.estado === 'pagado'
  });
}

/* ---------- tarjeta compacta de invoice (dentro de la ficha) ---------- */
function clxCardInvoice(i) {
  const cob = COBROS.find(x => x.id === i.cobro_id);
  const PILL_INV = {
    por_cobrar: { cls: 'p-cot', txt: 'Por cobrar' },
    pagado: { cls: 'p-ren', txt: 'Pagado' },
    anulado: { cls: 'p-per', txt: 'Anulado' }
  };
  const pillO = PILL_INV[i.estado] || { cls: 'p-pend', txt: i.estado || '—' };
  const meta = [
    i.fecha ? ui.fecha(i.fecha) : null,
    cob && cob.concepto ? ui.esc(cob.concepto) : null
  ];
  return ui.card({
    id: i.id, nom: `INV-${ui.esc(i.numero)}`, meta: meta,
    prem: ui.money2(i.total), pill: pillO,
    u: i.estado === 'pagado' ? 'mint' : (i.estado === 'anulado' ? 'gris' : 'ambar'),
    hecha: i.estado === 'pagado'
  });
}

/* ---------- ficha acordeón de un cliente ---------- */
function clxFichaHTML(c) {
  const id = c.id;

    { l: 'Pólizas con ProtectGo', v: pol.polizas },
    { l: 'Primer vencimiento', v: pol.primerVenc }

    ? cobrosCli.map(clxCardCobro).join('')

  const invCli = INVOICES.filter(x => x.cliente_id === id);
  const invHTML = invCli.length ? invCli.map(clxCardInvoice).join('') : ui.vacio('Sin invoices para este cliente.');

  const eventos = (window._cliEventosFor === id && Array.isArray(window._eventos)) ? window._eventos : null;
  const trazaLista = eventos === null
    ? '<div style="color:var(--pg-muted);font-size:12.5px">Cargando trazabilidad…</div>'
    : (eventos.length
      ? eventos.map(e => `<div class="evt"><div class="dot"></div><div>${ui.esc(e.detalle || e.tipo)}<div class="w">${ui.esc(e.quien || '')} · ${new Date(e.created_at).toLocaleString('es-CO')}</div></div></div>`).join('')
      : '<div style="color:var(--pg-muted);font-size:12.5px">Sin eventos todavía.</div>');
  const trazaHTML = trazaLista + `<div style="margin-top:12px"><input id="notaTxt" placeholder="Agregar nota…" style="width:100%;border:1px solid var(--pg-line);border-radius:9px;padding:8px 11px;font-size:13px"><button class="pg-btn sm" style="margin-top:8px" onclick="agregarNota('${id}')">Guardar nota</button></div>`;

}

/* ---------- lista de tarjetas (se repinta sola en el buscador) ---------- */
function clxListaInner() {
  const q = (typeof CLI_Q !== 'undefined' && CLI_Q) || '';
  const f = (typeof CLI_F !== 'undefined' && CLI_F) || 'todos';
  const lista = CLIENTES.filter(c => clxPasaChip(c, f) && clxPasaBusqueda(c, q));
  if (!lista.length) {
    return CLIENTES.length
      ? ui.vacio('Sin clientes que coincidan con este filtro o búsqueda.')
      : ui.vacio('Sin clientes registrados todavía. <b>Registra el primero</b> con el formulario de abajo.');
  }
  return lista.map(c => clxCardCliente(c) + (DETALLE === c.id ? clxFichaHTML(c) : '')).join('');
}
function clxRepintarLista() {
  const el = $('cliLista'); if (!el) return;
  el.innerHTML = clxListaInner();
  ui.mount(el);
}

/* ---------- abrir/cerrar ficha (acordeón) ---------- */
function clxToggleFicha(id) {
  if (DETALLE === id) {
    DETALLE = null;
    if (EDIT.cliente === id) EDIT.cliente = null;
    ui.hash.set('c', null);
    render();
    return;
  }
  DETALLE = id;
  EDIT.cliente = id; /* la ficha siempre muestra el formulario en modo edición de ESTE cliente */
  ui.hash.set('c', id);
  render();
}
function clxEditar(id) {
  if (DETALLE !== id) clxToggleFicha(id);
  else { EDIT.cliente = id; render(); }
}
async function clxCargarEventos(id) {
  try {
    const { data, error } = await sb.from('amazon_eventos').select('*').eq('cliente_id', id).order('created_at', { ascending: false }).limit(40);
    window._eventos = error ? [] : (data || []);
  } catch (e) { window._eventos = []; }
  window._cliEventosFor = id;
  if (DETALLE === id) render();
}

/* ---------- delegación de clics/teclado (una sola vez sobre #vista) + fetch de trazabilidad ---------- */
function clxPostRender() {
  const v = $('vista'); if (!v) return;
  if (!v.dataset.clxBound) {
    v.dataset.clxBound = '1';
    ui.on(v, '#cliChips .chip[data-chip]', el => { CLI_F = el.dataset.chip; render(); });
    /* acciones ANTES que el toggle de tarjeta: stopImmediatePropagation evita que
       clic en Editar/Nuevo cobro/Dosier también dispare el abrir/cerrar de la tarjeta */
    ui.on(v, '#cliLista [data-act]', (el, ev) => {
      ev.stopImmediatePropagation();
      const id = el.dataset.id, act = el.dataset.act;
      if (act === 'edit') clxEditar(id);
      /* TODO: "Nuevo cobro" y "Dosier" no tienen hoy una función reutilizable desde
         la ficha de cliente (crearCobro requiere el formulario de Cobros; generarDosier
         pide un load_id, no un cliente_id). Se deja el candado de próximamente hasta
         que E3/E4 expongan un punto de entrada por cliente_id. */
      else if (act === 'cobro') toast('Próximamente: nuevo cobro directo desde la ficha del cliente.');
      else if (act === 'dos') toast('Próximamente: generar dosier desde la ficha del cliente.');
    });
    ui.on(v, '#cliLista .card[data-card]', el => clxToggleFicha(el.dataset.card));
    v.addEventListener('input', e => {
      if (e.target && e.target.id === 'cliQ') { CLI_Q = e.target.value; clxRepintarLista(); }
    });
  }
  if (DETALLE && window._cliEventosFor !== DETALLE) clxCargarEventos(DETALLE);
  if (typeof cargarDirectorio === 'function') cargarDirectorio();
}

/* ---------- vista principal ---------- */
function vClientes() {
  /* estado propio, inicializado perezosamente (nunca como statement suelto fuera de función) */
  if (typeof window.CLI_F === 'undefined') window.CLI_F = 'todos';
  if (typeof window.CLI_Q === 'undefined') window.CLI_Q = '';

  /* hidratar DETALLE desde el hash al arrancar (#v=clientes&c=<id>); si el usuario
     cierra la ficha, ui.hash.set('c',null) borra la clave y esto no se vuelve a disparar */
  if (DETALLE == null) {
    const hc = ui.hash.read().c;
    if (hc && CLIENTES.some(x => x.id === hc)) { DETALLE = hc; EDIT.cliente = hc; }
  }

  const nTodos = CLIENTES.length;
  const nActivo = CLIENTES.filter(c => c.estado === 'activo').length;
  const nSuspendido = CLIENTES.filter(c => c.estado === 'suspendido').length;
  const nSaldo = CLIENTES.filter(clxTieneSaldo).length;

  const chipsHTML = ui.chips([
    { id: 'todos', lbl: 'Todos', n: nTodos, on: CLI_F === 'todos' },
    { id: 'activo', lbl: 'Activos', n: nActivo, on: CLI_F === 'activo' },
    { id: 'suspendido', lbl: 'Suspendidos', n: nSuspendido, on: CLI_F === 'suspendido' },
    { id: 'saldo', lbl: 'Con saldo pendiente', n: nSaldo, on: CLI_F === 'saldo' }
  ], ui.buscar('cliQ', 'Buscar por empresa, DOT o contrato'));

  /* el formulario de creación vive al final de la lista (punto 4 de la spec) SOLO
     cuando no hay ninguna ficha abierta: comparte ids (ncEmpresa, ncDot, ...) con el
     formulario de edición que va DENTRO de la ficha, y no pueden coexistir en el DOM */
  const formPanel = DETALLE ? '' : ui.panel({
    tit: 'Registrar cliente',
    sub: 'Si el cliente ya existe en la agencia, escógelo en el directorio y los datos se llenan solos. Solo Empresa, DOT y Contrato son lo mínimo — el resto es opcional.',
    body: `<div class="pb">${clxFormHTML(null)}</div>`
  });

  return `
  <div class="pg-eyebrow">Trazabilidad</div><h1>Clientes</h1>
  <div class="pg-sub">Cada cliente con su contrato, su esquema y su historial. Clic en un cliente para abrir la ficha debajo.</div>
  <div id="cliChips">${chipsHTML}</div>
  <div id="cliLista">${clxListaInner()}</div>
  ${formPanel}
  ${(function () { setTimeout(clxPostRender, 0); return ''; })()}`;
}

/* =====================================================================

   transacción. Es la regla más importante de esta vista.

/* ---------- filtros ---------- */
function cobPasaChip(c, f) {
  if (f === 'todos') return true;
  return c.estado === f;
}
function cobNorm(s) {
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
function cobPasaBusqueda(c, q) {
  if (!q) return true;
  var nq = cobNorm(q);
  var cl = cli(c.cliente_id);
  return [cl && cl.empresa, cl && cl.dot, c.concepto, c.transaccion].some(function (v) {
    return cobNorm(v).indexOf(nq) >= 0;
  });
}

/* ---------- pill / color por estado ---------- */
function cobPillDe(estado) {
  var MAP = {
    registrado: { cls: 'p-pend', txt: 'Registrado' },
    autorizado: { cls: 'p-cont', txt: 'Autorizado' },
    enviado_fam: { cls: 'p-cont', txt: 'Enviado a FAM' },
    fondos_validados: { cls: 'p-cot', txt: 'Fondos validados' },
    pagado: { cls: 'p-ren', txt: 'Pagado' },
    anulado: { cls: 'p-per', txt: 'Anulado' }
  };
  return MAP[estado] || { cls: 'p-pend', txt: estado || '—' };
}
function cobU(c) {
  if (c.estado === 'pagado') return 'mint';
  if (c.estado === 'fondos_validados') return 'ambar';
  if (c.estado !== 'anulado') {
    var dias = (Date.now() - new Date(c.created_at).getTime()) / 86400000;
    if (dias > 14) return 'rojo';
  }
  return 'gris';
}

/* ---------- acciones de la tarjeta: Avanzar → / Marcar pagado (candado) / Invoice ---------- */
function cobAcciones(c) {
  var i = ESTADOS_COBRO.indexOf(c.estado);
  var next = (i >= 0 && i < ESTADOS_COBRO.length - 1) ? ESTADOS_COBRO[i + 1] : null;
  var acciones = [];
  if (next === 'pagado') {
    acciones.push({
      lbl: 'Marcar pagado', act: 'pagar',
      disabled: !c.transaccion,
      title: !c.transaccion ? 'Sin # de transacción no se puede marcar pagado' : undefined
    });
  } else if (next) {
    acciones.push({ lbl: 'Avanzar → ' + (ESTADO_LBL[next] || next), act: 'avanzar' });
  }
  if (c.estado !== 'anulado') acciones.push({ lbl: 'Invoice 🧾', act: 'invoice' });
  return acciones;
}

/* ---------- tarjeta de cobro (misma receta de E1 punto 5) ---------- */
function cobCard(c) {
  var cl = cli(c.cliente_id);
  var dot = cl && cl.dot ? cl.dot : null;
  var semana = c.periodo_desde ? ui.semanaISO(c.periodo_desde) : null;
  var memo = ui.memo(dot, semana || c.id);
  var meta = [
    dot ? '<span class="mono">DOT ' + ui.esc(dot) + '</span>' : null,
    c.concepto ? ui.esc(c.concepto) : null,
    '<span class="mono">' + ui.esc(memo) + '</span>',
    c.transaccion ? '<span class="mono">#' + ui.esc(c.transaccion) + '</span>' : null
  ];
  var premSub = c.gross_total
    ? ui.esc(esquemaLabel(cl)) + ' de ' + ui.money(c.gross_total) + ' gross'
    : (cl && cl.esquema_tipo === 'fija' ? 'tarifa fija semanal' : null);
  return ui.card({
    id: c.id,
    nom: cliName(c.cliente_id),
    abierta: COB_ABIERTO === c.id,
    meta: meta,
    prem: ui.money2(c.monto),
    premSub: premSub,
    pill: cobPillDe(c.estado),
    u: cobU(c),
    hecha: c.estado === 'pagado',
    acciones: cobAcciones(c)
  });
}

/* ---------- # Transacción: editable SOLO para fam@ / sales@ / andres.lopez@ ---------- */
function cobPuedeEditarTransaccion() {
  var email = ((ME && ME.email) || '').toLowerCase();
  return email === 'fam@protectgoservices.com' ||
    email === 'sales@protectgoservices.com' ||

}
function cobTransaccionHTML(c) {

    '<button type="button" class="pg-btn sm mint" data-guardartrans="' + ui.esc(c.id) + '">Guardar</button>' +

async function cobGuardarTransaccion(id) {

/* ---------- "Cobrado vs comprometido por cliente" (ui.barrow) ---------- */
function cobBarrowsClientes() {
  var porCliente = {};
  COBROS.forEach(function (c) {
    if (!porCliente[c.cliente_id]) porCliente[c.cliente_id] = { total: 0, pagado: 0, validado: 0 };
    var g = porCliente[c.cliente_id];
    var m = Number(c.monto) || 0;
    g.total += m;
    if (c.estado === 'pagado') g.pagado += m;
    else if (c.estado === 'fondos_validados') g.validado += m;
  });
  var ids = Object.keys(porCliente).filter(function (id) { return porCliente[id].total > 0; });
  if (!ids.length) return ui.vacio('Sin cobros registrados todavía.');
  ids.sort(function (a, b) { return porCliente[b].total - porCliente[a].total; });
  return ids.map(function (id) {
    var g = porCliente[id];
    var marcas = g.validado ? [{ pos: g.pagado + g.validado, cls: 'prom', lab: 'validado ' + ui.moneyC(g.validado) }] : [];
    return ui.barrow({
      l: cliName(id), val: g.pagado, max: g.total, marcas: marcas,
      n: ui.money(g.pagado), nsub: 'de ' + ui.money(g.total)
    });
  }).join('');
}

/* ---------- lista de tarjetas (se repinta sola en el buscador) ---------- */
function cobListaInner() {
  var q = (typeof COB_Q !== 'undefined' && COB_Q) || '';
